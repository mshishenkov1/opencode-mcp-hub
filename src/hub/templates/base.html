<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hub — корпоративные MCP-серверы{% endblock %}</title>
  {% block head %}{% endblock %}
  <style>
    :root { color-scheme: light dark; }
    [hidden] { display: none !important; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0;
           padding: 2rem 1rem; line-height: 1.5; }
    main { max-width: 46rem; margin: 0 auto; }
    h1 { font-size: 1.5rem; }
    h2 { font-size: 1.15rem; }
    .card { border: 1px solid rgba(128,128,128,.35); border-radius: .6rem; padding: 1rem;
            margin-bottom: 1rem; }
    .muted { opacity: .75; font-size: .9rem; }
    .status { font-weight: 600; }
    .actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .75rem; }
    button, .btn { padding: .45rem .9rem; border-radius: .4rem; border: 1px solid rgba(128,128,128,.5);
                   background: transparent; cursor: pointer; font: inherit; text-decoration: none; }
    button.primary { border-color: #2f6f3e; }
    label { display: block; margin: .25rem 0; }
    code { background: rgba(128,128,128,.15); padding: .1rem .3rem; border-radius: .25rem; }
    /* Связь с Hub потеряна: заметная плашка и погашенный блок с устаревшим содержимым (R-W6). */
    #hub-connection { border-color: #a05a00; }
    .hub-stale { opacity: .45; }
  </style>
  <script src="{{ htmx_url }}" defer></script>
  <script src="{{ htmx_json_enc_url }}" defer></script>
  <script>
    // Double-submit CSRF: значение берётся из cookie, в HTML страницы токен не попадает (R-W6).
    document.addEventListener('htmx:configRequest', function (event) {
      var match = document.cookie.match(/(?:^|;\s*)hub_csrf=([^;]+)/);
      if (match) { event.detail.headers['X-CSRF-Token'] = decodeURIComponent(match[1]); }
    });
  </script>
  <script>
    // Общая обработка сбоев htmx для всех страниц Hub (R-W6).
    // Без неё htmx при ошибке ничего не подменяет, и страница неограниченно долго показывает
    // прежнее содержимое («Ожидаем подтверждения входа…»), хотя Hub недоступен.
    (function () {
      var RETRY_MS = 5000;
      // По одной записи на блок, чей запрос сорвался. Не одна ячейка на страницу: иначе
      // второй упавший блок вытесняет первый, и тот навсегда остаётся без повтора.
      var stalls = [];
      var timer = null;

      function byId(id) { return document.getElementById(id); }

      function stopTimer() {
        if (timer) { clearTimeout(timer); timer = null; }
      }

      function stallFor(elt) {
        for (var i = 0; i < stalls.length; i++) {
          if (stalls[i].elt === elt) { return stalls[i]; }
        }
        return null;
      }

      function drop(stall) {
        var index = stalls.indexOf(stall);
        if (index !== -1) { stalls.splice(index, 1); }
        stall.elt.classList.remove('hub-stale');
      }

      // Блоки, которых уже нет на странице (их подменил успешный ответ), забываем.
      function prune() {
        for (var i = stalls.length - 1; i >= 0; i--) {
          if (!document.contains(stalls[i].elt)) { drop(stalls[i]); }
        }
      }

      function showNotice(title, detail) {
        var box = byId('hub-connection');
        if (!box) { return; }
        byId('hub-connection-title').textContent = title;
        byId('hub-connection-detail').textContent = detail;
        box.hidden = false;
      }

      // Плашка висит ровно столько, сколько есть незакрытые сбои.
      function refreshNotice() {
        if (stalls.length) { return; }
        stopTimer();
        var box = byId('hub-connection');
        if (box) { box.hidden = true; }
      }

      // Запоминаем сорванный запрос, чтобы повторить именно его.
      function remember(detail) {
        var config = (detail && detail.requestConfig) || {};
        var elt = (detail && detail.elt) || config.elt;
        if (!elt) { return null; }
        var verb = String(config.verb || 'get').toLowerCase();
        var path = config.path || elt.getAttribute('hx-' + verb);
        if (!path) { return null; }
        var stall = stallFor(elt) || { elt: elt };
        stall.verb = verb;
        stall.path = path;
        stall.target = config.target || elt;
        stall.swap = elt.getAttribute('hx-swap');
        stall.inFlight = false;
        if (stalls.indexOf(stall) === -1) { stalls.push(stall); }
        elt.classList.add('hub-stale');
        return stall;
      }

      // Единственное место, где решается, можно ли повторить запрос.
      // userRequested — повтор запрошен человеком (кнопка «Повторить»): такому можно всё.
      // Автоматические пути (таймер, возврат сети, успех соседнего блока) вправе повторять
      // только выборку: молча переотправить POST/DELETE/PUT — это заново прислать токен и
      // заново запустить обмен по R-U13, заново отключить коннектор, заново выйти из Hub.
      function retry(stall, userRequested) {
        if (!window.htmx || stall.inFlight) { return; }
        if (!userRequested && stall.verb !== 'get') { return; }
        if (!document.contains(stall.elt)) { drop(stall); return; }
        var context = { source: stall.elt, target: stall.target };
        if (stall.swap) { context.swap = stall.swap; }
        stall.inFlight = true;
        var released = function () { stall.inFlight = false; };
        var request = window.htmx.ajax(stall.verb, stall.path, context);
        if (request && request.then) { request.then(released, released); } else { released(); }
      }

      function retryAll(userRequested) {
        stopTimer();
        prune();
        var list = stalls.slice();
        for (var i = 0; i < list.length; i++) { retry(list[i], userRequested); }
        refreshNotice();
      }

      function scheduleRetry() {
        stopTimer();
        timer = setTimeout(function () { retryAll(false); }, RETRY_MS);
      }

      function serverMessage(xhr) {
        try {
          var body = JSON.parse(xhr.responseText);
          if (body && body.message) { return String(body.message); }
        } catch (error) { /* тело не JSON — покажем только код ответа */ }
        return '';
      }

      // Обещать самовосстановление вправе только выборка — остальное ждёт человека.
      function retryHint(stall) {
        return stall.verb === 'get'
          ? 'Страница сама повторит попытку, пока связь не вернётся.'
          : 'Запрос менял данные, поэтому сам он не повторится: нажмите «Повторить», '
            + 'когда связь вернётся.';
      }

      function connectionLost(event, reason) {
        var stall = remember(event.detail);
        if (!stall) { return; }
        showNotice('Связь с Hub потеряна', reason + ' ' + retryHint(stall));
        scheduleRetry();
      }

      document.addEventListener('htmx:sendError', function (event) {
        connectionLost(event, 'Hub не отвечает: возможно, он перезапускается или пропала сеть. '
          + 'Показанное ниже устарело.');
      });

      document.addEventListener('htmx:timeout', function (event) {
        connectionLost(event, 'Hub не ответил вовремя. Показанное ниже устарело.');
      });

      document.addEventListener('htmx:responseError', function (event) {
        var stall = remember(event.detail);
        if (!stall) { return; }
        var xhr = (event.detail && event.detail.xhr) || {};
        var status = xhr.status || 0;
        var message = serverMessage(xhr);
        showNotice('Hub ответил ошибкой', message
          || ('Код ответа: ' + (status || '—') + '. Повторите попытку или обновите страницу.'));
        // 5xx — это, как правило, перезапуск Hub или потеря его зависимости: такое проходит само,
        // поэтому выборку возобновляем без участия пользователя. 4xx сам не пройдёт — только вручную.
        if (status >= 500) { scheduleRetry(); }
      });

      document.addEventListener('htmx:afterRequest', function (event) {
        var detail = event.detail || {};
        if (!detail.successful) { return; }
        var done = stallFor(detail.elt);
        if (done) { drop(done); }
        // Связь есть: сорванную выборку возобновляем сами, небезопасное ждёт человека.
        retryAll(false);
      });

      document.addEventListener('DOMContentLoaded', function () {
        var button = byId('hub-connection-retry');
        if (button) {
          // Нажатие человека — единственный повтор, которому позволено всё.
          button.addEventListener('click', function () { retryAll(true); });
        }
      });

      window.addEventListener('online', function () {
        retryAll(false);
      });
    })();
  </script>
</head>
<body>
<main>
  <div id="hub-connection" class="card" role="status" aria-live="polite" hidden>
    <p class="status" id="hub-connection-title">Связь с Hub потеряна</p>
    <p class="muted" id="hub-connection-detail"></p>
    <div class="actions">
      <button type="button" id="hub-connection-retry">Повторить</button>
    </div>
  </div>
  <h1>{% block heading %}Hub{% endblock %}</h1>
  {% block content %}{% endblock %}
</main>
</body>
</html>
