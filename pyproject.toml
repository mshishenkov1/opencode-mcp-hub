[project]
name = "opencode-mcp-hub"
version = "0.1.0"
description = "Hub: каталог корпоративных MCP-серверов, OAuth-фасад и proxy, вход через корпоративный SSO для OpenCode"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.28",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "authlib>=1.3",
    "cryptography>=43",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "redis>=5",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
mcp-hub = "hub.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "diff-cover",
    "mutmut>=2.4",
    "ruff",
    "mypy",
    "types-PyYAML",
    "respx>=0.21",
    "asgi-lifespan>=2",
]
postgres = ["asyncpg>=0.29"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "ac(id): привязка теста к критерию приёмки (например AC-01)",
    "flaky_suspect: тест помечен TEST-агентом как нестабильный",
]

[tool.coverage.run]
source = ["src"]

[tool.mutmut]
source_paths = ["src/"]
pytest_add_cli_args_test_selection = ["tests/"]

[tool.ruff]
line-length = 100

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
