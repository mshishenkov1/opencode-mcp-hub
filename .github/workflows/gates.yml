# Независимая проверка тех же quality gates на стороне CI (ТЗ §6.6):
# агент мог ошибиться локально, CI перепроверяет.
name: pipeline-gates

on:
  pull_request:
  push:
    branches:
      - "pipeline/**"

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Гейты G1–G6
        run: .venv/bin/python scripts/run_gates.py --run-id "ci-${{ github.run_number }}" --ci

      - name: Артефакты (отчёты гейтов и трасса)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gates-report
          path: |
            reports/gates-*.json
            reports/coverage.xml
          if-no-files-found: ignore
