{{- if .Values.externalSecret.enabled }}
{{- /*
Заготовка под external-secrets.io: сам Secret создаёт оператор, чарт лишь описывает,
какие ключи из какого хранилища тянуть. Имя целевого Secret совпадает с hub.secretName,
поэтому Deployment и Job миграций подхватывают его без дополнительных настроек.
*/ -}}
apiVersion: {{ .Values.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "hub.fullname" . }}
  labels:
    {{- include "hub.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "hub.secretName" . }}
    creationPolicy: Owner
  data:
    {{- toYaml .Values.externalSecret.data | nindent 4 }}
{{- end }}
