{{- if .Values.externalSecret.enabled }}
{{- /*
Заготовка под external-secrets.io: сам Secret создаёт оператор, чарт лишь описывает,
какие ключи из какого хранилища тянуть. Имя целевого Secret совпадает с hub.secretName,
поэтому Deployment и Job миграций подхватывают его без дополнительных настроек —
это единственный Secret приложения, отдельных Secret'ов под БД и Redis чарт не ждёт.
*/ -}}
apiVersion: {{ .Values.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "hub.fullname" . }}
  labels:
    {{- include "hub.labels" . | nindent 4 }}
  {{- with (include "hub.secretHookAnnotations" .) }}
  {{- . | nindent 2 }}
  {{- end }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "hub.secretName" . }}
    {{- /*
    creationPolicy: Orphan по умолчанию — оператор создаёт и обновляет целевой Secret,
    но НЕ ставит на него ownerReference. Это принципиально: secrets.preInstallHook
    вешает на этот ExternalSecret hook с delete-policy before-hook-creation, то есть
    Helm удаляет его перед КАЖДЫМ upgrade. При creationPolicy: Owner сборщик мусора
    уводил бы за ним живой Secret релиза — Job миграций и новые поды (HPA) вставали бы
    с CreateContainerConfigError, а при недоступном Vault upgrade оставлял бы контур
    без секретов вовсе. С Orphan Secret переживает пересоздание ExternalSecret.
    Сочетание Owner + preInstallHook отбивается {{ fail }} в hub.validateSecrets.
    */}}
    creationPolicy: {{ .Values.externalSecret.creationPolicy | default "Orphan" }}
  data:
    {{- toYaml .Values.externalSecret.data | nindent 4 }}
{{- end }}
