{{- include "hub.validateSecrets" . }}
{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- if .Values.externalSecret.enabled }}
{{- fail "secrets.create и externalSecret.enabled одновременно: выберите один источник секретов" }}
{{- end }}
{{- $keys := .Values.secrets.keys }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hub.secretName" . }}
  labels:
    {{- include "hub.labels" . | nindent 4 }}
  {{- with (include "hub.secretHookAnnotations" .) }}
  {{- . | nindent 2 }}
  {{- end }}
type: Opaque
stringData:
  # Пустые значения оставлены намеренно: подставляются --set/-f при установке,
  # в git секреты не хранятся. Hub при пустом HUB_SECRET_KEY/HUB_ENCRYPTION_KEY
  # не стартует и пишет имя переменной в ошибку (R-T2).
  {{ $keys.secretKey }}: {{ .Values.secrets.secretKey | quote }}
  {{ $keys.encryptionKey }}: {{ .Values.secrets.encryptionKey | quote }}
  {{- if .Values.secrets.adminToken }}
  {{ $keys.adminToken }}: {{ .Values.secrets.adminToken | quote }}
  {{- end }}
  {{- if eq .Values.hub.webAuth "keycloak" }}
  {{ $keys.keycloakClientSecret }}: {{ .Values.secrets.keycloakClientSecret | quote }}
  {{- end }}
  {{- if and .Values.secrets.databaseUrl (not .Values.external.postgres.existingSecret.name) }}
  {{ $keys.databaseUrl }}: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}
  {{- if and .Values.secrets.redisUrl (not .Values.external.redis.existingSecret.name) }}
  {{ $keys.redisUrl }}: {{ .Values.secrets.redisUrl | quote }}
  {{- end }}
  {{- range $alias, $srv := .Values.catalogOAuth.servers }}
  {{- if and $srv.secretVar $srv.clientSecret }}
  {{ $srv.secretVar }}: {{ $srv.clientSecret | quote }}
  {{- end }}
  {{- end }}
{{- end }}
