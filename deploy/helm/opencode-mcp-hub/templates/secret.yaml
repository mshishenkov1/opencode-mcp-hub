{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- if .Values.externalSecret.enabled }}
{{- fail "secrets.create и externalSecret.enabled одновременно: выберите один источник секретов" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hub.secretName" . }}
  labels:
    {{- include "hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Пустые значения оставлены намеренно: подставляются --set/-f при установке,
  # в git секреты не хранятся. Hub при пустом HUB_SECRET_KEY/HUB_ENCRYPTION_KEY
  # не стартует и пишет имя переменной в ошибку (R-T2).
  HUB_SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  HUB_ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  {{- if .Values.secrets.adminToken }}
  HUB_ADMIN_TOKEN: {{ .Values.secrets.adminToken | quote }}
  {{- end }}
  {{- if .Values.secrets.keycloakClientSecret }}
  KEYCLOAK_CLIENT_SECRET: {{ .Values.secrets.keycloakClientSecret | quote }}
  {{- end }}
  {{- if and .Values.external.postgres.url (not .Values.external.postgres.existingSecret.name) }}
  HUB_DATABASE_URL: {{ .Values.external.postgres.url | quote }}
  {{- end }}
  {{- range $name, $value := .Values.secrets.oauth }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
