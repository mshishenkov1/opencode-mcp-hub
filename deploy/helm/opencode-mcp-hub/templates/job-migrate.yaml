{{- if .Values.migrations.enabled }}
{{- /*
Миграции Alembic отдельным шагом до выката подов (D6-05).
Advisory-блокировка PostgreSQL уже в коде (R-M1), поэтому одновременный запуск
Job и реплик с HUB_DB_AUTO_MIGRATE=true не ломает схему — но hook даёт
предсказуемый порядок и внятную ошибку при неудаче.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "hub.fullname" . }}-migrate
  labels:
    {{- include "hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": {{ .Values.migrations.hookWeight | quote }}
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "hub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
      annotations:
        {{- if .Values.istio.enabled }}
        # sidecar не даёт Job завершиться — выключаем на время миграции
        sidecar.istio.io/inject: "false"
        {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "hub.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "hub.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["mcp-hub", "db", "upgrade"]
          env:
            {{- include "hub.migrateEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          volumeMounts:
            {{- include "hub.caVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "hub.caVolume" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
