# Профиль «продуктив» (D6-06): внешние Postgres/Redis, HPA 4…20, PDB minAvailable 2,
# секреты из хранилища через ExternalSecret, NetworkPolicy включена.
#
#   helm template hub deploy/helm/opencode-mcp-hub \
#     -f deploy/helm/opencode-mcp-hub/values-prod.yaml \
#     --set-file catalog.content=catalog.yaml

replicaCount: 4

hub:
  publicUrl: https://hub.corp.tander.ru
  logLevel: INFO
  autoMigrate: false      # только Job-hook, чтобы схема менялась одним контролируемым шагом
  # Допустимо, пока перед Hub стоит nginx-ingress с перезаписью X-Forwarded-For.
  # При переезде на istio (istio.enabled=true) поставить false до настройки
  # numTrustedHops у Gateway — иначе лимиты обходятся подделкой заголовка.
  trustProxy: true
  webAuth: keycloak
  consent: always
  env:
    HUB_RATE_LIMIT_MCP: "120"
    HUB_RATE_LIMIT_REGISTER: "10"
    HUB_RATE_LIMIT_TOKEN: "60"
    HUB_MAX_SSE_PER_USER: "4"
    HUB_UPSTREAM_TIMEOUT: "30.0"
    HUB_UPSTREAM_SSE_IDLE_TIMEOUT: "300.0"
    HUB_TOOLS_CACHE_TTL: "300"
    HUB_CONNECTION_CACHE_TTL: "60"
    HUB_CB_FAILURES: "5"
    HUB_CB_RESET: "30"
    HUB_TOKEN_REFRESH_ENABLED: "true"

# Адреса БД и Redis приходят из того же Secret, что и остальные секреты
# (<release>-secrets, наполняется ExternalSecret'ом): ключи HUB_DATABASE_URL и
# HUB_REDIS_URL. Отдельных Secret'ов под БД и Redis чарт не ждёт и не создаёт.
external:
  postgres:
    existingSecret:
      name: ""
      key: url
  redis:
    url: ""
    existingSecret:
      name: ""
      key: url

# Продуктив: значения секретов чарт не видит вовсе — Secret наполняет
# external-secrets из Vault. Имя Secret — <release>-secrets.
secrets:
  create: false
  existingSecret: ""

externalSecret:
  enabled: true
  secretStoreRef:
    name: corp-vault
    kind: ClusterSecretStore
  # Полный перечень ключей — в values.yaml (externalSecret.data): секреты Hub,
  # адреса БД и Redis, KEYCLOAK_CLIENT_SECRET и client_secret OAuth-приложений
  # каталога. Отсутствие обязательного ключа отбивается {{ fail }} в шаблоне.

# client_id OAuth-приложений целевых систем — не секреты, задаются здесь по мере
# выдачи приложений администраторами. Пока пара id/secret не выдана, сервер штатно
# остаётся «ненастроенным» и в каталоге не публикуется.
catalogOAuth:
  servers:
    gitlab:
      clientId: ""            # --set catalogOAuth.servers.gitlab.clientId=...
    gitlab-platform:
      clientId: ""
    jira:
      clientId: ""
    confluence:
      clientId: ""

resources:
  requests:
    cpu: "1"
    memory: 768Mi
  limits:
    memory: 2Gi

uvicornWorkers: 4

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
  hosts:
    - host: hub.corp.tander.ru
      paths:
        - path: /
          pathType: Prefix
  tls:
    enabled: true
    secretName: hub-corp-tls

autoscaling:
  enabled: true
  minReplicas: 4
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  requestsPerSecond:
    enabled: false          # включать после установки prometheus-adapter
    metricName: hub_http_requests_per_second
    averageValue: "150"
  behavior:
    scaleDown:
      # SSE-потоки долгие: сворачиваемся медленно
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60

podDisruptionBudget:
  enabled: true
  minAvailable: 2

serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s

networkPolicy:
  enabled: true

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelectorFromChart: true
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelectorFromChart: true
