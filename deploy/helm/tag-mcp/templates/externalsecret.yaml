{{- if .Values.externalSecret.enabled }}
apiVersion: {{ .Values.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "tagmcp.fullname" . }}
  labels:
    {{- include "tagmcp.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "tagmcp.secretName" . }}
    {{- /*
    Owner здесь безопасен, в отличие от чарта opencode-mcp-hub: этот ExternalSecret —
    обычный ресурс релиза (Job миграций в tag-mcp нет, hook'ов на нём нет), поэтому
    helm upgrade его патчит, а не удаляет и создаёт заново. Целевой Secret живёт
    ровно столько же, сколько релиз, и снимается вместе с ним при helm uninstall.
    */}}
    creationPolicy: Owner
  data:
    {{- toYaml .Values.externalSecret.data | nindent 4 }}
{{- end }}
