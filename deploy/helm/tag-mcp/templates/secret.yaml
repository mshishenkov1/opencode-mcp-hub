{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- if .Values.externalSecret.enabled }}
{{- fail "secrets.create и externalSecret.enabled одновременно: выберите один источник секретов" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tagmcp.secretName" . }}
  labels:
    {{- include "tagmcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Значения подставляются при установке (--set/-f), в git не хранятся.
  MM_OAUTH_CLIENT_ID: {{ .Values.secrets.mmOauthClientId | quote }}
  MM_OAUTH_CLIENT_SECRET: {{ .Values.secrets.mmOauthClientSecret | quote }}
  {{- range $name, $value := .Values.secrets.extra }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
