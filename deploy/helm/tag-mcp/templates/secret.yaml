{{- include "tagmcp.validateSecrets" . }}
{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- if .Values.externalSecret.enabled }}
{{- fail "secrets.create и externalSecret.enabled одновременно: выберите один источник секретов" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tagmcp.secretName" . }}
  labels:
    {{- include "tagmcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Значения подставляются при установке (--set/-f), в git не хранятся.
  {{ .Values.secrets.keys.mmOauthClientId }}: {{ .Values.secrets.mmOauthClientId | quote }}
  {{ .Values.secrets.keys.mmOauthClientSecret }}: {{ .Values.secrets.mmOauthClientSecret | quote }}
  {{- if and .Values.secrets.redisUrl (not .Values.redis.existingSecret.name) }}
  {{ .Values.secrets.keys.redisUrl }}: {{ .Values.secrets.redisUrl | quote }}
  {{- end }}
  {{- range $name, $value := .Values.secrets.extra }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
