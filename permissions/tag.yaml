    class: write_delete
  add_channel_member:
    title: "Добавлять человека в канал"
    class: write_delete
  set_channel_header:
    title: "Менять заголовок канала"
    class: write_delete
  set_channel_purpose:
    title: "Менять описание канала"
    class: write_delete
  set_my_status:
    title: "Менять ваше присутствие в ТЭГ"
    class: write_delete
  set_my_custom_status:
    title: "Ставить ваш текстовый статус"
    class: write_delete
  set_my_preference:
    title: "Менять вашу личную настройку"
    class: write_delete
  mark_channel_read:
    title: "Отмечать канал прочитанным"
    class: write_delete
  mark_post_read:
    title: "Отмечать сообщение прочитанным"
    class: write_delete
  save_post:
    title: "Сохранять сообщение в закладки"
    class: write_delete
  delete_post:
    title: "Удалять сообщение"
    class: write_delete
  remove_channel_member:
    title: "Исключать человека из канала"
    class: write_delete
  archive_channel:
    title: "Архивировать канал"
    class: write_delete
  close_poll:
    title: "Завершать голосование"
    class: write_delete
  create_incoming_webhook:
    title: "Заводить вебхук, через который в канал пишет внешняя система"
    class: interactive
  list_incoming_webhooks:
    title: "Смотреть входящие вебхуки команды"
    class: read_only
  list_outgoing_webhooks:
    title: "Смотреть исходящие вебхуки команды"
