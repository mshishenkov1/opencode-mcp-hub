  get_file_info:
    title: "Смотреть сведения о вложении"
    class: read_only
  download_file:
    title: "Скачивать вложение"
    class: read_only
  list_custom_emoji:
    title: "Смотреть кастомные эмодзи"
    class: read_only
  list_reactions:
    title: "Смотреть реакции на сообщение"
    class: read_only
  list_slash_commands:
    title: "Смотреть список слэш-команд"
    class: read_only
  upload_file:
    title: "Загружать файл в канал"
    class: write_delete
  get_file_public_link:
    title: "Делать публичную ссылку на вложение"
    class: write_delete
  create_post:
    title: "Отправлять сообщение в канал"
    class: write_delete
  reply_in_thread:
    title: "Отвечать в треде"
    class: write_delete
  update_post:
    title: "Изменять своё отправленное сообщение"
    class: write_delete
  forward_posts:
    title: "Пересылать сообщения в другой канал"
    class: write_delete
  send_direct_message:
    title: "Писать человеку в личные сообщения"
    class: write_delete
  add_reaction:
    title: "Ставить реакцию на сообщение"
    class: write_delete
  remove_reaction:
    title: "Снимать свою реакцию с сообщения"
    class: write_delete
  pin_post:
    title: "Закреплять сообщение в канале"
    class: write_delete
  unpin_post:
    title: "Снимать закрепление сообщения"
    class: write_delete
  vote_in_poll:
    title: "Голосовать в опросе"
    class: write_delete
  revoke_poll_vote:
    title: "Отзывать свой голос в опросе"
