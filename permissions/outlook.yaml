# Словарь разрешений коннектора Outlook (S-V20 спецификации форка OpenCode).
#
# Состав — 56 инструментов, снятых с src/outlook_mcp/tool_specs.py
# outlook-ews-mcp (https://github.com/viartemev/outlook-ews-mcp, 2026-09-01).
#
# version: 2 — раздел `tools` со строкой на каждый инструмент: человеческое имя и класс риска, из
# которых клиент строит экран разрешений по классам, а не по группам. Умолчание инструмента
# берётся из его группы. Классы: `read_only` — ничего не меняет; `write_delete` — меняет или
# удаляет данные в Exchange.
#
# Совпадение состава `tools` и объединения групповых `tools` проверяется при сборке статического
# каталога (scripts/build-static-catalog.py, check_tool_index) — расхождение останавливает сборку.
# Hub подставляет файл в карточку целиком (src/hub/catalog.py, _apply_permission_files) и этой
# проверки не выполняет, поэтому файл в обоих деревьях держится побайтово одинаковым.
version: 2
groups:
  - id: system_read
    title: "Проверка связи и данные ящика"
    description: "Проверка доступности Exchange, метаданные ящика, делегаты, правила входящих, статус отсутствия в офисе. Ничего не меняет."
    default: allow
    tools: [ping_exchange, get_mailbox_info, list_delegates, list_inbox_rules, get_out_of_office]
  - id: email_read
    title: "Читать письма, папки и вложения"
    description: "Список писем в папке, поиск по теме/телу/отправителю, чтение письма целиком, треды переписки, raw MIME, список папок, категории, скачивание вложений."
    default: allow
    tools: [list_emails, get_email, get_email_mime, get_thread, search_emails, list_categories, list_folders, get_attachment]
  - id: calendar_read
    title: "Смотреть календарь, встречи и комнаты"
    description: "Список событий, информация о встрече, свободные слоты, доступность, список календарей, поиск переговорных комнат."
    default: allow
    tools: [list_events, get_event, find_free_slots, get_my_availability, list_calendars, list_room_lists, list_rooms]
  - id: contacts_read
    title: "Искать и читать контакты"
    description: "Поиск контактов и чтение карточки контакта. Ничего не меняет."
    default: allow
    tools: [search_contacts, get_contact]
  - id: email_write
    title: "Отправлять, перемещать и удалять письма"
    description: "Отправка, ответ, пересылка, создание черновика, перемещение, копирование, удаление, отметка прочтения, категории, создание и удаление папок."
    default: ask
    tools: [send_email, reply_email, forward_email, create_draft, update_draft, send_draft, move_email, copy_email, move_emails, copy_emails, delete_email, delete_emails, mark_email, categorize_email, mark_emails, categorize_emails, create_folder, rename_folder, delete_folder, add_attachment, delete_attachment]
  - id: calendar_write
    title: "Создавать и менять встречи в календаре"
    description: "Создание, обновление, удаление встреч, ответы на приглашения."
    default: ask
    tools: [create_event, update_event, delete_event, delete_events, respond_to_invite, respond_to_invites]
  - id: contacts_write
    title: "Создавать и менять контакты"
    description: "Создание, обновление и удаление личных контактов."
    default: ask
    tools: [create_contact, update_contact, delete_contact]
  - id: system_write
    title: "Менять правила, отсутствие в офисе"
    description: "Создание, изменение, удаление правил входящих; настройка автоматического ответа (отсутствие в офисе). Внимание: управление правилами через EWS может затереть правила, созданные в Outlook."
    default: deny
    tools: [create_inbox_rule, update_inbox_rule, delete_inbox_rule, set_out_of_office]
rest:
  title: "Остальные возможности Outlook"
  description: "Инструменты коннектора, не попавшие ни в одну группу, — например появившиеся у сервера после публикации этого словаря."
  default: ask
