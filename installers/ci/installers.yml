# Эталонный workflow для установщиков (installers/docs/spec.md, N5-T4).
#
# Этот файл — эталон: каталог .github/ защищён pipeline.config.yaml и агентам недоступен,
# поэтому копию в .github/workflows/installers.yml делает человек. Расхождение эталона и
# установленного workflow отслеживается вручную (решение 16 §13 спецификации).
#
# Все четыре задания обязательны для PR (required checks): bats, pester, lint, release-dry-run.
# Их обязательность включается в настройках защиты ветки; агрегирующее задание installers-required
# позволяет назначить один required-check вместо четырёх.

name: installers

on:
  pull_request:
    paths:
      - 'installers/**'
      - '.github/workflows/installers.yml'
  push:
    branches:
      - main
      # Работа конвейера идёт в ветках pipeline/**, PR в main до готовности итерации
      # не открывается — без этой строки набор установщиков в CI не гоняется вовсе.
      - 'pipeline/**'
    paths:
      - 'installers/**'
      - '.github/workflows/installers.yml'

permissions:
  contents: read

jobs:
  # required: true — тесты POSIX-установщика на обеих ветках install-posix.sh
  bats:
    name: bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Установить bats
        uses: bats-core/bats-action@3.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      - name: Прогон bats
        run: bats installers/tests/bats

  # required: true — тесты install.ps1 на обеих платформах.
  #
  # Зачем матрица (AC-143, часть AC-136/139/140). На ubuntu-latest '\' — обычный символ имени
  # файла: схлопывание форм вида '%USERPROFILE%\.' выполняет только Windows-реализация
  # [IO.Path]::GetFullPath. Поэтому буквальные варианты с обратным слэшем в
  # installers/tests/pester/PathSafety.Tests.ps1 на не-Windows помечаются Set-ItResult -Skipped,
  # и Windows-ветка требований автоматикой не подтверждалась (reports/test-report-i5.md §10.5).
  # windows-latest закрывает эту дыру верификации.
  #
  # Две оболочки на Windows: встроенный Windows PowerShell 5.1 — целевая версия install.ps1
  # (#Requires -Version 5.1, N5-T5), pwsh 7 — среда, в которой набор гоняется на Linux.
  # Расхождение между ними ловится до пользователя.
  pester:
    name: pester (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: pwsh
            forbid_skips: 'false'
          # powershell — встроенный Windows PowerShell 5.1 хостед-раннера
          - os: windows-latest
            shell: powershell
            forbid_skips: 'true'
          # pwsh — PowerShell 7, предустановлен на том же раннере
          - os: windows-latest
            shell: pwsh
            forbid_skips: 'true'
    steps:
      # До checkout: на Windows-раннере git настроен с core.autocrlf=true и подменил бы LF на
      # CRLF, а Encoding.Tests.ps1 (AC-134) требует *.sh без символов CR.
      - name: Сохранить переводы строк как в репозитории
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - name: Версия оболочки
        shell: ${{ matrix.shell }}
        run: $PSVersionTable | Format-List | Out-String | Write-Output
      - name: Установить Pester 5.x
        shell: ${{ matrix.shell }}
        run: |
          if ($PSVersionTable.PSEdition -eq 'Desktop') {
            # Windows PowerShell 5.1: PSGallery отвечает только по TLS 1.2, а провайдера NuGet
            # в чистом профиле пользователя нет.
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          }
          Install-Module -Name Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 `
            -Force -Scope CurrentUser -SkipPublisherCheck -AllowClobber
      - name: Прогон Pester
        shell: ${{ matrix.shell }}
        run: |
          # Явный импорт: в Windows PowerShell 5.1 рядом лежит встроенный Pester 3.4.0,
          # синтаксис Invoke-Pester у которого несовместим с набором.
          Import-Module -Name Pester -MinimumVersion 5.0.0 -Force
          $result = Invoke-Pester -Path installers/tests/pester -PassThru
          "Pester $((Get-Module Pester).Version): passed=$($result.PassedCount) failed=$($result.FailedCount) skipped=$($result.SkippedCount)" | Write-Output
          if ($result.FailedCount -gt 0) { exit 1 }
          # Пустой прогон (не нашлись файлы, оболочка не та) обязан быть красным, а не зелёным.
          if ($result.PassedCount -lt 1) {
            "Ни одного выполненного теста: путь installers/tests/pester не дал набора" | Write-Output
            exit 1
          }
          # На Windows ветки с буквальным '\' обязаны выполняться, а не пропускаться —
          # ради этого матрица и заведена (AC-143).
          if ('${{ matrix.forbid_skips }}' -eq 'true' -and $result.SkippedCount -gt 0) {
            foreach ($t in ($result.Tests | Where-Object { $_.Result -eq 'Skipped' })) {
              "Пропущен на Windows-раннере: $($t.ExpandedPath)" | Write-Output
            }
            "На Windows пропусков быть не должно: Windows-ветка AC-143 обязана подтверждаться прогоном" | Write-Output
            exit 1
          }

  # required: true — статический анализ shell и PowerShell
  lint:
    name: lint (shellcheck + ScriptAnalyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck --version
          find installers -name '*.sh' -not -path 'installers/dist/*' -print0 \
            | xargs -0 shellcheck -s bash
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $findings = Invoke-ScriptAnalyzer -Path installers -Recurse -Severity Warning,Error
          $compat = Invoke-ScriptAnalyzer -Path installers/windows/install.ps1 -Recurse `
            -IncludeRule PSUseCompatibleSyntax, PSUseCompatibleCmdlets `
            -Settings @{ Rules = @{
                PSUseCompatibleSyntax = @{ Enable = $true; TargetVersions = @('5.1') }
              } }
          $all = @($findings) + @($compat)
          if ($all.Count -gt 0) {
            $all | Format-Table -AutoSize | Out-String | Write-Output
            exit 1
          }
      - name: Кодировки файлов (N5-T6)
        run: |
          test "$(head -c 3 installers/windows/install.ps1 | od -An -tx1 | tr -d ' \n')" = "efbbbf"
          ! LC_ALL=C grep -qP '[^\x00-\x7F]' installers/windows/install.bat
          for f in $(find installers -name '*.sh' -not -path 'installers/dist/*'); do
            test "$(head -c 3 "$f" | od -An -tx1 | tr -d ' \n')" != "efbbbf"
            head -1 "$f" | grep -q '^#!'
            ! grep -qU $'\r' "$f"
          done
      - name: Оффлайновость установщиков (N5-P6, AC-18)
        run: |
          pattern='\b(curl|wget|nc|Invoke-WebRequest|Invoke-RestMethod|WebClient|git|npm|brew|apt|winget|choco)\b'
          if grep -rInE "$pattern" \
               --include='*.sh' --include='*.ps1' --include='*.bat' installers; then
            echo "Найдены запрещённые вызовы: установщик обязан быть оффлайновым (N5-P6)" >&2
            exit 1
          fi

  # required: true — сборка пакета из фикстурных артефактов и его --dry-run
  release-dry-run:
    name: release-dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать фикстурный пакет и проверить его
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          mkdir -p "$work/art/opencode-linux-x64/bin"
          printf '#!/bin/sh\necho 1.17.9-magnit.1\n' > "$work/art/opencode-linux-x64/bin/opencode"
          chmod +x "$work/art/opencode-linux-x64/bin/opencode"
          printf -- '-----BEGIN CERTIFICATE-----\nCI\n-----END CERTIFICATE-----\n' > "$work/ca.pem"
          bash installers/release.sh \
            --artifacts "$work/art" --version 1.17.9-magnit.1 \
            --ca "$work/ca.pem" --hub-url https://hub.example \
            --out "$work/dist" --targets linux-x64
          tar -xzf "$work/dist/opencode-magnit-linux-x64-1.17.9-magnit.1.tar.gz" -C "$work"
          HOME="$work/home" bash "$work/opencode-magnit-linux-x64-1.17.9-magnit.1/install.sh" --dry-run
          ( cd "$work/dist" && sha256sum -c SHA256SUMS )

  # Агрегирующее задание: удобно назначать единственным required-check для PR.
  # needs по имени задания ждёт ВСЕ ветки его матрицы — обе площадки bats и все три прогона
  # pester, — поэтому один этот чек покрывает и ubuntu, и macOS, и Windows.
  installers-required:
    name: installers-required
    runs-on: ubuntu-latest
    needs: [bats, pester, lint, release-dry-run]
    steps:
      - name: Итог
        run: echo "Все обязательные задания установщиков зелёные"
