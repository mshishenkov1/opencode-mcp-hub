  # ---------------------------------------------------------- N5-T*: тесты и CI
  - id: AC-124
    rule: [N5-T1]
    type: ci
    given: реальный домашний каталог пользователя, зафиксирован его снимок
    when: выполнен полный прогон `bats installers/tests/bats` дважды подряд
    then: >
      оба прогона зелёные, снимок реального домашнего каталога не изменился, sudo не вызывался,
