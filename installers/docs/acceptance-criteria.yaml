    when: прочитан список заданий
    then: >
      есть задания bats (ubuntu-latest и macos-latest), pester (ubuntu-latest, pwsh), lint
      (shellcheck и Invoke-ScriptAnalyzer) и release-dry-run; каждое из них помечено как
      обязательное для PR

  - id: AC-129
    rule: [N5-T4]
    type: ci
    given: pull request, изменяющий любой файл в installers/
    when: конвейер выполнен
    then: >
      все четыре задания зелёные; искусственная поломка любого из них (падающий тест bats)
      приводит к красному статусу PR

  - id: AC-130
    rule: [N5-T5]
    type: ci
    given: все файлы installers/**/*.sh
    when: выполнен `shellcheck -s bash`
    then: >
      ошибок и предупреждений нет; каждое подавление `# shellcheck disable=` сопровождается
      комментарием-обоснованием в соседней строке

  - id: AC-131
    rule: [N5-T5]
    type: ci
    given: все файлы installers/**/*.sh
    when: выполнен поиск конструкций bash 4+ (declare -A, mapfile, readarray, ${var^^}, ${var,,}, local -n, &>>)
    then: совпадений нет; прогон bats на macos-latest (bash 3.2) зелёный

  - id: AC-132
    rule: [N5-T5]
    type: ci
    given: файл installers/windows/install.ps1
    when: выполнен Invoke-ScriptAnalyzer с правилом совместимости PowerShell 5.1
    then: >
      нарушений нет; в файле есть директива `#Requires -Version 5.1` и нет конструкций
      `? :`, `??`, `?.`, `-Parallel`, `Join-String`, `$PSStyle`

  - id: AC-133
    rule: [N5-T6]
    type: unit
    given: файл installers/windows/install.ps1
    when: прочитаны первые три байта файла
    then: они равны EF BB BF — файл сохранён в UTF-8 с BOM, русские строки читаются PowerShell 5.1 корректно

  - id: AC-134
    rule: [N5-T6]
    type: unit
    given: все файлы installers/**/*.sh
    when: проверены первые байты и переводы строк
    then: BOM отсутствует, первая строка начинается с `#!`, символов CR в файлах нет

  # ------------------------------------------------------- ревизия 1.1: правки по review-i5-1.json

  - id: AC-135
    rule: [N5-P4, N5-P3, N5-R1]
    type: integration
    given: >
      каталог-жертва вне зоны установки (например <tmp>/victim) с файлом внутри и пакет,
      в манифесте которого artifacts[].app_name равен "../../<абсолютный путь>/victim"
      (в отдельных прогонах — с ведущим "/", с обратным слэшем "\\", с буквой диска "C:\\x")
    when: >
      установщик запущен трижды с одним и тем же манифестом — без флагов, с --uninstall
      и с --dry-run --uninstall
    then: >
      во всех прогонах и во всех четырёх вариантах значения: сообщение называет поле
      artifacts.<i>.app_name, код выхода 2; каталог-жертва и его содержимое на месте;
      снимок фейкового $HOME до и после совпадает побайтово — ни одной файловой операции
      не выполнено; в выводе нет строки «Desktop: удалён». Тот же результат для небезопасных
      значений ca.install_name и artifacts[].install_name

  - id: AC-136
    rule: [N5-R1]
    type: ci
    given: >
      Pester-прогон Invoke-Uninstall с мокнутыми Get-DesktopUninstallEntry и
      Invoke-UninstallProcess, манифест содержит desktop с silent_args ["/S"]
    when: >
      разобраны три случая записи деинсталляции: (а) непустая QuietUninstallString,
      (б) пустая QuietUninstallString и непустая UninstallString, (в) записи в реестре нет
    then: >
      (а) запущена команда из QuietUninstallString без добавления silent_args;
      (б) запущена команда из UninstallString с добавленными silent_args;
      в обоих случаях установщик дождался завершения процесса и при коде 0 напечатал
      «Desktop: удалён (<DisplayTarget>)»; (в) процесс не запускался, напечатано
      «Desktop: удалите вручную через «Приложения и возможности»», код выхода 0

  - id: AC-137
    rule: [N5-R1, N5-I1]
    type: ci
    given: установленный пакет с Desktop и мок Invoke-UninstallProcess, возвращающий код 3
    when: выполнен install.ps1 -Uninstall
    then: >
      напечатано «Desktop: ошибка (код 3)» и нет строки «Desktop: удалён»; строки об удалении
      CLI, записи PATH, переменной NODE_EXTRA_CA_CERTS и CA присутствуют — эти шаги не
      откатываются; итоговый код выхода 1

  # ------------------------------------------------------- ревизия 1.2: правки по review-i5-2.json

  - id: AC-138
    rule: [N5-P4, N5-P3]
    type: integration
    given: >
      пакет с артефактом kind:"desktop" и installer_type:"dmg", у которого artifacts[].app_name
      в отдельных прогонах: отсутствует, пуст (""), состоит из пробельных символов (" "), равен
      ".", равен "./OpenCode.app" или "OpenCode.app/"; каталог назначения Desktop
      (<fake-home>/Applications) существует и содержит посторонний каталог-канарейку с файлом внутри
    when: >
      установщик запущен на каждом из шести значений во всех режимах: без флагов, --check,
      --dry-run, --uninstall, --dry-run --uninstall, --uninstall --purge
    then: >
      в каждом сочетании значения и режима: сообщение в stderr называет поле
      artifacts.<i>.app_name и путь к манифесту, код выхода 2; каталог назначения, каталог-канарейка
      и её файл на месте; побайтовый снимок фейкового $HOME до и после запуска совпадает — ни одной
      файловой операции (ни rm, ни mkdir, ни ditto, ни копирования CA и бинарника) не выполнено;
      в выводе нет ни «Манифест: корректен», ни «Desktop: удалён». Тот же пакет со штатным
      app_name "OpenCode.app" проходит все шесть режимов как прежде (коды 0/7, Desktop-шаг
      отрабатывает)

  - id: AC-139
    rule: [N5-R1, N5-P4]
    type: ci
    given: >
      Pester-прогон Get-DesktopUninstallEntry с подменённым источником записей реестра, где есть
      чужая запись с DisplayName "Foreign Vendor Tool" и запись с DisplayName "OpenCode"
    when: >
      функция вызвана с манифестом, где artifacts[].app_name равен "*", "?" и "[A-z]*",
      а затем со штатным "OpenCode.app"; те же четыре значения поданы в Read-Manifest
    then: >
      на всех трёх подстановочных значениях совпадения с чужой записью нет (возвращается $null) —
      шаблон экранирован и сравнение идёт по литеральной подстроке, деинсталлятор не запускается;
      на "OpenCode.app" возвращается запись "OpenCode" как прежде; Read-Manifest отвергает три
      подстановочных значения сообщением с именем поля artifacts.<i>.app_name и кодом выхода 2,
      а "OpenCode.app" принимает

  - id: AC-140
    rule: [N5-R1]
    type: ci
    given: >
      Pester-прогон ConvertFrom-UninstallString и Invoke-Uninstall с моком Invoke-UninstallProcess
      и записью реестра, у которой QuietUninstallString пуста
    when: >
      разобраны строки UninstallString: (а) C:\Program Files\App\unins000.exe /S — без кавычек,
      с пробелами в пути; (б) "C:\Program Files\App\unins000.exe" /D="C:\Program Files\App";
      (в) C:\Program Files\App\uninstaller /S — без известного расширения, граница пути
      неоднозначна
    then: >
      (а) исполняемым файлом становится C:\Program Files\App\unins000.exe, а не C:\Program;
      (б) аргумент /D="C:\Program Files\App" остаётся одним элементом и не расщепляется по пробелу;
      (в) процесс не запускался, напечатаны «Desktop: строка деинсталляции разобрана неоднозначно
      (<строка целиком>), запуск отменён» и «Desktop: удалите вручную через «Приложения и
      возможности»», строки «Desktop: удалён» нет, код выхода прежний (0)

  # ------------------------------ ревизия 1.3: критерии по reports/test-report-i5.md §9.3

  - id: AC-141
    rule: [N5-I5, N5-U1]
    type: integration
    given: >
      файл профиля, в котором маркированный блок установщика стоит в середине и задвоен (два и
      более блока), вокруг блоков — пользовательские строки USER_ONE, USER_TWO, USER_THREE, причём
      последняя строка файла пользовательская; в отдельных прогонах тот же файл содержит вне блока
      чужое присваивание NODE_EXTRA_CA_CERTS в формах NAME=..., export NAME=..., declare -x
      NAME=..., typeset -x NAME=..., readonly NAME=..., local NAME=..., env NAME=... cmd,
      setenv NAME ..., set -gx NAME ... и присваивание внутри составной строки (после ;, && или ||,
      а также в if ...; then export NAME=...; fi); в контрольных прогонах — только закомментированная
      строка с упоминанием переменной, строка echo "NAME=..." и упоминание имени внутри текста
    when: выполнен install.sh --no-launch, затем тот же install.sh --no-launch повторно
    then: >
      после первого запуска в файле профиля ровно один маркированный блок; он стоит на позиции
      первого из прежних блоков — порядок пользовательских строк сохранён (USER_ONE раньше блока,
      блок раньше USER_TWO, последняя строка файла по-прежнему пользовательская), в конец файла
      блок не переехал; содержимое первого блока заменено актуальным, все последующие блоки
      вырезаны вместе с маркерами; на каждой из перечисленных форм чужого присваивания выдано
      предупреждение с именем файла и номером строки, сама чужая строка не изменена, код выхода 0;
      на комментарии, на echo "NAME=..." и на упоминании в тексте предупреждения нет, как и на
      нашем собственном значении внутри блока; второй запуск файл не меняет — содержимое побайтово
      и mtime совпадают с состоянием после первого запуска

  - id: AC-142
    rule: [N5-B1]
    type: integration
    given: >
      фикстурный каталог артефактов с CLI-артефактом и CA-файлом; каталог --out указывает на
      несуществующий путь (в отдельном прогоне --out не задан, то есть подразумевается
      installers/dist)
    when: >
      release.sh вызван с --version в неверных формах: 1.17.9, v1.17.9-magnit.1, 1.17.9-magnit,
      1.17-magnit.1, 1.17.9-magnit.1a, 1.17.9-MAGNIT.1, значение с пробелом, со слэшем и с двойной
      кавычкой; затем — с корректной версией 1.17.9-magnit.1 и значениями --hub-url, содержащими
      двойную кавычку, обратный слэш, перевод строки и символ табуляции
    then: >
      на каждой неверной версии: в stderr сообщение «Недопустимый формат --version: <значение>» с
      указанием ожидаемого формата, код выхода 2, каталог --out (в том числе подразумеваемый
      installers/dist) не создан, каталог артефактов не изменён, ни один архив и ни один
      SHA256SUMS не появились; корректная версия собирается как прежде. На каждом из значений
      --hub-url допустимы ровно два исхода: либо запуск отвергнут кодом выхода 2 до сборки и
      манифест с каталогом --out не созданы, либо собранный common/manifest.json является валидным
      JSON по RFC 8259 при разборе строгим парсером (python3 json.load) и значение hub_url в нём
      после разбора совпадает с исходным без искажения. Исход «код выхода 0 и синтаксически
      невалидный манифест» недопустим ни при каком значении; управляющие символы (перевод строки,
      табуляция) подчиняются этому требованию наравне с двойной кавычкой и обратным слэшем —
      см. bugs/BUG-I5-001.json

