  - id: AC-115
    rule: [N5-B2]
    type: ci
    given: сборка пакета завершена
    when: release.sh выполняет самопроверку
    then: >
      архив распакован во временный каталог и install.sh --dry-run завершился кодом 0;
      при искусственной порче архива самопроверка валит сборку ненулевым кодом

  - id: AC-116
    rule: [N5-B2]
