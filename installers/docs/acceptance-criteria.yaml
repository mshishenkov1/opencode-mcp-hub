# ------------------------------------------------------------------------------------------------
# Бэклог Hub (правила H5-*, spec.md §12).
# ЗОНА РЕАЛИЗАЦИИ: репозиторий Hub, ветка pipeline/i3-hub-oauth-facade-proxy (I-3+),
# файлы src/hub/proxy.py и src/hub/routes/oauth.py. НЕ входит в объём installers/ и в набор AC-*.
# Тесты — pytest против локальных моков и фейкового KV, как и остальные тесты Hub.
# ------------------------------------------------------------------------------------------------
hub_backlog_criteria:

  - id: HAC-01
    rule: [H5-1]
    type: unit
    given: >
      выключатель alias открыт, HUB_CB_RESET=30, HUB_UPSTREAM_SSE_IDLE_TIMEOUT=300;
      окно истекло и первый запрос захватил право на пробу, ответ upstream ещё не получен
    when: часы сдвинуты на 60 секунд вперёд и приходит новый запрос
    then: >
      право на пробу второй раз не выдаётся: запрос получает 503 с JSON-RPC -32004
      upstream_unavailable и заголовком Retry-After, upstream не вызывается

  - id: HAC-02
    rule: [H5-1]
    type: unit
    given: HUB_CB_RESET=30, HUB_UPSTREAM_TIMEOUT=30, HUB_UPSTREAM_SSE_IDLE_TIMEOUT=300, HUB_CB_PROBE_GRACE=5
    when: право на пробу захвачено
    then: >
      TTL ключа cb:<alias>:probe равен 305 секундам, значение until равно now+305;
      Retry-After отказов в half-open вычисляется от этого until и не меньше 1 секунды

  - id: HAC-03
    rule: [H5-1, H5-3]
    type: unit
    given: выключатель в half-open, проба выполняется
    when: проба завершилась успешно
    then: >
      ключ cb:<alias>:probe удалён немедленно (не по TTL), состояние cb:<alias> равно
      {failures: 0, open_until: 0.0}, следующий запрос идёт на upstream без задержки

  - id: HAC-04
    rule: [H5-2]
    type: unit
    given: HUB_TRUST_PROXY=true, соединение с адресом 10.0.0.7
    when: приходит запрос на /oauth/register с заголовком X-Forwarded-For "not-an-ip, 10.1.1.1"
    then: ключ rate-limit равен rl:register:10.0.0.7 — значение заголовка отброшено

  - id: HAC-05
    rule: [H5-2]
    type: unit
    given: HUB_TRUST_PROXY=true, соединение с адресом 10.0.0.7
    when: приходит запрос с X-Forwarded-For длиной 4096 символов
    then: >
      значение отброшено без попытки разбора, ключ равен rl:register:10.0.0.7;
      в KV не появляется ключей длиннее ожидаемого

  - id: HAC-06
    rule: [H5-2]
    type: unit
    given: HUB_TRUST_PROXY=true
    when: приходят запросы с X-Forwarded-For "203.0.113.5", "[2001:db8::1]:443" и "2001:db8::1"
    then: во всех трёх случаях ключ содержит нормализованный IP-адрес клиента, а не адрес соединения

  - id: HAC-07
    rule: [H5-2]
    type: unit
    given: HUB_TRUST_PROXY=true и заведомо мусорный X-Forwarded-For
    when: запрос обработан и прочитаны записи журнала
    then: >
      есть запись уровня WARNING о непринятом заголовке, само значение в журнал не попало
      (в тексте записи его нет), в audit_log значения тоже нет

  - id: HAC-08
    rule: [H5-2]
    type: unit
    given: HUB_TRUST_PROXY=false (по умолчанию), соединение с адресом 10.0.0.7
    when: приходит запрос с X-Forwarded-For "203.0.113.5"
    then: ключ равен rl:register:10.0.0.7 — поведение по умолчанию не изменилось

  - id: HAC-09
    rule: [H5-3]
    type: unit
    given: выключатель закрыт, счётчик операций фейкового KV обнулён
    when: успешно проксирован один запрос
    then: >
      в KV выполнена ровно одна операция записи состояния cb:<alias> и ноль операций удаления;
      ответ клиенту не изменился

  - id: HAC-10
    rule: [H5-3]
    type: unit
    given: HUB_CB_FAILURES подряд идущих ошибок перевели выключатель в открытое состояние
    when: после истечения окна проба завершилась успешно и затем прошли ещё два обычных запроса
    then: >
      выключатель закрыт, ключ пробы отсутствует, на два последующих запроса пришлось ноль
      операций удаления в KV

  - id: HAC-11
    rule: [H5-4]
    type: unit
    given: выключатель в half-open, право на пробу захвачено
    when: пробный запрос завершился ошибкой 502
    then: >
      состояние cb:<alias> равно {failures: HUB_CB_FAILURES, open_until: now + HUB_CB_RESET},
      ключ пробы удалён, следующий запрос получает 503 с -32004

  - id: HAC-12
    rule: [H5-4]
    type: unit
    given: набор тестов Hub на circuit-breaker (в т.ч. проверяющий AC-151 и AC-152 спецификации I-3)
    when: применено изменение H5-4 и прогнаны тесты
    then: >
      все тесты проходят без правок ожиданий — наблюдаемое поведение R-P10 не изменилось;
      мутация «failures = 0 в ветке повторного открытия» валит тест AC-151

hub_backlog_coverage:
  H5-1: [HAC-01, HAC-02, HAC-03]
  H5-2: [HAC-04, HAC-05, HAC-06, HAC-07, HAC-08]
  H5-3: [HAC-03, HAC-09, HAC-10]
  H5-4: [HAC-11, HAC-12]
