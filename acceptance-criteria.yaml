  - id: AC-170
    text: "Некорректный auth_methods отклоняется при загрузке каталога с путём к полю (R-U1)"
    given: "варианты каталога: (а) сервер с обоими полями auth и auth_methods; (б) auth_methods: []; (в) два способа с одинаковым id 'session_token'; (г) способ с type: 'pat'; (д) способ с лишним полем"
    when: "для каждого варианта вызывается create_app()"
    then: "во всех случаях старт завершается ошибкой; сообщение содержит путь вида servers[0].auth_methods (для (в) — также сам id 'session_token', для (г) и (д) — путь вида servers[0].auth_methods[0].<поле>)"
  - id: AC-171
    text: "Способ user_token требует mode: facade, field и verify (R-U1)"
    given: "варианты каталога: (а) native-сервер со способом type: user_token; (б) facade-сервер со способом user_token без field; (в) то же без verify; (г) verify без headers"
    when: "для каждого варианта вызывается create_app()"
    then: "во всех случаях ошибка старта; сообщения содержат соответственно servers[0].auth_methods[0].type (недопустим при mode native), servers[0].auth_methods[0].field, servers[0].auth_methods[0].verify, servers[0].auth_methods[0].verify.headers"
  - id: AC-172
    text: "Сохранённый пользовательский токен подставляется в credential_headers при проксировании, клиентский Authorization удаляется (R-U2, R-P2)"
    given: "facade-сервер со способом user_token и credential_headers {Authorization: 'Bearer {{access_token}}'}; пользователь подключился токеном 'usr-tok-1'; мок upstream записывает полученные заголовки"
    when: "клиент вызывает POST /mcp/{alias} с собственным заголовком Authorization: Bearer <access-токен Hub>"
    then: "upstream получил Authorization: 'Bearer usr-tok-1'; access-токена Hub в заголовках запроса к upstream нет"
  - id: AC-173
    text: "Успешная проверка токена у целевой системы создаёт подключение и сохраняет account (R-U3, R-U4)"
    given: "способ user_token с verify {url, method GET, headers {Authorization: 'Bearer {{access_token}}'}, account_field: username}; мок целевой системы отвечает 200 и телом с полем username 'm.ivanov'"
    when: "POST /api/me/connections/{alias}/token с телом {token: 'usr-tok-1'}"
    then: "мок получил проверочный GET с заголовком Authorization: 'Bearer usr-tok-1'; ответ 200 со status 'connected', auth_method — id способа, account == 'm.ivanov'; в БД connections.status == 'connected' и есть строка upstream_tokens"
  - id: AC-174
    text: "Токен, отклонённый целевой системой, не сохраняется (R-U3, R-U4)"
    given: "мок целевой системы отвечает на проверочный запрос 401 (и в отдельном прогоне 403)"
    when: "POST /api/me/connections/{alias}/token с телом {token: 'bad-token'}"
    then: "в обоих случаях 400 {error: 'token_rejected'}; в БД нет строки upstream_tokens для этого подключения, status подключения не стал 'connected'"
  - id: AC-175
    text: "Недоступность целевой системы на проверке не разрушает прежнее подключение (R-U3, R-U4)"
    given: "пользователь уже подключён токеном 'usr-tok-1'; мок целевой системы отвечает на проверку 500 (и в отдельных прогонах — сетевой ошибкой и таймаутом)"
    when: "POST /api/me/connections/{alias}/token с телом {token: 'usr-tok-2'}"
    then: "во всех случаях 502 {error: 'upstream_unavailable'}; подключение осталось 'connected', а следующий вызов /mcp/{alias} уходит на upstream по-прежнему с 'usr-tok-1'"
  - id: AC-176
    text: "Успешный ответ эндпоинта подключения токеном содержит договорённые поля и не содержит токена (R-U4)"
    given: "способ user_token, мок целевой системы отвечает 200"
    when: "POST /api/me/connections/{alias}/token с телом {token: 'usr-tok-1', preset: 'readonly'}"
    then: "200; тело — объект с ключами alias, status, auth_method, preset, groups, account, updated_at; значения 'usr-tok-1' в теле ответа нет ни в одном поле; аудит содержит запись connection_connected с details.auth_method"
  - id: AC-177
    text: "Невалидное тело запроса отклоняется без обращения к целевой системе (R-U4)"
    given: "способ user_token с field.max_length 4096; счётчик запросов мока целевой системы обнулён"
    when: "выполняются POST /api/me/connections/{alias}/token с телами: не JSON; JSON-массив; {} без token; {token: ''}; {token: <4097 символа>}; {token: 'ok', preset: 'admin'}; {token: 'ok', groups: 'core'}"
    then: "каждый ответ — 400 {error: 'invalid_request'} с русским message; мок целевой системы не получил ни одного запроса; подключение не создано"
  - id: AC-178
    text: "Подключение токеном доступно только для видимого пользователю facade-сервера и только аутентифицированному пользователю (R-U4)"
    given: "каталог с native-сервером 'nat', unconfigured-сервером 'unc', facade-сервером 'closed' с audience ['other'] и facade-сервером 'ok' со способом user_token"
    when: "POST /api/me/connections/{alias}/token для alias 'missing', 'nat', 'unc', 'closed' (с Bearer), а также для 'ok' без заголовка авторизации"
    then: "для четырёх первых — 404 {error: 'not_found'}; для запроса без авторизации — 401; ни в одном случае подключение не создано"
  - id: AC-179
    text: "Выбор способа подключения проверяется: обязательность, известность, тип и доступность (R-U4)"
    given: "сервер 'multi' с двумя способами user_token (id 'a' и 'b') и способом oauth2 'corp' с available: false; сервер 'single' ровно с одним способом user_token"
    when: "выполняются POST …/token: для 'multi' без method; для 'multi' с method 'nope'; для 'multi' с method 'corp'; для 'single' без method"
    then: "без method для 'multi' — 400 invalid_request с указанием, что нужно выбрать способ; method 'nope' — 400 invalid_request; method 'corp' — 409 {error: 'auth_method_unavailable'}; для 'single' без method — 200 (способ определён однозначно)"
  - id: AC-180
    text: "Повторное подключение заменяет прежний токен, не оставляя старого значения (R-U4)"
    given: "пользователь подключён токеном 'usr-tok-1'; мок целевой системы принимает оба токена"
    when: "POST /api/me/connections/{alias}/token с телом {token: 'usr-tok-2'}, затем выполняется MCP-вызов"
    then: "200; в БД ровно одна строка upstream_tokens для подключения, её расшифровка равна 'usr-tok-2'; connections.revision вырос; upstream получил Authorization с 'usr-tok-2'; строки со значением 'usr-tok-1' в БД и KV не осталось"
  - id: AC-181
    text: "Отключение стирает пользовательский токен и не обращается к revoke_url (R-U5)"
    given: "подключение способом user_token; у сервера в каталоге задан revoke_url, мок отзыва считает запросы"
    when: "DELETE /api/me/connections/{alias}, затем POST /mcp/{alias} с прежним access-токеном Hub и GET /remote-config"
    then: "200 {alias, status: 'not_connected'}; строки upstream_tokens нет, connections.auth_method пуст; мок revoke_url не получил ни одного запроса; MCP-вызов отвечает 401 либо JSON-RPC -32002 с reason 'not_connected'; /remote-config не содержит alias; аудит содержит connection_disconnected"
  - id: AC-182
    text: "401 от upstream переводит подключение user_token в needs_reauth без попытки обновления, а новый токен его восстанавливает (R-U6)"
    given: "подключение способом user_token; мок upstream отвечает 401 на MCP-запрос; счётчик запросов к token_url обнулён"
    when: "выполняется POST /mcp/{alias}, затем POST /api/me/connections/{alias}/token с новым токеном и повторный MCP-вызов тем же access-токеном Hub"
    then: "первый вызов — 200 с JSON-RPC -32002, data.reason == 'needs_reauth' и data.hint_url == '<HUB>/ui/servers/{alias}'; к token_url обращений не было и запрос к upstream не повторялся; connections.status == 'needs_reauth', есть аудит connection_needs_reauth; после подключения новым токеном status == 'connected' и повторный MCP-вызов проходит на upstream с новым токеном"
  - id: AC-183
    text: "Фоновое обновление токенов не выбирает подключения user_token (R-U6, R-B4)"
    given: "одно подключение user_token (без refresh-токена и без expires_at) и одно OAuth-подключение с истекающим токеном"
    when: "выполняется один цикл фонового обновления"
    then: "обновлено ровно одно подключение — OAuth; к token_url обращений по подключению user_token не было; его статус остался 'connected', а токен в БД не изменился"
  - id: AC-184
    text: "Расширение прав readonly → readwrite для user_token не требует повторной авторизации (R-U7)"
    given: "подключение user_token с preset 'readonly' у сервера с permission_model.kind tool_filter; параллельно — OAuth-подключение с preset 'readonly'"
    when: "PUT /api/me/connections/{alias}/permissions с телом {preset: 'readwrite'} для обоих подключений"
    then: "для user_token — 200 со status 'connected' (не 'needs_reauth'), следующий tools/list отдаёт инструменты пресета readwrite; для OAuth-подключения поведение прежнее — status 'needs_reauth' с пояснением (AC-111 не изменён)"
  - id: AC-185
    text: "Витрина отдаёт описание способов подключения без секретов и без адреса проверки (R-U8)"
    given: "сервер со способами corp_oauth (available false, unavailable_reason, client_id, client_secret) и session_token (field с label, hint, docs_url, secret; verify с url и headers)"
    when: "GET /api/catalog (Bearer)"
    then: "у сервера есть auth_methods из двух элементов с полями id, title, type, available, unavailable_reason; у session_token есть field {label, hint, docs_url, secret, min_length, max_length}, у corp_oauth поля field нет; во всём ответе нет ключей verify, authorize_url, token_url, revoke_url, scopes, client_id, client_secret и нет адреса проверки; у сервера без auth_methods ключ auth_methods отсутствует"
  - id: AC-186
    text: "Страница сервера показывает выбор способа только когда способов больше одного (R-U8)"
    given: "веб-сессия; сервер 'multi' со способами corp_oauth (available false, unavailable_reason) и session_token; сервер 'single' ровно с одним способом user_token"
    when: "GET /ui/servers/multi и GET /ui/servers/single"
    then: "на странице 'multi' есть выбор способа с обоими title, элемент corp_oauth неактивен (disabled) и рядом выведен текст unavailable_reason; на странице 'single' переключателя способов нет, сразу показана форма подключения"
  - id: AC-187
    text: "Форма ввода токена и состояния подключения отображаются по каталогу и не раскрывают токен (R-U8)"
    given: "веб-сессия; способ user_token с field {label, hint, docs_url, secret: true}"
    when: "GET /ui/servers/{alias} для состояний not_connected, connected (account 'm.ivanov') и needs_reauth"
    then: "во всех состояниях поле ввода имеет type='password' и пустое значение, на странице есть label, текст hint и ссылка docs_url; в состоянии connected показаны статус 'Подключён', название способа, account и кнопки замены токена и отключения; в состоянии needs_reauth показано, что токен больше не действует, и предложена форма ввода нового; значения токена в HTML нет ни в одном состоянии"
  - id: AC-188
    text: "Пользовательский токен не попадает в журнал и в аудит (R-U9)"
    given: "включён перехват логов всех уровней; токен 'usr-tok-SECRET-1'"
    when: "выполняется полный цикл: подключение токеном, MCP-вызов, смена прав, 401 от upstream, отключение; затем просматриваются все записи журнала и все строки audit_log"
    then: "ни одна запись журнала и ни одно поле audit_log.details не содержит 'usr-tok-SECRET-1' и ни одного его фрагмента длиной 8 и более символов; при этом в audit_log есть connection_connected с details.auth_method, connection_needs_reauth и connection_disconnected"
  - id: AC-189
    text: "Пользовательский токен не отдаётся наружу и хранится только зашифрованным (R-U9, R-B9)"
    given: "подключение токеном 'usr-tok-SECRET-2'; веб-сессия для страниц"
    when: "запрашиваются ответ POST …/token, GET /api/me/connections, GET /api/catalog, GET /remote-config, GET /metrics, GET /ui/connections, GET /ui/servers/{alias}"
    then: "ни один ответ не содержит 'usr-tok-SECRET-2'; в БД upstream_tokens.access_token_enc не равен открытому значению, а его расшифровка ключом HUB_ENCRYPTION_KEY равна ему; в KV-записи conn:<user_id>:<alias> хранится тот же шифртекст, открытого значения там нет"
  - id: AC-190
    text: "Токен одного пользователя недоступен другому (R-U9)"
    given: "пользователь A подключил токен 'tok-A', пользователь B — 'tok-B' к тому же alias"
    when: "B выполняет MCP-вызов, GET /api/me/connections, PUT …/permissions и DELETE /api/me/connections/{alias}"
    then: "upstream по запросу B получил Authorization с 'tok-B'; ответы B не содержат 'tok-A'; в /api/me/connections B видит только своё подключение; действия B не изменили подключение A — оно осталось 'connected' и его токен в БД прежний"
  - id: AC-191
    text: "Описанная в спеке запись каталога для коннектора tag загружается и публикуется корректно (R-U10)"
    given: "каталог с записью tag из R-U10 (mode facade, upstream_url задан, два способа, permission_model.kind tool_filter); HUB_PUBLIC_URL='https://hub.test'"
    when: "create_app() и GET /api/catalog (Bearer)"
    then: "старт успешен; у tag mode == 'facade', mcp_url == 'https://hub.test/mcp/tag', auth_kind == 'user_token', auth_methods содержит corp_oauth (available false с причиной) и session_token (type user_token с field); при незаданной переменной ${TAG_MCP_URL} сервер помечается unconfigured и в /api/catalog не показывается"
  - id: AC-192
    text: "Коннектор tag, подключённый токеном, работает через Hub с персональным срезом прав (R-U10)"
    given: "запись tag из R-U10; мок ТЭГ-MCP отдаёт на tools/list инструменты whoami, search_posts, get_thread, create_post, update_post; пользователь подключился токеном 'tag-tok-1' с пресетом readonly"
    when: "выполняются POST /mcp/tag с tools/list и затем tools/call для create_post"
    then: "мок ТЭГ-MCP получил Authorization: 'Bearer tag-tok-1'; в отфильтрованном ответе tools/list есть whoami, search_posts, get_thread и нет create_post и update_post; вызов create_post отвечает 200 с JSON-RPC -32001 и data.hint_url, запрос на upstream при этом не отправлен"
  - id: AC-193
    text: "Корпоративный OAuth ТЭГ объявлен, но недоступен до выдачи приложения (R-U10)"
    given: "запись tag из R-U10 (способ corp_oauth с available: false и unavailable_reason)"
    when: "POST /api/me/connections/tag/token с телом {method: 'corp_oauth', token: 'x'} и, отдельно, попытка подключиться этим способом через флоу авторизации"
    then: "409 {error: 'auth_method_unavailable'} с текстом причины из каталога; подключение не создано, запись upstream_tokens не появилась; сам способ при этом виден в /api/catalog и на странице сервера"
  - id: AC-194
    text: "Незаданная переменная внутри недоступного способа не скрывает сервер из каталога (R-U1, уточнение R-C2)"
    given: "beta-сервер со способами corp_oauth (available: false, client_id '${TAG_OAUTH_CLIENT_ID}') и session_token (type user_token); переменная TAG_OAUTH_CLIENT_ID не задана, upstream_url задан"
    when: "create_app() и GET /api/catalog (Bearer)"
    then: "сервер не помечен unconfigured и виден в /api/catalog, подключение способом session_token работает; при этом незаданная переменная в любом другом поле того же beta-сервера (например в upstream_url) по-прежнему делает его unconfigured и скрывает из каталога"
  # --- Ревизия 3.1: проверка токена требует названного аккаунта (R-U3.1, BUG-I4-009) ---
  - id: AC-195
    text: "Анонимный успешный ответ целевой системы при require_account: true отклоняет токен (R-U3.1, R-U4)"
    given: "способ user_token с verify {url, headers {Authorization: 'Bearer {{access_token}}'}, account_field: username, require_account: true}; мок целевой системы на любой токен отвечает 200 и телом {'type': 'anonymous', 'displayName': 'Anonymous'} без поля username; подключения у пользователя нет"
    when: "POST /api/me/connections/{alias}/token с телом {token: 'nonsense-token-value'}"
    then: "400 {error: 'token_rejected'}; в БД нет строки upstream_tokens для этого подключения и статус подключения не стал 'connected'; в кэше conn:<user_id>:<alias> записи с этим токеном нет; GET /api/me/connections не показывает alias подключённым"
  - id: AC-196
    text: "Любое неназванное значение account_field при require_account: true — отказ, а не пустой account (R-U3.1)"
    given: "способ user_token с account_field: username и require_account: true; мок целевой системы отвечает 200 и по очереди телами: {} (поля нет), {'username': null}, {'username': ''}, {'username': '   '}, {'username': 12345}, {'username': true}, {'username': {'name': 'x'}}, {'username': ['x']}"
    when: "для каждого тела выполняется POST /api/me/connections/{alias}/token с телом {token: 'usr-tok-x'}"
    then: "во всех восьми прогонах 400 {error: 'token_rejected'} (не 200 и не 502); ни в одном прогоне строка upstream_tokens не появилась"
  - id: AC-197
    text: "Без require_account поведение прежнее: анонимный успешный ответ создаёт подключение с пустым account (R-U3.1, совместимость)"
    given: "тот же способ user_token с account_field: username, но без поля require_account в каталоге (и в отдельном прогоне — с require_account: false); мок целевой системы отвечает 200 и телом {'type': 'anonymous', 'displayName': 'Anonymous'} без username"
    when: "POST /api/me/connections/{alias}/token с телом {token: 'nonsense-token-value'}"
    then: "в обоих прогонах 200 со status 'connected' и account == null, строка upstream_tokens создана — поведение AC-173 не изменилось; каталог без поля require_account валиден и загружается"
  - id: AC-198
    text: "Верный токен с названным аккаунтом принимается и при включённом требовании (R-U3.1)"
    given: "способ user_token с account_field: username и require_account: true; мок целевой системы отвечает 200 и телом {'type': 'known', 'username': 'm.ivanov', 'displayName': 'Иванов'}"
    when: "POST /api/me/connections/{alias}/token с телом {token: 'usr-tok-1'}"
    then: "мок получил проверочный запрос с заголовком Authorization: 'Bearer usr-tok-1'; ответ 200 со status 'connected' и account == 'm.ivanov'; в БД connections.provider_account == 'm.ivanov' и есть строка upstream_tokens — поведение AC-173 сохранено"
  - id: AC-199
    text: "При включённом требовании отказ и недоступность различаются и не разрушают прежнее подключение (R-U3.1)"
    given: "пользователь уже подключён токеном 'usr-tok-1'; способ user_token с account_field: username и require_account: true; мок целевой системы по очереди отвечает: 200 с телом без username; 200 с телом 'not a json'; 200 с телом [1, 2] (не объект); 500; сетевой ошибкой; таймаутом"
    when: "для каждого случая выполняется POST /api/me/connections/{alias}/token с телом {token: 'usr-tok-2'}"
    then: "первый случай — 400 {error: 'token_rejected'}; остальные пять — 502 {error: 'upstream_unavailable'}; во всех шести случаях подключение осталось 'connected', в БД сохранён прежний токен, и следующий вызов /mcp/{alias} уходит на upstream с 'usr-tok-1'"
  - id: AC-200
    text: "Схема каталога: require_account требует account_field и должен быть булевым (R-U3.1, R-C1)"
    given: "каталоги со способом user_token, у которого verify содержит: (а) require_account: true без account_field; (б) require_account: 'yes'; (в) require_account: true вместе с account_field: username; (г) ни того ни другого"
    when: "загружается каждый каталог"
    then: "(а) и (б) — ошибка схемы, сообщение содержит путь servers[0].auth_methods[<j>].verify.require_account; (в) и (г) загружаются успешно, причём в (г) требование выключено (значение по умолчанию false)"
  - id: AC-201
    text: "OAuth-подключение не создаётся по успешному ответу без access_token (R-B2, тот же класс, BUG-I4-009)"
    given: "сервер со способом oauth2; целевая система на обмен кода отвечает 200 и телом {'type': 'anonymous', 'displayName': 'Anonymous'} без access_token (в отдельном прогоне — 200 с телом 'not a json')"
    when: "проходится флоу подключения до GET /oauth/callback/{alias} с валидным state и code"
    then: "в обоих прогонах ответ 502 upstream_auth_failed; подключение не создано, строки upstream_tokens нет, статус не стал 'connected'; при этом успешный обмен с access_token, но без account_id/user_id/username, по-прежнему создаёт подключение со status 'connected' и account == null"
  - id: AC-202
    text: "Отказ по неназванному аккаунту не выносит тело ответа целевой системы в журнал (R-U3.1, R-U9)"
    given: "включён перехват логов всех уровней; способ user_token с account_field: username и require_account: true; мок отвечает 200 и телом {'type': 'anonymous', 'displayName': 'Anonymous', 'userKey': 'SECRET-BODY-MARKER'}; токен 'usr-tok-SECRET-3'"
    when: "POST /api/me/connections/{alias}/token с телом {token: 'usr-tok-SECRET-3'}"
    then: "400 {error: 'token_rejected'}; ни одна запись журнала не содержит 'SECRET-BODY-MARKER' и 'usr-tok-SECRET-3' (и ни одного его фрагмента длиной 8 и более символов); при этом есть запись с alias, идентификатором способа, HTTP-кодом 200 и признаком того, что аккаунт не назван"

  # --- Ревизия 3.2: scope как множество значений (R-O5.1, R-O5.2, BUG-I3-002) ---
  - id: AC-203
    text: "Запрос обеих объявленных областей проходит авторизацию и даёт подключение с пресетом readonly (R-O5.1, R-O5.2)"
    given: "каталог с facade 'tag'; зарегистрирован клиент с redirect 'http://127.0.0.1:19876/cb'; есть веб-сессия; подключения к 'tag' нет; HUB_CONSENT='always'; мок целевой системы"
    when: "GET /oauth/authorize со scope='tag:readonly tag:readwrite' и resource='<HUB>/mcp/tag'; флоу проходится до конца (OAuth целевой системы, затем «Разрешить» на экране прав без изменения переключателя), полученный код обменивается на токен"
    then: "ни один шаг не даёт редирект с error='invalid_scope'; экран прав показан и содержит строку 'tag:readonly tag:readwrite' и пояснение о том, что уровень доступа выбирает пользователь; переключатель предвыбран на 'Только чтение'; в целевую систему ушёл authorize со scope пресета readonly (значения scopes.readonly каталога, ни одного значения из scopes.readwrite); ответ /oauth/token — 200 с scope == 'tag:readonly'; в connections.preset == 'readonly'"
  - id: AC-204
    text: "Порядок, повторы и лишние пробелы в scope не влияют на результат, для всех facade-коннекторов (R-O5.1)"
    given: "каталог с facade 'tag', 'jira', 'confluence'; зарегистрированный клиент; веб-сессия"
    when: "для каждого alias выполняется GET /oauth/authorize со scope: '<alias>:readonly <alias>:readwrite'; '<alias>:readwrite <alias>:readonly'; '<alias>:readonly  <alias>:readwrite' (два пробела); '  <alias>:readonly <alias>:readwrite  ' (ведущие и завершающие пробелы); '<alias>:readonly <alias>:readonly <alias>:readwrite' (дубль)"
    then: "все 15 запросов проходят валидацию (ни одного редиректа с error) и доходят до подключения или экрана прав; во всех случаях запрошенный набор показан на экране прав и сохранён одинаково — в канонической форме '<alias>:readonly <alias>:readwrite'"
  - id: AC-205
    text: "Объявленный Hub'ом набор областей принимается эндпоинтом авторизации целиком и любым подмножеством (R-O5.1, инвариант согласованности)"
    given: "каталог со всеми facade-коннекторами; зарегистрированный клиент; веб-сессия"
    when: "для каждого facade-коннектора читается scopes_supported из GET /.well-known/oauth-protected-resource/mcp/{alias}; для каждого непустого подмножества этого набора (в прямом и в обратном порядке элементов) выполняется GET /oauth/authorize с этим scope; отдельно то же делается для значений соответствующего alias из scopes_supported метаданных GET /.well-known/oauth-authorization-server"
    then: "ни один запрос не завершается редиректом с error='invalid_scope'; каждое объявленное значение принимается и по отдельности, и в составе полного набора"
  - id: AC-206
    text: "Недопустимый элемент набора и элементы разных коннекторов — invalid_scope (R-O5.1)"
    given: "каталог с facade 'tag' и 'jira'; зарегистрирован клиент с redirect 'http://127.0.0.1:19876/cb'; веб-сессия; state='xyz 1'"
    when: "GET /oauth/authorize со scope: 'tag:readonly jira:readonly'; 'tag:readonly tag:admin'; 'tag:readonly nope:readonly'; 'tag:readonly tag:'; 'tag:readonly :readwrite'; 'tag:readonly readwrite'; 'tag:readwrite tag:readonly jira:readwrite'; отдельно — scope='tag:readonly' вместе с resource='<HUB>/mcp/jira'"
    then: "первые семь — 302 на 'http://127.0.0.1:19876/cb' с error='invalid_scope' и state, возвращённым байт-в-байт; параметр code отсутствует; последний (расхождение scope и resource) — 302 с error='invalid_request', как и раньше; ни в одном случае транзакция не создана и подключение не изменилось"
  - id: AC-207
    text: "Пустое и пробельное значение scope равнозначны отсутствию параметра (R-O5.1)"
    given: "каталог с facade 'tag'; зарегистрированный клиент; веб-сессия; подключения нет"
    when: "GET /oauth/authorize с resource='<HUB>/mcp/tag' и scope='' ; затем scope='   ' ; затем без параметра scope"
    then: "во всех трёх случаях ошибки нет, флоу продолжается, итоговый выданный scope — 'tag:readonly'; ни один из трёх не даёт invalid_scope или invalid_request"
  - id: AC-208
    text: "Запрос ровно одной области сохраняет прежнее поведение (R-O5.2, совместимость)"
    given: "каталог с facade 'tag'; зарегистрированный клиент; веб-сессия; подключения к 'tag' нет; HUB_CONSENT='always'"
    when: "в первом прогоне GET /oauth/authorize со scope='tag:readwrite' и флоу до токена; во втором — со scope='tag:readonly'"
    then: "в первом прогоне на экране прав предвыбрано 'Чтение и запись', в целевую систему ушли значения scopes.readwrite, выданный scope — 'tag:readwrite'; во втором — предвыбрано 'Только чтение', ушли значения scopes.readonly, выданный scope — 'tag:readonly'; поведение AC-84 и AC-85 не изменилось"
  - id: AC-209
    text: "При запросе обеих областей пресет берётся из существующего подключения (R-O5.2, R-O6.2)"
    given: "каталог с facade 'tag'; у пользователя подключение 'tag' со status 'connected' и preset 'readwrite'; зарегистрированный клиент; веб-сессия; HUB_CONSENT='always'"
    when: "GET /oauth/authorize со scope='tag:readonly tag:readwrite'; пользователь жмёт «Разрешить», не меняя переключатель; код обменивается на токен"
    then: "на экране прав предвыбрано 'Чтение и запись'; повторный OAuth целевой системы не запускался (в мок не ушло ни одного нового запроса authorize); выданный scope — 'tag:readwrite'; connections.preset остался 'readwrite'"
  - id: AC-210
    text: "Запрос обеих областей не повышает права молча (R-O5.2, R-B7; AC-111 не ослаблен)"
    given: "каталог с facade 'tag' (scopes.readonly и scopes.readwrite различаются); подключение 'tag' со status 'connected' и preset 'readonly'; зарегистрированный клиент; веб-сессия; HUB_CONSENT='always'"
    when: "GET /oauth/authorize со scope='tag:readonly tag:readwrite'; пользователь жмёт «Разрешить», не меняя переключатель; код обменивается на токен"
    then: "предвыбрано 'Только чтение'; в целевую систему не ушёл ни один запрос authorize со значениями из scopes.readwrite; connections.preset остался 'readonly'; выданный scope — 'tag:readonly'; если же пользователь на том же экране выбирает 'Чтение и запись', запускается повторный OAuth целевой системы (R-B7) и только после его успеха выдаётся код со scope 'tag:readwrite'"
  - id: AC-211
    text: "Сохранённое согласие сопоставляется по набору областей, а не по строке (R-O6.3)"
    given: "HUB_CONSENT='remember'; каталог с facade 'tag'; клиент C уже прошёл авторизацию со scope='tag:readonly tag:readwrite' и пользователь выбрал 'Чтение и запись' (подключение preset 'readwrite')"
    when: "повторный GET /oauth/authorize клиента C со scope='tag:readwrite  tag:readonly' (обратный порядок, два пробела); затем — со scope='tag:readonly tag:readonly tag:readwrite' (дубль); затем — со scope='tag:readonly'"
    then: "первые два запроса не показывают экран прав и сразу выдают код, обмен даёт scope 'tag:readwrite'; третий запрос (другой набор) показывает экран прав; ни в одном случае нет ошибки invalid_scope"
  - id: AC-212
    text: "Обновление токена разбирает scope как множество и по-прежнему запрещает расширение (R-O10)"
    given: "активная цепочка refresh-токенов для alias 'tag': в прогонах (а),(б),(д),(е) выданный scope — 'tag:readonly', в прогонах (в),(г) — 'tag:readwrite'"
    when: "POST /oauth/token с grant_type='refresh_token' и scope: (а) 'tag:readonly tag:readonly'; (б) 'tag:readonly tag:readwrite'; (в) '  tag:readonly  '; (г) 'tag:readwrite tag:readonly'; (д) 'jira:readonly'; (е) без параметра scope"
    then: "(а) 200 со scope 'tag:readonly'; (б) 400 {error:'invalid_scope'} — расширение запрещено, новый токен не выдан, прежний refresh остался active; (в) 200 со scope 'tag:readonly' (сужение); (г) 200 со scope 'tag:readwrite'; (д) 400 {error:'invalid_scope'}; (е) 200 со scope, равным ранее выданному"
  - id: AC-213
    text: "Форма запрошенного scope не влияет на фактические права подключения (R-O5.2)"
    given: "два пользователя: первый подключил 'tag' через authorize со scope='tag:readonly tag:readwrite' и выбранным пресетом readonly, второй — через authorize со scope='tag:readonly'; у обоих одинаковые группы"
    when: "для каждого выполняется GET /api/me/connections, затем tools/list и вызов инструмента из группы с preset 'readwrite' через /mcp/tag"
    then: "у обоих в /api/me/connections preset == 'readonly' и поля scope в ответе нет; списки инструментов совпадают; вызов инструмента readwrite-группы отклоняется одинаково у обоих — набор из двух областей в запросе прав не расширил"

  # --- Ревизия 4: обмен присланного токена на постоянный (R-U12…R-U18, R-U10.1) ---
  - id: AC-214
    text: "Обмен прошёл: в хранилище лежит постоянный токен, выпущенный целевой системой, а не присланный (R-U13)"
    given: "способ user_token с verify {url '/me', account_field: username} и exchange {url '/me/tokens', method POST, headers {Authorization: 'Bearer {{access_token}}'}, body {description: '{{token_description}}'}, token_field: token, token_id_field: id, description: 'OpenCode Hub', revoke {...}}; мок целевой системы: verify отвечает 200 {'username': 'm.ivanov'} на оба токена, POST /me/tokens отвечает 200 {'id': 'tokid-1', 'token': 'PERMANENT-1', 'user_id': 'u1', 'description': 'OpenCode Hub (hub.test)', 'is_active': true}; HUB_PUBLIC_URL='https://hub.test'"
    when: "POST /api/me/connections/{alias}/token с телом {token: 'SESSION-1'}"
    then: "200 со status 'connected', token_origin == 'issued', token_origin_reason == null, account == 'm.ivanov'; мок получил запрос выпуска с заголовком Authorization 'Bearer SESSION-1' и телом {'description': 'OpenCode Hub (hub.test)'}; расшифровка upstream_tokens.access_token_enc даёт 'PERMANENT-1'; upstream_tokens.issued_token_id == 'tokid-1', token_origin == 'issued'; verify вызван дважды — с 'SESSION-1' и с 'PERMANENT-1'"
  - id: AC-215
    text: "При проксировании в целевую систему уходит постоянный токен, а не присланный (R-U13, R-P2)"
    given: "подключение из AC-214 создано (выпущен 'PERMANENT-1' в обмен на 'SESSION-1'); credential_headers сервера — {Authorization: 'Bearer {{access_token}}'}"
    when: "выполняется POST /mcp/{alias} с tools/list"
    then: "upstream получил заголовок Authorization 'Bearer PERMANENT-1'; строки 'SESSION-1' нет ни в одном исходящем запросе"
  - id: AC-216
    text: "Схема каталога: блок exchange принимается только в допустимом виде (R-U12, R-C1)"
    given: "каталоги со способом user_token, у которого: (а) корректный exchange с revoke; (б) exchange без revoke; (в) exchange у способа type: oauth2; (г) exchange.body со значением '{{access_token}}'; (д) exchange.revoke.body со значением '{{token_description}}'; (е) лишнее подполе exchange.retry; (ж) exchange.headers == {}; (з) exchange.description из 101 символа; (и) exchange.list без description_field; (к) способ user_token без exchange вовсе"
    when: "загружается каждый каталог"
    then: "(а) и (к) загружаются успешно, причём в (к) обмен не выполняется и поведение прежнее; (б)…(и) — ошибка схемы, сообщение содержит путь вида servers[0].auth_methods[<j>].exchange(.<подполе>)"
  - id: AC-217
    text: "Целевая система запрещает выпуск: подключение создаётся присланным токеном с причиной policy_denied (R-U14)"
    given: "способ user_token с корректным exchange; verify отвечает 200 {'username': 'm.ivanov'}; мок POST /me/tokens по очереди отвечает 403 {'id': 'api.context.permissions.app_error'}, затем 501, затем 400, затем 404"
    when: "для каждого случая выполняется POST /api/me/connections/{alias}/token с телом {token: 'SESSION-2'}"
    then: "во всех четырёх случаях ответ 200 (не 400, не 409 и не 502) со status 'connected', token_origin == 'submitted', token_origin_reason == 'policy_denied'; расшифровка upstream_tokens.access_token_enc даёт 'SESSION-2'; issued_token_id == null; запросы к exchange.revoke и exchange.list не отправлялись; в audit_log событие connection_connected с details.token_origin == 'submitted' и details.token_origin_reason == 'policy_denied'"
  - id: AC-218
    text: "Обмен не удался по недоступности или непригодному ответу: подключение всё равно создаётся, причина upstream_unavailable (R-U14)"
    given: "способ user_token с корректным exchange; verify отвечает 200 {'username': 'm.ivanov'}; мок POST /me/tokens по очереди отвечает: 500; 503; 429; сетевой ошибкой; таймаутом; 200 с телом 'not a json'; 200 с телом [1,2]; 200 с {'id': 'tokid', 'token': ''}; 200 с {'id': 'tokid', 'token': '   '}; 200 с {'id': 'tokid', 'token': 42}; 200 с {'token': 'PERM'} без id; 200 с {'id': '', 'token': 'PERM'}; 201 при expect_status 200"
    when: "для каждого случая выполняется POST /api/me/connections/{alias}/token с телом {token: 'SESSION-3'}"
    then: "во всех тринадцати случаях ответ 200 со status 'connected', token_origin == 'submitted', token_origin_reason == 'upstream_unavailable'; хранится 'SESSION-3', issued_token_id == null; ни одного запроса на exchange.revoke не отправлено"
  - id: AC-219
    text: "Выпущенный токен непригоден: он отзывается, подключение остаётся на присланном с причиной token_unusable (R-U13, R-U14)"
    given: "способ user_token с exchange и verify {account_field: username}; мок POST /me/tokens всегда отвечает 200 {'id': 'tokid-9', 'token': 'PERMANENT-9'}; verify отвечает 200 {'username': 'm.ivanov'} на 'SESSION-4' и по очереди на 'PERMANENT-9': 401; 500; 200 {'username': 'a.petrov'} (другой аккаунт)"
    when: "для каждого случая выполняется POST /api/me/connections/{alias}/token с телом {token: 'SESSION-4'}"
    then: "во всех трёх случаях 200 со status 'connected', token_origin == 'submitted', token_origin_reason == 'token_unusable'; хранится 'SESSION-4', issued_token_id == null; в каждом случае на exchange.revoke ушёл ровно один запрос с token_id 'tokid-9', отправленный с заголовком Authorization 'Bearer SESSION-4'; в audit_log есть upstream_token_revoked с details.reason == 'unusable'"
  - id: AC-220
    text: "Повторное подключение не плодит личные токены пользователя (R-U15)"
    given: "способ user_token с exchange, включая list {url '/me/tokens', id_field: id, description_field: description} и revoke; мок целевой системы ведёт список токенов пользователя и на каждый POST /me/tokens добавляет новый элемент с присланным description, отдавая {'id': 'tokid-<n>', 'token': 'PERMANENT-<n>'}; POST /tokens/revoke удаляет элемент по token_id; в списке изначально лежит чужой элемент {'id': 'foreign-1', 'description': 'Личный токен пользователя'}"
    when: "один и тот же пользователь трижды подряд выполняет POST /api/me/connections/{alias}/token с телами {token: 'SESSION-a'}, {token: 'SESSION-b'}, {token: 'SESSION-c'}"
    then: "все три ответа 200 с token_origin == 'issued'; после третьего в списке мока ровно два элемента — 'foreign-1' и последний выпущенный 'tokid-3'; upstream_tokens.issued_token_id == 'tokid-3', расшифровка access_token_enc даёт 'PERMANENT-3'; список и отзыв запрашивались новым постоянным токеном; отзыв 'tokid-1' и 'tokid-2' выполнен, отзыв 'foreign-1' не выполнялся ни разу"
  - id: AC-221
    text: "Отзываются только свои токены; сбой уборки не ломает подключение (R-U15.2, R-U15.3)"
    given: "способ user_token с exchange, list и revoke; HUB_PUBLIC_URL='https://hub.test' (маркер 'OpenCode Hub (hub.test)'); мок POST /me/tokens отдаёт {'id': 'tokid-new', 'token': 'PERMANENT-new'}; список отдаёт элементы с description: 'OpenCode Hub (hub.test)' (id 'own-old'), 'opencode hub (hub.test)' (id 'case'), 'OpenCode Hub (hub.test) — копия' (id 'suffix'), 'OpenCode Hub' (id 'prefix'), 'OpenCode Hub (other.test)' (id 'other-install'), 42 вместо строки (id 'nonstr'), элемент без description (id 'nodesc'), а также сам 'tokid-new'"
    when: "выполняется POST /api/me/connections/{alias}/token с телом {token: 'SESSION-5'}; отдельным прогоном тот же сценарий, но запрос списка отвечает 500, и ещё одним — запрос отзыва отвечает 500"
    then: "в первом прогоне отозван ровно один элемент — 'own-old'; 'case', 'suffix', 'prefix', 'other-install', 'nonstr', 'nodesc' и 'tokid-new' не отзывались; во всех трёх прогонах ответ 200 со status 'connected', token_origin == 'issued' и сохранённым 'PERMANENT-new'; в прогонах со сбоем в audit_log есть upstream_token_cleanup_failed со stage 'list' и 'revoke' соответственно, а тела ответов целевой системы в журнал не попали"
  - id: AC-222
    text: "При отключении выпущенный Hub'ом токен отзывается, присланный — никогда (R-U15.4, R-U5, решение 66)"
    given: "три подключения: (а) token_origin 'issued' с issued_token_id 'tokid-7'; (б) token_origin 'submitted' (обмен не удался); (в) token_origin 'issued', но мок отвечает на отзыв 500; у сервера объявлены exchange.revoke и OAuth-поле revoke_url"
    when: "для каждого выполняется DELETE /api/me/connections/{alias}"
    then: "(а) на exchange.revoke ушёл один запрос с token_id 'tokid-7', отправленный сохранённым постоянным токеном; (б) ни одного запроса на exchange.revoke и ни одного на revoke_url не отправлено; (в) отзыв провалился, но ответ всё равно успешный; во всех трёх случаях строка upstream_tokens удалена, connections.status == 'not_connected', клиентские токены Hub отозваны, записан аудит connection_disconnected, а последующий /mcp/{alias} отвечает -32002 not_connected; ни в одном случае не вызван OAuth revoke_url"
  - id: AC-223
    text: "При удавшемся обмене присланный токен не сохранён нигде (R-U13, R-U17)"
    given: "включён перехват логов всех уровней; сценарий AC-214, присланный токен 'SESSION-SECRET-6', выпущенный 'PERMANENT-6'"
    when: "POST /api/me/connections/{alias}/token с телом {token: 'SESSION-SECRET-6'}, затем GET /api/me/connections, GET /api/catalog, GET /ui/servers/{alias} и POST /mcp/{alias} с tools/list"
    then: "строки 'SESSION-SECRET-6' (и любого её фрагмента длиной 8 и более символов) нет: ни в одном значении таблиц upstream_tokens и connections, ни в audit_log (включая details), ни в значении кэша conn:<user_id>:<alias>, ни в теле любого из перечисленных ответов, ни в HTML, ни в одной записи журнала; при этом расшифровка access_token_enc даёт 'PERMANENT-6'"
  - id: AC-224
    text: "Постоянный токен, тело ответа на выпуск и идентификатор токена наружу и в журнал не попадают (R-U17)"
    given: "включён перехват логов всех уровней; мок POST /me/tokens отвечает 200 {'id': 'tokid-SECRET-ID', 'token': 'PERMANENT-SECRET-8', 'user_id': 'u1', 'extra': 'BODY-MARKER-8'}"
    when: "POST /api/me/connections/{alias}/token, затем GET /api/me/connections, GET /api/catalog, GET /remote-config, GET /metrics и GET /ui/servers/{alias}"
    then: "ни в одном ответе и ни в одной записи журнала нет 'PERMANENT-SECRET-8', 'BODY-MARKER-8' и 'tokid-SECRET-ID'; в audit_log есть upstream_token_issued с details {alias, auth_method} и connection_connected с details.token_origin == 'issued', и ни в одном details нет значения токена, идентификатора и тела ответа; в журнале при этом есть запись с alias, идентификатором способа и HTTP-кодом запроса выпуска"
  - id: AC-225
    text: "Пользователь видит, отвалится ли коннектор: постоянное и временное подключения различаются (R-U16)"
    given: "три подключения одного пользователя: (а) alias A, token_origin 'issued'; (б) alias B, token_origin 'submitted', token_origin_reason 'policy_denied'; (в) alias C — способ user_token без блока exchange, token_origin 'submitted', token_origin_reason null"
    when: "запрашиваются GET /api/me/connections, GET /ui/connections и GET /ui/servers/{alias} для каждого alias"
    then: "в /api/me/connections у A — token_origin 'issued' и token_origin_reason null, у B — 'submitted' и 'policy_denied', у C — 'submitted' и null; на страницах A сказано, что подключение постоянное и выход из мессенджера его не разорвёт; у B показано предупреждение о временном подключении и объяснение, что целевая система не разрешает выпуск личных токенов; у C страница выглядит как прежде — предупреждения о временном подключении нет (AC-185…AC-187 не изменились); ни на одной странице нет значения токена"
  - id: AC-226
    text: "Маркер выпущенного токена изолирует установки Hub друг от друга (R-U15.1)"
    given: "две установки Hub с HUB_PUBLIC_URL='https://hub.test' и 'https://hub-stage.test:8443', один и тот же каталог с exchange.description 'OpenCode Hub'; общий мок целевой системы, в списке которого уже лежит элемент с description 'OpenCode Hub (hub-stage.test:8443)' и id 'stage-1'"
    when: "пользователь подключается через установку hub.test"
    then: "в теле запроса выпуска description == 'OpenCode Hub (hub.test)'; элемент 'stage-1' не отозван; после подключения через hub-stage.test:8443 её запрос выпуска несёт description == 'OpenCode Hub (hub-stage.test:8443)', отзывается только 'stage-1', а токен, выпущенный установкой hub.test, не тронут"
  - id: AC-227
    text: "Наружу отдаётся только признак выпуска постоянного токена, но не сам блок обмена (R-U16, R-U8, R-C6)"
    given: "каталог с сервером, объявившим два способа: user_token с exchange и expiry, и user_token без них; и отдельный сервер без auth_methods вовсе"
    when: "GET /api/catalog (Bearer) и GET /ui/servers/{alias}"
    then: "у первого способа issues_permanent_token == true, у второго — false; ни в одном ответе и ни в одном HTML нет ключей exchange и expiry и ни одного их значения (адресов, заголовков, description, token_field, token_id_field); у сервера без auth_methods в публичном представлении нет ни ключа auth_methods, ни issues_permanent_token (AC-22 не изменился)"
  - id: AC-228
    text: "Запись каталога tag с блоками exchange и expiry принимается и работает (R-U10.1)"
    given: "каталог с записью tag из R-U10.1 (mode facade, verify /api/v4/users/me с account_field username, exchange на /api/v4/users/me/tokens с list и revoke, expiry на /api/v4/users/me/sessions); мок ТЭГ отвечает: verify 200 {'username': 'm.ivanov'}, POST /users/me/tokens 200 {'id': 'mm-1', 'token': 'MM-PERMANENT'}; HUB_PUBLIC_URL='https://hub.test'"
    when: "create_app(), GET /api/catalog и POST /api/me/connections/tag/token с телом {token: 'MMAUTHTOKEN-1'}"
    then: "старт успешен, схема принята; в /api/catalog у способа session_token issues_permanent_token == true; ответ подключения 200 с token_origin 'issued'; запрос выпуска ушёл на /api/v4/users/me/tokens методом POST с телом {'description': 'OpenCode Hub (hub.test)'} и заголовком Authorization 'Bearer MMAUTHTOKEN-1'; хранится 'MM-PERMANENT'; отдельным прогоном тот же каталог с моком, отвечающим 403 на /users/me/tokens и на GET /users/me/tokens, даёт 200 с token_origin 'submitted' и token_origin_reason 'policy_denied'"
  - id: AC-229
    text: "Неудача обмена не запоминается: следующее подключение повышает коннектор до постоянного токена (R-U14.4)"
    given: "подключение создано присланным токеном при моке, отвечающем 403 на выпуск (token_origin 'submitted', reason 'policy_denied'); затем мок начинает отвечать 200 {'id': 'tokid-late', 'token': 'PERMANENT-late'}"
    when: "тот же пользователь повторно выполняет POST /api/me/connections/{alias}/token с телом {token: 'SESSION-late'}"
    then: "запрос выпуска отправлен снова (без каких-либо пропусков попытки), ответ 200 с token_origin 'issued' и token_origin_reason null, хранится 'PERMANENT-late', issued_token_id == 'tokid-late'; обратный переход тоже работает: если после этого мок снова отвечает 403, следующее подключение даёт token_origin 'submitted' с reason 'policy_denied'"
  - id: AC-230
    text: "Срок годности присланного токена читается и показывается как верхняя граница (R-U18)"
    given: "способ user_token с expiry {url '/api/v4/users/me/sessions', expires_field: expires_at, expires_unit: ms} и exchange, отвечающим 403 на выпуск; мок сессий отдаёт массив из элементов с expires_at: <now+179 дней в мс>, <now+3 дня в мс>, 0 и <now-1 день в мс>"
    when: "POST /api/me/connections/{alias}/token, затем GET /api/me/connections и GET /ui/servers/{alias}"
    then: "ответ 200 с token_origin 'submitted'; session_expires_at равен наибольшему пригодному значению (now+179 дней) в ISO-8601 UTC, а не now+3 дня и не 0; в upstream_tokens.submitted_expires_at то же значение; на странице сервера дата показана с формулировкой «не позднее»; запрос сессий отправлен присланным токеном; при token_origin 'issued' (мок выпуска отвечает 200) запрос сессий не отправляется вовсе и session_expires_at == null"
  - id: AC-231
    text: "Невозможность прочитать срок ничего не ломает и не порождает выдуманных дат (R-U18.4)"
    given: "тот же способ с expiry; мок выпуска отвечает 403; мок сессий по очереди отвечает: 403; 500; сетевой ошибкой; таймаутом; 200 с телом 'not a json'; 200 с []; 200 с массивом, где все expires_at равны 0; 200 с массивом, где все expires_at в прошлом"
    when: "для каждого случая выполняется POST /api/me/connections/{alias}/token с телом {token: 'SESSION-11'}"
    then: "во всех восьми случаях ответ 200 со status 'connected', token_origin 'submitted', token_origin_reason 'policy_denied' и session_expires_at == null; submitted_expires_at в БД == null; на странице сервера показано предупреждение о временном подключении без какой-либо даты; тело ответа мока сессий в журнал не попало"
  # --- Ревизия 4.1: сирота выпущенного токена при неудавшемся обмене (R-U19, §31) ---
  - id: AC-232
    text: "Неудавшийся обмен на переподключении: прежний выпущенный токен отзывается до того, как Hub перестаёт знать его идентификатор (R-U19, дополнение R-U14.3)"
    given: "подключение уже создано обменом: token_origin 'issued', issued_token_id 'tokid-1', хранится 'PERMANENT-1'; тот же способ user_token с exchange, list и revoke; verify отвечает 200 {'username': 'm.ivanov'} и на 'SESSION-2', и на 'PERMANENT-1'; мок POST /me/tokens теперь отвечает 403; мок отзыва отвечает 200"
    when: "тот же пользователь выполняет POST /api/me/connections/{alias}/token с телом {token: 'SESSION-2'}"
    then: "ответ 200 со status 'connected', token_origin == 'submitted', token_origin_reason == 'policy_denied', хранится 'SESSION-2'; на exchange.revoke ушёл ровно один запрос с token_id 'tokid-1', отправленный с заголовком Authorization 'Bearer PERMANENT-1'; после подключения upstream_tokens.issued_token_id == null; в audit_log есть upstream_token_revoked с details {alias, reason: 'exchange_failed', outcome: 'ok'}, и ни в одном details и ни в одной записи журнала нет 'tokid-1', 'PERMANENT-1' и 'SESSION-2'"
  - id: AC-233
    text: "Отзыв прежнего токена не удался: одна запасная попытка присланным токеном, затем пометка на уборку (R-U19.3, R-U19.4)"
    given: "то же состояние, что в AC-232 (issued_token_id 'tokid-1', хранится 'PERMANENT-1'), выпуск отвечает 403; мок отзыва отвечает 401 на запрос с Authorization 'Bearer PERMANENT-1'; два прогона: (а) на запрос с Authorization 'Bearer SESSION-2' отзыв отвечает 200; (б) отзыв отвечает 500 на оба запроса"
    when: "в каждом прогоне выполняется POST /api/me/connections/{alias}/token с телом {token: 'SESSION-2'}"
    then: "в обоих прогонах ответ 200 со status 'connected', token_origin == 'submitted', token_origin_reason == 'policy_denied', хранится 'SESSION-2'; запросов на exchange.revoke ровно два и не больше, второй отправлен присланным токеном; в (а) issued_token_id == null; в (б) issued_token_id остался 'tokid-1' при token_origin 'submitted', в audit_log есть upstream_token_revoked с outcome 'failed' и upstream_token_cleanup_failed с details {alias, stage: 'revoke'}, тела ответов целевой системы в журнал не попали, а 'tokid-1' не встречается ни в одном details, ни в одной записи журнала и ни в одном ответе API"
  - id: AC-234
    text: "Пометку на уборку подбирает ближайший заход: удачное подключение, повторно неудачное подключение и отключение (R-U19.6, уточнение R-U15.4)"
    given: "подключение с token_origin 'submitted', token_origin_reason 'policy_denied' и пометкой issued_token_id 'tokid-1' (прежний отзыв провалился); способ с exchange, list и revoke; мок отзыва отвечает 200"
    when: "три независимых прогона: (а) мок выпуска отвечает 200 {'id': 'tokid-2', 'token': 'PERMANENT-2'} и пользователь подключается заново; (б) мок выпуска снова отвечает 403 и пользователь подключается заново; (в) пользователь выполняет DELETE /api/me/connections/{alias}"
    then: "(а) ответ 200 с token_origin 'issued', issued_token_id == 'tokid-2', хранится 'PERMANENT-2', на отзыв ушёл запрос с token_id 'tokid-1', отправленный новым постоянным токеном; (б) ответ 200 с token_origin 'submitted', попытка отзыва 'tokid-1' выполнена снова, а не пропущена, и после удачного отзыва issued_token_id == null; (в) на отзыв ушёл ровно один запрос с token_id 'tokid-1', строка upstream_tokens удалена, connections.status == 'not_connected', записан аудит connection_disconnected; ни в одном из трёх прогонов не отзывался присланный токен и не вызывался OAuth revoke_url"
  - id: AC-235
    text: "Отзывать нечем: запросов не отправляется, пометка сохраняется, факт фиксируется, отключение всё равно проходит (R-U19.5, R-U19.8)"
    given: "подключение создано обменом (token_origin 'issued', issued_token_id 'tokid-1'); каталог перечитан, и у того же способа блока exchange больше нет; verify без изменений отвечает 200 {'username': 'm.ivanov'}"
    when: "(а) пользователь подключается тем же способом с телом {token: 'SESSION-9'}; (б) затем выполняет DELETE /api/me/connections/{alias}"
    then: "(а) ответ 200 со status 'connected', token_origin == 'submitted', token_origin_reason == null (обмен не предусмотрен), хранится 'SESSION-9', issued_token_id остался 'tokid-1'; ни одного исходящего запроса отзыва и списка не отправлено; в audit_log есть upstream_token_cleanup_failed с details {alias, stage: 'orphan'} без идентификатора токена, в журнале запись WARNING с alias и стадией без значений; (б) ответ успешный, строка upstream_tokens удалена, записаны connection_disconnected и upstream_token_cleanup_failed со stage 'orphan', запросов отзыва по-прежнему ноль"
  - id: AC-236
    text: "Признак issues_permanent_token отдаётся и для способа с available: false, а блок exchange — нет (R-U16, уточнение ревизии 4.1)"
    given: "каталог с сервером, объявившим два способа user_token: (а) available: false с unavailable_reason и блоком exchange; (б) available: true без exchange"
    when: "запрашиваются GET /api/catalog (Bearer) и GET /ui/servers/{alias}, затем выполняется POST /api/me/connections/{alias}/token с method способа (а)"
    then: "у способа (а) issues_permanent_token == true, available == false и показан текст unavailable_reason; у способа (б) issues_permanent_token == false; ни в ответе, ни в HTML нет ключа exchange и ни одного его значения (адреса, заголовков, description, token_field, token_id_field); попытка подключиться способом (а) отвечает 409 auth_method_unavailable, и ни одного запроса на выпуск при этом не отправлено (AC-179, AC-193 не изменились)"
  - id: AC-237
    text: "Hub не забывает выпущенный токен: непустой issued_token_id исчезает только по подтверждённому отзыву, по замене новым выпущенным или вместе со строкой (R-U19.8, R-U14.3)"
    given: "строка upstream_tokens с issued_token_id 'tokid-1' и способ с exchange и revoke; шесть независимых прогонов подключения: (1) обмен удался и отзыв 'tokid-1' удался; (2) обмен удался, а отзыв 'tokid-1' отвечает 500; (3) обмен отвечает 403, отзыв удался; (4) обмен отвечает 403, отзыв отвечает 500; (5) выпущенный токен непригоден (token_unusable), отзыв 'tokid-1' отвечает 500; (6) способ без блока exchange"
    when: "в каждом прогоне выполняется POST /api/me/connections/{alias}/token и затем читается строка upstream_tokens"
    then: "в (1) issued_token_id == идентификатор нового выпущенного токена; в (2) там тоже новый идентификатор, а факт неубранного прежнего записан событием upstream_token_cleanup_failed; в (3) issued_token_id == null; в (4), (5) и (6) issued_token_id == 'tokid-1' — пометка сохранена; ни в одном прогоне ответ подключения не отличается от 200 со status 'connected', и значения token_origin и token_origin_reason не зависят от исхода уборки"
  # --- Ревизия 4.2: сквозные поля карточки каталога permission_groups и type (R-C7, §32) ---
  - id: AC-238
    text: "Схема принимает необязательные permission_groups и type и остаётся строгой во всём остальном (R-C7.1, дополнение R-C1)"
    given: "каталоги с сервером, у которого: (а) permission_groups — mapping {version: 1, groups: [{id: 'read', title: 'Чтение', description: 'd', default: true, tools: ['a']}], rest: {mode: 'deny'}} и type: 'messenger'; (б) permission_groups: 'строка'; (в) permission_groups: [1, 2]; (г) permission_groups: 42; (д) permission_groups: null; (е) type: ''; (ж) type: 7; (з) неизвестное поле сервера colour: 'red'; (и) ни permission_groups, ни type не заданы"
    when: "загружается каждый каталог"
    then: "(а) и (и) загружаются успешно; (б)…(ж) — ошибка загрузки с путём servers[0].permission_groups или servers[0].type соответственно; (з) — по-прежнему ошибка о неизвестном поле servers[0].colour; в прогоне (и) публичное представление сервера в /api/catalog не содержит ключей permission_groups и type вовсе и совпадает с представлением до ревизии байт в байт (AC-22 не изменился)"
  - id: AC-239
    text: "Оба поля протаскиваются в /api/catalog дословно (R-C7.2, R-C7.3, дополнение R-C6)"
    given: "каталог с двумя серверами: у первого type: 'vcs' и permission_groups с вложенностью и смешанными типами {version: 2, groups: [{id: 'b', title: 'B', default: false, tools: ['t2', 't1']}, {id: 'a', title: 'A', default: true, tools: []}], rest: {limit: 10, enabled: true, note: null}, unknown_to_hub: {x: [1, 2, 3]}}; у второго ни одного из двух полей"
    when: "запрашивается GET /api/catalog (Bearer), а также GET /.well-known/opencode и GET /remote-config"
    then: "у первого сервера значение permission_groups в ответе равно исходному узлу каталога полностью: те же ключи в том же порядке, та же вложенность, числа остались числами, true остался булевым, null остался null, порядок элементов groups и tools не изменён, ключ unknown_to_hub на месте; type == 'vcs'; у второго сервера ключей permission_groups и type нет вовсе; ни /.well-known/opencode, ни /remote-config новых полей не содержат и не изменились"
  - id: AC-240
    text: "Файл permissions/<alias>.yaml подставляется как permission_groups и главнее поля карточки (R-C7.5, решения 106, 107)"
    given: "файл каталога, рядом с которым лежит каталог permissions с файлами: alpha.yaml с содержимым {version: 9, groups: [{id: 'from-file'}]}, ghost.yaml для несуществующего alias, beta.yml (расширение .yml) для существующего сервера beta; в каталоге три сервера: alpha с полем permission_groups {version: 1, groups: [{id: 'from-card'}]}, beta без поля, gamma без поля"
    when: "приложение стартует и запрашивается GET /api/catalog; отдельным прогоном тот же каталог без соседнего каталога permissions"
    then: "у alpha permission_groups равен содержимому alpha.yaml целиком (version == 9, единственная группа 'from-file'), значение карточки не использовано и ни с чем не слито; у beta и gamma ключа permission_groups нет вовсе (beta.yml не считается файлом словаря); наличие ghost.yaml ошибкой не является и загрузку не ломает; в прогоне без каталога permissions у alpha permission_groups равен значению карточки, а у beta и gamma ключа нет; POST /admin/catalog/reload после правки alpha.yaml отдаёт 200 и новое содержимое видно в /api/catalog без перезапуска"
  - id: AC-241
    text: "Непригодный файл словаря — ошибка загрузки каталога, а не молчаливый пропуск (R-C7.6)"
    given: "каталог с сервером alpha; каталог permissions, в котором alpha.yaml по очереди: не разбирается как YAML; пуст (0 байт); содержит null; содержит список [1, 2]; содержит строку"
    when: "для каждого случая выполняется create_app(), затем POST /admin/catalog/reload с верным X-Admin-Token на уже работающем приложении, затем mcp-hub catalog validate"
    then: "во всех пяти случаях create_app() завершается ошибкой, сообщение на русском содержит путь permissions/alpha.yaml; reload отвечает 400 и действующий каталог не заменён (AC-20 не изменился); CLI печатает сообщение с тем же путём и завершается с кодом 1"
  - id: AC-242
    text: "Сквозные поля не участвуют ни в одной логике Hub (R-C7.4, R-C7.8)"
    given: "два одинаковых каталога, отличающихся только тем, что во втором у сервера facade добавлены permission_groups и type; подключение пользователя и мок upstream настроены одинаково"
    when: "в обоих прогонах выполняются POST /api/me/connections/{alias}/token, POST /mcp/{alias} с tools/list и вызовом инструмента, GET /ui/servers/{alias} и GET /ui/connections"
    then: "ответы /mcp/{alias} совпадают полностью, включая состав tools/list и результат вызова; заголовки, ушедшие в upstream, совпадают байт в байт; пресеты, группы и статус подключения одинаковы; HTML обеих страниц одинаков (витрина новые поля не показывает); единственное отличие между прогонами — два дополнительных ключа в элементе GET /api/catalog"
  - id: AC-243
    text: "Внутри сквозного узла env:VAR запрещён, а ${VAR} и $ref не раскрываются (R-C7.7, R-C2, R-C3, R-K3)"
    given: "каталоги: (а) permission_groups с вложенным значением 'env:TAG_OAUTH_CLIENT_SECRET'; (б) файл permissions/alpha.yaml с таким же значением; (в) permission_groups с вложенной строкой '${SOME_VAR}' при заданной переменной SOME_VAR='подставлено'; (г) permission_groups со вложенным узлом {$ref: '#/servers/alpha/permission_model'}; (д) permission_groups: {$ref: '#/servers/alpha/permission_model'} целиком; (е) другое поле карточки со ссылкой $ref на #/servers/alpha/permission_groups"
    when: "загружается каждый каталог и, где загрузка успешна, запрашивается GET /api/catalog"
    then: "(а) и (б) — ошибка загрузки с путём к полю, значение переменной окружения ни в ответах, ни в журнале не появляется; (в) загружается, и в ответе строка осталась дословно '${SOME_VAR}', а не 'подставлено'; (г) загружается, и узел {$ref: …} отдан наружу дословно как данные; (д) и (е) — ошибка загрузки с путём к полю; при этом подстановка ${VAR}, ссылки env:VAR и $ref в остальных полях карточки работают как прежде (AC-12, AC-14, AC-15, AC-16 не изменились)"
  # --- Ревизия 4.3: выход из приложения и отзыв ключа LiteLLM (R-L11, R-L12, §33) ---
  - id: AC-244
    text: "DELETE /api/me/key отзывает предъявленный ключ в LiteLLM, убирает его в Hub и делает недействительным немедленно (R-L11)"
    given: "пользователь u1 вошёл, получив постоянный ключ 'sk-out-1' (строка api_keys с key_alias 'opencode-u1-...'); ключ уже использован для GET /api/me, поэтому лежит в кэше keyauth; мок LiteLLM отвечает 200 на POST /key/delete; включён перехват логов всех уровней"
    when: "выполняется DELETE /api/me/key с Authorization 'Bearer sk-out-1', затем сразу GET /api/me с тем же ключом, затем повторный DELETE /api/me/key с ним же"
    then: "первый ответ 200 {status: 'ok', revoked: true, revoke_error: null} с текстом message на русском; в LiteLLM ушёл ровно один POST /key/delete с телом {keys: ['sk-out-1']} и заголовком Authorization 'Bearer sk-out-1'; строки api_keys с этим key_sha256 больше нет, строка users сохранена; GET /api/me отвечает 401 сразу, без сдвига часов (кэш keyauth сброшен); повторный DELETE отвечает 401, второго запроса в LiteLLM не ушло и новых записей аудита не появилось; в audit_log есть logout с details {key_kind, key_alias, revoked: true, revoke_error: null} и key_revoked с reason 'logout' и outcome 'ok'"
  - id: AC-245
    text: "Отказ LiteLLM выход не отменяет, но виден честно кодом причины (R-L11.4, R-L11.6, R-L11.7)"
    given: "пользователь вошёл с ключом 'sk-out-2'; мок POST /key/delete по очереди отвечает: 404; 401; 403; 429; 500; сетевой ошибкой; таймаутом; 200 с телом 'not a json'; 418"
    when: "для каждого случая выполняется DELETE /api/me/key с Bearer sk-out-2"
    then: "во всех девяти случаях ответ 200 со status 'ok', строка api_keys удалена и ключ немедленно перестаёт аутентифицировать; при 404 — revoked true и revoke_error null (отзывать нечего — это успех); при 401 и 403 — revoked false и revoke_error 'not_permitted'; при 429, 500, сетевой ошибке и таймауте — 'upstream_unavailable'; при не-JSON теле и 418 — 'invalid_response'; в каждом случае message объясняет исход по-русски, а в audit_log записан logout с тем же значением revoke_error и key_revoked с outcome 'failed' там, где отзыв не удался"
  - id: AC-246
    text: "Выход трогает только ключ: подключения, токены целевых систем, веб-сессии и чужие ключи не затронуты (R-L11.8)"
    given: "пользователь u1 с двумя ключами 'sk-a' и 'sk-b' (настройка HUB_LOGIN_REVOKES_PREVIOUS_KEYS выключена), подключением к alias tag с сохранённым токеном целевой системы, действующей веб-сессией и выданным клиентским OAuth-токеном Hub; пользователь u2 со своим ключом 'sk-u2'"
    when: "выполняется DELETE /api/me/key с Bearer sk-a"
    then: "ответ 200; ключ 'sk-b' по-прежнему отвечает 200 на GET /api/me, 'sk-u2' тоже; строка connections и строка upstream_tokens пользователя u1 не изменились, запросов отзыва в целевую систему не отправлено (R-U5, R-U15.4 и R-U19 не запускались), клиентский токен Hub продолжает работать на /mcp/tag, веб-сессия жива и /ui/connections открывается; в LiteLLM ушёл ровно один POST /key/delete и только со значением 'sk-a'"
  - id: AC-247
    text: "Выход доступен только по ключу: без заголовка, с неизвестным ключом и по одной лишь cookie — 401 (R-L11.2)"
    given: "действующая веб-сессия пользователя u1 с корректным CSRF-токеном и действующий ключ 'sk-live'"
    when: "выполняются DELETE /api/me/key: без заголовка Authorization; с Bearer 'sk-unknown'; с cookie hub_session и заголовком X-CSRF-Token, но без Bearer; с Bearer sk-live"
    then: "первые три — 401 {error: 'unauthorized'} с hint 'выполните вход: opencode corp login' и заголовком WWW-Authenticate: Bearer, ни одного запроса в LiteLLM не отправлено, ни одна строка api_keys не удалена; четвёртый — 200; при этом POST /auth/logout по-прежнему завершает только веб-сессию и ключей не трогает (AC-137 не изменился)"
  - id: AC-248
    text: "Повторный вход отзывает прежние постоянные ключи, только если это включено настройкой (R-L12)"
    given: "мок LiteLLM выдаёт ключи 'sk-1', затем 'sk-2'; мок POST /key/delete отвечает 200, а в отдельном прогоне 500"
    when: "пользователь u1 входит дважды подряд при HUB_LOGIN_REVOKES_PREVIOUS_KEYS=false; затем то же при умолчании (true); затем то же при умолчании и отказе отзыва; затем — вход после DELETE /api/me/key"
    then: "при false обе попытки дают 200, в api_keys две строки, оба ключа отвечают 200 на GET /api/me и запросов на /key/delete не было (та же ветка контракта, что в AC-45); при умолчании второй вход отвечает 200 ready с ключом 'sk-2', в LiteLLM ушёл ровно один POST /key/delete с телом {key_aliases: [<алиас sk-1>]} и заголовком Authorization с тем же SSO-JWT, которым выполнялся /key/generate, отправленный ПОСЛЕ запроса выпуска; строки прежнего ключа в api_keys нет и 'sk-1' отвечает 401, а 'sk-2' — 200; ключи с key_kind 'jwt' в теле отзыва не упоминаются; при отказе отзыва (500) вход всё равно успешен и поля ответа ready не изменились, а в audit_log есть key_revoked с reason 'relogin' и outcome 'failed'; после выхода следующий вход не отправляет запрос отзыва вовсе"
  - id: AC-249
    text: "Значения ключей, их хеши и служебный ключ LiteLLM не попадают в ответы, журнал и аудит (R-L11.9, R-K3)"
    given: "включён перехват логов всех уровней; HUB_LITELLM_ADMIN_KEY='sk-admin-SECRET'; пользователь вошёл с ключом 'sk-out-SECRET'; мок POST /key/delete отвечает 200 с телом {'message': 'sk-out-SECRET deleted', 'extra': 'BODY-MARKER-L'}"
    when: "выполняются DELETE /api/me/key, затем повторный вход с отзывом прежнего ключа при HUB_LOGIN_REVOKES_PREVIOUS_KEYS=true, затем GET /api/me, GET /metrics и GET /health"
    then: "ни в одном ответе и ни в одной записи журнала нет 'sk-out-SECRET', 'sk-admin-SECRET', 'BODY-MARKER-L' и sha256('sk-out-SECRET'); в audit_log записи logout и key_revoked содержат только key_alias, key_kind, revoked, revoke_error, reason и outcome, и ни в одном details нет значения ключа и его хеша; при этом в журнале есть запись с user_id, key_alias и HTTP-кодом ответа LiteLLM; запрос отзыва ушёл с заголовком Authorization 'Bearer sk-admin-SECRET' (задан служебный ключ), а не со значением пользовательского ключа"
