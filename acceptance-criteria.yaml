# Критерии приёмки I-1 (см. spec.md). Все проверяются против локальных моков (respx, in-memory KV, SQLite).
criteria:
  # --- Конфигурация (R-K1..R-K4) ---
  - id: AC-01
    text: "Отсутствие обязательной переменной HUB_PUBLIC_URL (или HUB_LITELLM_BASE_URL, HUB_SECRET_KEY, HUB_ENCRYPTION_KEY) делает старт приложения невозможным с сообщением, содержащим имя переменной"
    given: "окружение без HUB_PUBLIC_URL, остальные обязательные заданы"
    when: "вызывается create_app()"
    then: "выбрасывается исключение, текст которого содержит 'HUB_PUBLIC_URL'; для каждой из остальных обязательных переменных — аналогично"
  - id: AC-02
    text: "HUB_ENCRYPTION_KEY валидируется как ключ Fernet"
    given: "HUB_ENCRYPTION_KEY = 'not-a-key'"
    when: "вызывается create_app()"
    then: "ошибка старта с упоминанием 'HUB_ENCRYPTION_KEY'; при корректном ключе Fernet приложение создаётся"
  - id: AC-03
    text: "Значения по умолчанию применяются, если переменные не заданы"
    given: "заданы только обязательные HUB_* переменные и валидный каталог"
    when: "запрашивается GET /.well-known/opencode"
    then: "config.enabled_providers == ['magnit_prod']; provider.magnit_prod.name == 'LiteLLM Copilot prod'; models содержит 'MagnitCopilot' с limit {context: 250000, output: 8192}; auth.env == 'MAGNIT_COPILOT_KEY'"
  - id: AC-04
    text: "HUB_WELLKNOWN_AUTH_COMMAND разбирается как JSON-массив строк с подстановкой <HUB_PUBLIC_URL>"
    given: "HUB_PUBLIC_URL = 'https://hub.test/' (со слэшем); HUB_WELLKNOWN_AUTH_COMMAND не задана"
    when: "запрашивается GET /.well-known/opencode"
    then: "auth.command == ['opencode','corp','login','--hub','https://hub.test'] (без завершающего слэша); при HUB_WELLKNOWN_AUTH_COMMAND='not json' create_app() завершается ошибкой с именем переменной"
  - id: AC-05
    text: "Секреты не попадают в логи"
    given: "включён перехват логов; HUB_SECRET_KEY='S3CR3T-HUB'; выполнен полный вход (start → poll → ready с ключом 'sk-test-abc' и JWT)"
    when: "просматриваются все записи логов приложения"
    then: "ни одна запись не содержит 'S3CR3T-HUB', 'sk-test-abc', JWT, poll_secret Hub и poll_secret LiteLLM ('ll-secret')"
  - id: AC-06
    text: "create_app принимает готовые настройки и не требует переменных окружения"
    given: "окружение очищено от HUB_*; объект Settings создан программно с обязательными полями"
    when: "вызывается create_app(settings=settings)"
    then: "приложение создаётся; GET /health отвечает 200"

  # --- Каталог (R-C1..R-C6) ---
  - id: AC-07
    text: "Валидный каталог репозитория загружается при старте"
    given: "HUB_CATALOG_PATH указывает на copy catalog.yaml репозитория; переменные ${…} из него заданы"
    when: "вызывается create_app() и GET /health"
    then: "приложение создаётся; /health возвращает catalog_version == 1"
  - id: AC-08
    text: "Отсутствие обязательного поля сервера — ошибка старта с путём к полю"
    given: "каталог, у второго сервера отсутствует title"
    when: "вызывается create_app()"
    then: "ошибка старта; сообщение содержит 'servers[1].title'"
  - id: AC-09
    text: "Некорректный или повторяющийся alias — ошибка загрузки"
    given: "каталог с alias 'Bad_Alias' (не по регэкспу ^[a-z][a-z0-9-]{0,31}$; также варианты '-x', '1abc', 'ABC', 'with space', 33 символа) либо с двумя серверами alias 'gitlab'; контрольные валидные alias: 'a' (1 символ) и 32 символа"
    when: "вызывается create_app()"
    then: "ошибка старта; для дубликата сообщение содержит 'gitlab'; для каждого некорректного — путь 'servers[0].alias'; для контрольных валидных alias приложение создаётся (ревизия 1.1: alias 1–32 символа)"
  - id: AC-10
    text: "Поля, обязательные по режиму, проверяются: native без mcp_url и facade без upstream_url/auth/credential_headers невалидны"
    given: "каталог с native-сервером без mcp_url; каталог с facade-сервером без auth"
    when: "вызывается create_app() для каждого"
    then: "в обоих случаях ошибка старта с путём к отсутствующему полю (например 'servers[0].mcp_url', 'servers[0].auth')"
  - id: AC-11
    text: "Недопустимые значения перечислений отклоняются"
    given: "каталог со status: 'alpha' (или mode: 'proxy', или permission_model.kind: 'magic')"
    when: "вызывается create_app()"
    then: "ошибка старта; сообщение содержит путь к полю ('servers[0].status' и т.п.)"
  - id: AC-12
    text: "${VAR} подставляется из окружения; отсутствие переменной у ga-сервера — ошибка с именем переменной"
    given: "каталог с ga-сервером, у которого mcp_url: '${TEST_MCP_URL}'"
    when: "TEST_MCP_URL='https://x.test/mcp' → create_app(); затем TEST_MCP_URL не задана → create_app()"
    then: "в первом случае /api/catalog отдаёт mcp_url 'https://x.test/mcp'; во втором — ошибка старта, содержащая 'TEST_MCP_URL' и путь к полю"
  - id: AC-13
    text: "Отсутствие ${VAR} у beta-сервера делает его unconfigured: каталог валиден, сервер скрыт"
    given: "каталог: beta-сервер 'tag' с mcp_url '${TAG_MCP_URL}' (переменная не задана) и ga-сервер 'gitlab'"
    when: "create_app(); GET /api/catalog (Bearer) и GET /.well-known/opencode"
    then: "приложение стартует; в servers /api/catalog нет alias 'tag', есть 'gitlab'; в config.mcp well-known нет ключа 'tag'"
  - id: AC-14
    text: "Ссылки env:VAR не требуют переменной при загрузке и никогда не сериализуются наружу"
    given: "каталог с facade-сервером, client_secret: 'env:GL_SECRET'; переменная GL_SECRET не задана"
    when: "create_app(); GET /api/catalog, GET /.well-known/opencode, POST /admin/catalog/reload"
    then: "старт успешен; ни одно тело ответа не содержит подстроки 'GL_SECRET' и 'client_secret'"
  - id: AC-15
    text: "env:VAR вне разрешённых полей — ошибка схемы"
    given: "каталог, где mcp_url: 'env:SOME_URL'"
    when: "вызывается create_app()"
    then: "ошибка старта с путём 'servers[0].mcp_url'"
  - id: AC-16
    text: "$ref внутри файла разрешается (одна ступень)"
    given: "каталог: сервер 'gitlab' с permission_model header_groups и сервер 'gitlab-platform' с permission_model: {$ref: '#/servers/gitlab/permission_model'}"
    when: "GET /api/catalog (Bearer)"
    then: "permission_model у 'gitlab-platform' равен permission_model у 'gitlab' (kind, groups, always)"
  - id: AC-17
    text: "Некорректный $ref — ошибка загрузки"
    given: "каталог со ссылкой на несуществующий alias ('#/servers/nope/permission_model') либо со ссылкой на поле, которое само является $ref"
    when: "вызывается create_app()"
    then: "ошибка старта; сообщение содержит путь к полю и текст ссылки"
  - id: AC-18
    text: "Без HUB_ADMIN_TOKEN эндпоинт перезагрузки отключён; с неверным токеном — запрещён"
    given: "приложение без HUB_ADMIN_TOKEN; приложение с HUB_ADMIN_TOKEN='adm'"
    when: "POST /admin/catalog/reload без заголовка / с X-Admin-Token: 'wrong' / с 'adm' на первом; без заголовка и с 'wrong' на втором"
    then: "первое приложение всегда 404 {error:'not_found'}; второе — 403 {error:'forbidden'} без заголовка и с неверным токеном"
  - id: AC-19
    text: "Успешная перезагрузка атомарно заменяет каталог и пишет аудит"
    given: "HUB_ADMIN_TOKEN='adm'; каталог загружен с одним сервером; файл на диске изменён (добавлен второй сервер, version: 2)"
    when: "POST /admin/catalog/reload с X-Admin-Token: adm; затем GET /api/catalog и GET /health"
    then: "200 {status:'ok', catalog_version: 2, servers: 2}; /api/catalog содержит оба сервера; /health.catalog_version == 2; в audit_log есть запись action='catalog_reloaded'"
  - id: AC-20
    text: "Невалидный файл при перезагрузке не заменяет действующий каталог"
    given: "HUB_ADMIN_TOKEN='adm'; каталог загружен; файл на диске заменён на невалидный (нет title) либо удалён"
    when: "POST /admin/catalog/reload с верным токеном; затем GET /api/catalog"
    then: "400 {error:'catalog_invalid', message содержит путь к полю или указание на файл}; /api/catalog отдаёт прежний каталог без изменений"
  - id: AC-21
    text: "CLI `mcp-hub catalog validate` возвращает 0 для валидного и 1 для невалидного каталога"
    given: "два файла: валидный каталог и каталог с ошибкой схемы"
    when: "запускается mcp-hub catalog validate --path <файл> для каждого (без остальных HUB_* переменных)"
    then: "валидный: код выхода 0, вывод содержит 'OK'; невалидный: код 1, вывод содержит путь к полю; несуществующий путь: код 1"
  - id: AC-22
    text: "Публичное представление сервера содержит разрешённые поля и не содержит секретов/внутренних URL"
    given: "каталог с facade 'gitlab' (upstream_url, auth, credential_headers) и native 'tag' (mcp_url 'https://tag.test/mcp'); HUB_PUBLIC_URL='https://hub.test'"
    when: "GET /api/catalog (Bearer)"
    then: "у каждого сервера есть alias,title,description,owner,contact,docs_url,status,mode,mcp_url,permission_model,auth_kind=='oauth2'; у 'gitlab' mcp_url=='https://hub.test/mcp/gitlab'; у 'tag' mcp_url=='https://tag.test/mcp'; нигде нет ключей upstream_url, auth, client_id, client_secret, credential_headers, static_headers, header"
  - id: AC-23
    text: "Пустой каталог валиден"
    given: "каталог {version: 1, servers: []}"
    when: "create_app(); GET /api/catalog (Bearer); GET /.well-known/opencode"
    then: "старт успешен; /api/catalog → {version: 1, servers: []}; well-known config.mcp == {}"

  # --- Вход (R-L1..R-L10) ---
  - id: AC-24
    text: "POST /cli/start создаёт собственную сессию Hub и возвращает данные для браузера"
    given: "мок LiteLLM POST /sso/cli/start → {login_id:'ll-1', poll_secret:'ll-secret', user_code:'ABCD-1234', expires_in: 600}; HUB_LOGIN_SESSION_TTL=600"
    when: "POST /cli/start с телом {client:'opencode-fork/1.17.9'}"
    then: "200 с login_id (≠'ll-1'), poll_secret (≠'ll-secret'), browser_url == '<LITELLM>/sso/key/generate?source=litellm-cli&key=ll-1', user_code=='ABCD-1234', expires_in==600; мок вызван 1 раз; в audit_log запись 'login_started' с details.client"
  - id: AC-25
    text: "expires_in сессии — минимум из TTL Hub и expires_in LiteLLM"
    given: "HUB_LOGIN_SESSION_TTL=600; мок /sso/cli/start отдаёт expires_in: 120"
    when: "POST /cli/start"
    then: "expires_in == 120; при отсутствии expires_in в ответе LiteLLM — expires_in == 600"
  - id: AC-26
    text: "Недоступность LiteLLM при старте входа — 502 без создания сессии"
    given: "мок /sso/cli/start → 500 (вариант: сетевая ошибка; вариант: 200 без login_id)"
    when: "POST /cli/start"
    then: "502 {status:'error', error:'litellm_unavailable'}; hub_login_sessions_active не увеличилась"
  - id: AC-27
    text: "Некорректное тело /cli/start отклоняется"
    given: "тело '{\"client\": 123}' или строка длиннее 128 символов"
    when: "POST /cli/start"
    then: "400 {error:'invalid_request'}; LiteLLM не вызывался; при пустом теле — 200"
  - id: AC-28
    text: "Rate-limit /cli/start: 30 запросов в минуту на IP, скользящее окно"
    given: "один IP, подменяемые часы, LiteLLM-мок отвечает 200"
    when: "31 запрос POST /cli/start подряд; затем часы сдвигаются на 61 с и выполняется ещё один запрос"
    then: "первые 30 → 200; 31-й → 429 {error:'rate_limited'} с заголовком Retry-After ≥ 1, LiteLLM для него не вызывался; после сдвига времени → 200"
  - id: AC-29
    text: "Poll неизвестного или истёкшего login_id → 404 login_expired"
    given: "сессия не создавалась (вариант: создана, часы сдвинуты за TTL)"
    when: "GET /cli/poll/<id> с любым X-Hub-Poll-Secret"
    then: "404 {status:'error', error:'login_expired'}; LiteLLM не вызывался"
  - id: AC-30
    text: "Poll с неверным или отсутствующим секретом → 403"
    given: "живая сессия"
    when: "GET /cli/poll/<login_id> без X-Hub-Poll-Secret; затем с X-Hub-Poll-Secret: 'wrong'; затем с poll_secret LiteLLM 'll-secret'"
    then: "все три ответа 403 {status:'error', error:'forbidden'}; LiteLLM не вызывался"
  - id: AC-31
    text: "Poll в состоянии ожидания подтверждения в браузере → pending"
    given: "живая сессия; мок GET /sso/cli/poll/ll-1 → {status:'pending'}"
    when: "GET /cli/poll/<login_id> с верным секретом"
    then: "200 {status:'pending'}; мок вызван с заголовком x-litellm-cli-poll-secret == 'll-secret'"
  - id: AC-32
    text: "Опрос LiteLLM дросселируется до 1 раза в 2 с на сессию"
    given: "живая сессия; мок poll → pending; подменяемые часы"
    when: "GET /cli/poll трижды в течение 1 с; затем часы +2 с и ещё один GET /cli/poll"
    then: "после первых трёх мок вызван 1 раз, все ответы {status:'pending'}; после сдвига времени мок вызван 2 раза"
  - id: AC-33
    text: "Несколько команд → team_selection_required, LiteLLM больше не опрашивается до выбора"
    given: "мок poll → {status:'ready', requires_team_selection:true, teams:['t1','t2'], team_details:[{team_id:'t1',team_alias:'A'},{team_id:'t2',team_alias:'B'}]}"
    when: "GET /cli/poll; часы +3 с; GET /cli/poll повторно"
    then: "оба ответа 200 {status:'team_selection_required', teams:[{team_id:'t1',team_alias:'A'},{team_id:'t2',team_alias:'B'}]}; мок вызван 1 раз"
  - id: AC-34
    text: "Выбор команды из списка принимается и передаётся в LiteLLM"
    given: "сессия в состоянии team_selection_required (t1,t2); мок poll с ?team_id=t2 → ready с JWT; мок /key/generate → 200 {key:'sk-test-1'}"
    when: "POST /cli/poll/<id>/team {team_id:'t2'} с верным секретом; затем GET /cli/poll"
    then: "POST → 200 {status:'pending'}; poll → 200 {status:'ready', team_id:'t2', key:'sk-test-1', key_kind:'persistent'}; мок poll вызван с параметром team_id=t2; /key/generate получил team_id 't2'"
  - id: AC-35
    text: "Команда вне списка отклоняется"
    given: "сессия в состоянии team_selection_required (t1,t2)"
    when: "POST /cli/poll/<id>/team {team_id:'t9'}; затем POST с телом {} "
    then: "первый → 400 {status:'error', error:'invalid_team'}; второй → 400 {error:'invalid_request'}; состояние сессии не изменилось (poll снова team_selection_required)"
  - id: AC-36
    text: "Ошибки доступа и состояния для POST …/team"
    given: "сессия в состоянии pending (выбор не требуется); неизвестный login_id"
    when: "POST /cli/poll/<id>/team {team_id:'t1'} с неверным секретом; с верным секретом на pending-сессии; на неизвестном id"
    then: "403 forbidden; 409 {status:'error', error:'team_selection_not_required'}; 404 login_expired соответственно"
  - id: AC-37
    text: "Единственная команда выбирается автоматически без участия клиента"
    given: "мок poll без team_id → requires_team_selection с одной командой t1; мок poll с ?team_id=t1 → ready с JWT; /key/generate → 200"
    when: "GET /cli/poll один раз"
    then: "200 {status:'ready', team_id:'t1', key_kind:'persistent'}; клиент не получал team_selection_required; мок poll вызван дважды (без и с team_id) в рамках одного запроса"
  - id: AC-38
    text: "Пустой список команд при requires_team_selection — некорректный ответ LiteLLM"
    given: "мок poll → {status:'ready', requires_team_selection:true, teams:[], team_details:[]}"
    when: "GET /cli/poll"
    then: "502 {status:'error', error:'litellm_invalid_response'}; сессия жива (повторный poll через 2 с — не 404)"
  - id: AC-39
    text: "Пользователь без команд получает ключ без team_id"
    given: "мок poll → {status:'ready', key:<JWT>, user_id:'u1', teams:[]} без team_id; /key/generate → 200 {key:'sk-test-2'}"
    when: "GET /cli/poll"
    then: "200 {status:'ready', key:'sk-test-2', team_id: null}; тело запроса к /key/generate не содержит team_id"
  - id: AC-40
    text: "Получив JWT, Hub создаёт постоянный ключ и возвращает его клиенту"
    given: "сессия создана с client 'opencode-fork/1.17.9'; HUB_KEY_ALIAS_PREFIX='opencode'; мок poll → ready с JWT (claims sub:'u1', email:'u1@corp.test', exp в будущем), user_id 'u1', team_id 't1'; мок /key/generate → 200 {key:'sk-test-3'}"
    when: "GET /cli/poll"
    then: "200 {status:'ready', key:'sk-test-3', key_kind:'persistent', user:{user_id:'u1', email:'u1@corp.test'}, team_id:'t1'} без expires_in; запрос к /key/generate имел Authorization 'Bearer <JWT>', key_alias по маске 'opencode-u1-YYYYMMDD-HHMM', metadata {source:'opencode-mcp-hub', client:'opencode-fork/1.17.9'}, team_id 't1'"
  - id: AC-41
    text: "4xx от /key/generate → возвращается JWT как ключ, это не ошибка"
    given: "мок poll → ready с JWT (exp = now+3600); мок /key/generate → 403"
    when: "GET /cli/poll"
    then: "200 {status:'ready', key:<JWT>, key_kind:'jwt', expires_in ≈ 3600 (±5)}; в логах ровно одно предупреждение о fallback для этой сессии; в api_keys запись с key_kind 'jwt' и expires_at"
  - id: AC-42
    text: "5xx/сетевая ошибка /key/generate → 502, сессия жива, повторный poll повторяет только /key/generate"
    given: "мок poll → ready с JWT; мок /key/generate → 500 (затем переключается на 200 {key:'sk-test-4'}); подменяемые часы"
    when: "GET /cli/poll; часы +2 с; GET /cli/poll"
    then: "первый → 502 {status:'error', error:'litellm_unavailable'}; второй → 200 ready key 'sk-test-4'; мок poll LiteLLM вызван 1 раз, /key/generate — 2 раза"
  - id: AC-43
    text: "Сессия входа одноразовая"
    given: "сессия завершена ответом ready"
    when: "GET /cli/poll/<id> и POST /cli/poll/<id>/team с верным секретом"
    then: "оба → 404 {status:'error', error:'login_expired'}; hub_login_sessions_active уменьшилась на 1"
  - id: AC-44
    text: "Ключ и пользователь сохраняются: хеш вместо ключа, upsert пользователя, аудит"
    given: "вход завершён с ключом 'sk-test-3' пользователя u1/u1@corp.test, client 'c1'"
    when: "читаются таблицы users, api_keys, audit_log"
    then: "users содержит одну строку u1 с email; api_keys содержит строку с key_sha256 == sha256('sk-test-3') hex в нижнем регистре, key_kind 'persistent', key_alias по маске, client 'c1', created_at; ни в одной таблице нет подстроки 'sk-test-3'; audit_log содержит action 'login_completed' с details.key_kind == 'persistent'"
  - id: AC-45
    text: "Повторный вход того же пользователя добавляет ключ, старые остаются валидными"
    given: "пользователь u1 дважды прошёл вход (ключи 'sk-a' и 'sk-b')"
    when: "GET /api/me с Bearer sk-a и с Bearer sk-b"
    then: "оба → 200 user_id 'u1'; в api_keys две строки для u1; в users одна строка"
  - id: AC-46
    text: "Ошибки LiteLLM при SSO-poll обрабатываются по типу"
    given: "живая сессия; мок poll → 500 (вариант: сетевая ошибка); другая живая сессия; мок poll → 404"
    when: "GET /cli/poll для каждой; часы +2 с; повторный GET /cli/poll для первой"
    then: "первая: 502 {status:'error', error:'litellm_unavailable'}, повторный poll не 404 (сессия жива); вторая: 404 {status:'error', error:'login_expired'}, повторный poll тоже 404 (сессия удалена)"
  - id: AC-47
    text: "Ответы /cli/* не раскрывают poll_secret LiteLLM; login_id LiteLLM появляется только внутри browser_url ответа /cli/start (ревизия 1.1)"
    given: "мок LiteLLM с login_id 'll-1' и poll_secret 'll-secret'; полный сценарий start → poll (pending, team_selection_required, ready)"
    when: "просматриваются тела всех ответов /cli/*"
    then: "ни одно тело не содержит 'll-secret'; поле login_id в /cli/start ≠ 'll-1'; после удаления значения browser_url из ответа /cli/start ни одно тело /cli/* не содержит подстроки 'll-1'; browser_url == '<LITELLM>/sso/key/generate?source=litellm-cli&key=ll-1'"
  - id: AC-48
    text: "Аутентификация Bearer: валидный ключ пропускается, отсутствие/неверный — 401 с подсказкой"
    given: "в api_keys есть ключ 'sk-ok' пользователя u1"
    when: "GET /api/me с 'Authorization: Bearer sk-ok'; без заголовка; с 'Bearer sk-bad'; с 'Basic xxx'"
    then: "первый → 200; остальные → 401 {error:'unauthorized', hint:'выполните вход: opencode corp login'} и заголовок WWW-Authenticate: Bearer"
  - id: AC-49
    text: "Заголовок x-litellm-api-key принимается для совместимости"
    given: "в api_keys есть ключ 'sk-ok'"
    when: "GET /api/me с заголовком x-litellm-api-key: sk-ok (без Authorization)"
    then: "200 с user_id владельца ключа"
  - id: AC-50
    text: "Результат аутентификации кэшируется на 60 с"
    given: "ключ 'sk-ok' аутентифицирован один раз; затем строка удалена из api_keys напрямую; подменяемые часы"
    when: "GET /api/me с sk-ok в течение 60 с; затем часы +61 с и снова GET /api/me"
    then: "первый → 200 (из кэша); после сдвига → 401"

  # --- API (R-A1..R-A8) ---
  - id: AC-51
    text: "/health и /ready доступны без аутентификации и отражают состояние"
    given: "приложение запущено с каталогом version 1"
    when: "GET /health; GET /ready; затем /ready при недоступной БД (движок закрыт/подменён на ошибочный)"
    then: "/health → 200 {status:'ok', version:<строка>, catalog_version:1, time:<ISO-8601>}; /ready → 200 {status:'ready'}; при недоступной БД /ready → 503 {status:'not_ready', error:'not_ready'}"
  - id: AC-52
    text: "/api/me возвращает данные пользователя и ключа, которым выполнен запрос"
    given: "u1 имеет ключ 'sk-p' (persistent) и ключ 'jwt-1' (jwt)"
    when: "GET /api/me с каждым ключом"
    then: "оба → 200 {user_id:'u1', email, key_kind, created_at}, где key_kind соответствует использованному ключу ('persistent' и 'jwt')"
  - id: AC-53
    text: "/api/catalog требует аутентификации и отдаёт серверы с блоком connection"
    given: "каталог с 'gitlab' и 'tag'; пользователь u1 без подключений"
    when: "GET /api/catalog без ключа; затем с Bearer u1"
    then: "без ключа → 401; с ключом → 200 {version:1, servers:[…]}, у каждого сервера connection == {status:'not_connected', preset:null, updated_at:null}; порядок серверов как в файле"
  - id: AC-54
    text: "Фильтр include_deprecated"
    given: "каталог с ga-сервером 'a' и deprecated-сервером 'old'"
    when: "GET /api/catalog; GET /api/catalog?include_deprecated=false; ?include_deprecated=0; ?include_deprecated=true"
    then: "по умолчанию и при true — оба сервера, у 'old' status=='deprecated'; при false и 0 — только 'a'"
  - id: AC-55
    text: "Фильтр по audience: сервер виден, если audience содержит all или пересекается с группами пользователя"
    given: "каталог: 'a' audience ['all'], 'b' audience ['devs'], 'c' audience ['devs','all']; у пользователя группы ['all']"
    when: "GET /api/catalog (Bearer)"
    then: "в servers присутствуют 'a' и 'c', отсутствует 'b'"
  - id: AC-56
    text: "/api/me/connections отдаёт подключения пользователя (пустой список по умолчанию)"
    given: "пользователь u1 без строк в connections; пользователь u2 со строкой {alias:'gitlab', status:'connected', preset:'readonly', groups:['core']} (вставлена напрямую)"
    when: "GET /api/me/connections с ключом u1 и с ключом u2; без ключа"
    then: "u1 → 200 []; u2 → 200 [{alias:'gitlab', status:'connected', preset:'readonly', groups:['core'], created_at, updated_at}]; без ключа → 401"
  - id: AC-57
    text: "Блок connection в /api/catalog отражает строки connections пользователя"
    given: "у u2 строка connections {alias:'gitlab', status:'needs_reauth', preset:'readwrite'}"
    when: "GET /api/catalog с ключом u2"
    then: "у 'gitlab' connection == {status:'needs_reauth', preset:'readwrite', updated_at:<не null>}; у остальных серверов status 'not_connected'"
  - id: AC-58
    text: "/.well-known/opencode отдаёт auth, config провайдера и remote_config без аутентификации"
    given: "HUB_PUBLIC_URL='https://hub.test', HUB_LITELLM_BASE_URL='https://litellm.test', HUB_WELLKNOWN_ENV_NAME='MAGNIT_COPILOT_KEY'"
    when: "GET /.well-known/opencode без заголовков"
    then: "200; заголовок Cache-Control == 'public, max-age=300' и есть ETag; auth == {command:[…], env:'MAGNIT_COPILOT_KEY'}; config.$schema == 'https://opencode.ai/config.json'; config.autoupdate == false; provider.magnit_prod.npm == '@ai-sdk/openai-compatible'; options.baseURL == 'https://litellm.test/v1'; options.apiKey == '{env:MAGNIT_COPILOT_KEY}'; remote_config == {url:'https://hub.test/remote-config', headers:{Authorization:'Bearer {env:MAGNIT_COPILOT_KEY}'}}"
  - id: AC-59
    text: "well-known содержит mcp-запись для каждого видимого сервера без секретов и без ссылок каталога env:VAR (плейсхолдеры {env:<HUB_WELLKNOWN_ENV_NAME>} допустимы — ревизия 1.1)"
    given: "HUB_WELLKNOWN_ENV_NAME='MAGNIT_COPILOT_KEY'; каталог: facade 'gitlab' (audience all, auth.client_secret 'env:GL_SECRET', credential_headers со значением 'env:GL_TOKEN', static_headers {'X-Static': 'env:GL_STATIC'}), native 'tag' (audience all, mcp_url 'https://tag.test/mcp'), сервер 'b' (audience ['devs']), deprecated 'old' (audience all), beta 'u' unconfigured"
    when: "GET /.well-known/opencode"
    then: "config.mcp имеет ключи 'gitlab', 'tag', 'old' и не имеет 'b', 'u'; mcp.gitlab == {type:'remote', url:'https://hub.test/mcp/gitlab', enabled:false, oauth:{}}; mcp.tag.url == 'https://tag.test/mcp'; ни у одной записи нет ключа headers; сериализованное тело config.mcp не содержит подстроки 'env:'; всё тело не содержит 'upstream', 'client_secret', 'credential_headers', 'static_headers', 'GL_SECRET', 'GL_TOKEN', 'GL_STATIC'; после удаления из тела всех вхождений '{env:MAGNIT_COPILOT_KEY}' подстрока 'env:' отсутствует (то есть все вхождения 'env:' — только плейсхолдеры provider.*.options.apiKey и remote_config.headers.Authorization из AC-58)"
  - id: AC-60
    text: "ETag well-known: 304 при совпадении If-None-Match, новый ETag после изменения каталога"
    given: "HUB_ADMIN_TOKEN='adm'; GET /.well-known/opencode вернул ETag E1 (формат: 16 hex-символов в кавычках)"
    when: "GET с If-None-Match: E1; затем каталог перезагружен с новым сервером; GET снова"
    then: "первый → 304 без тела, с заголовком ETag E1; после перезагрузки → 200 с ETag E2 ≠ E1; повторный GET с If-None-Match: E1 → 200"
  - id: AC-61
    text: "/remote-config требует Bearer и отдаёт пустые объекты при отсутствии подключений"
    given: "пользователь u1 без подключений"
    when: "GET /remote-config без ключа; затем с ключом u1"
    then: "без ключа → 401; с ключом → 200 {config:{mcp:{}, permission:{}, tools:{}}}; заголовок Cache-Control == 'private, no-store'"
  - id: AC-62
    text: "/remote-config включает подключённые серверы"
    given: "у u2 строки connections: {alias:'gitlab', status:'connected'}, {alias:'jira', status:'needs_reauth'}"
    when: "GET /remote-config с ключом u2"
    then: "config.mcp == {gitlab:{enabled:true}}; 'jira' отсутствует"
  - id: AC-63
    text: "Единый формат ошибок и заголовок nosniff на всех ответах"
    given: "приложение запущено"
    when: "GET /nope; GET /api/me без ключа; POST /cli/start с невалидным телом; GET /health"
    then: "404 {error:'not_found'}; 401 {error:'unauthorized', …}; 400 {error:'invalid_request', message}; все четыре ответа имеют Content-Type application/json и X-Content-Type-Options: nosniff; ответ не содержит заголовков Access-Control-*"
  - id: AC-64
    text: "X-Request-ID возвращается: переданный сохраняется, отсутствующий генерируется"
    given: "приложение запущено; перехват логов"
    when: "GET /health с X-Request-ID: 'req-123'; GET /health без заголовка"
    then: "первый ответ содержит X-Request-ID == 'req-123', и запись лога о запросе содержит request_id 'req-123'; второй содержит непустой X-Request-ID (формат uuid)"

  # --- Хранилище и наблюдаемость (R-S1..R-S5) ---
  - id: AC-65
    text: "Схема БД создаётся при старте"
    given: "HUB_DATABASE_URL указывает на пустую SQLite"
    when: "create_app() и инициализация приложения (lifespan)"
    then: "в БД существуют таблицы users, api_keys, connections, audit_log с полями из spec.md §6 (в том числе api_keys.key_sha256 уникален, connections уникален по (user_id, alias))"
  - id: AC-66
    text: "In-memory KeyValueStore соблюдает TTL"
    given: "in-memory реализация KeyValueStore с подменяемыми часами"
    when: "set('k', v, ttl=5); get('k'); часы +6 с; get('k'); set без последующего delete/expire; delete('k2') после set"
    then: "первый get → v; после истечения → None; после delete → None"
  - id: AC-67
    text: "/metrics отдаёт метрики Prometheus: счётчик запросов, гистограмму латентности, активные сессии входа"
    given: "выполнены GET /health и один POST /cli/start (сессия жива)"
    when: "GET /metrics без аутентификации"
    then: "200 text/plain; тело содержит 'hub_http_requests_total{' с method='GET', path='/health', status='200'; 'hub_http_request_duration_seconds_bucket'; 'hub_login_sessions_active 1'"
  - id: AC-68
    text: "Записи audit_log не содержат секретов"
    given: "выполнены полный вход (ключ 'sk-test-5', JWT, poll_secret) и перезагрузка каталога"
    when: "читаются все строки audit_log"
    then: "есть actions login_started, login_completed, catalog_reloaded; сериализованные details ни одной строки не содержат 'sk-test-5', JWT, poll_secret Hub/LiteLLM, HUB_ADMIN_TOKEN"
  - id: AC-69
    text: "CLI предоставляет команды serve и catalog validate"
    given: "пакет установлен (entrypoint mcp-hub)"
    when: "запускается mcp-hub --help и mcp-hub catalog --help"
    then: "код выхода 0; вывод содержит 'serve' и 'catalog'; для catalog — 'validate' и опцию '--path'"

  # ==========================================================================
  # Ревизия 2 — итерация I-3 (spec.md, часть II, разделы 9–18).
  # Все проверки — против локальных моков: мок AS целевой системы, мок upstream MCP
  # (streamable-http/SSE), мок OIDC, моки LiteLLM из I-1; часы подменяемые, KV in-memory, SQLite.
  # ==========================================================================

  # --- Настройки (R-T1..R-T4) ---
  - id: AC-70
    text: "Дефолты новых настроек применяются, если переменные не заданы"
    given: "заданы только обязательные переменные I-1 и валидный каталог с facade-сервером 'gitlab'"
    when: "пройден флоу до POST /oauth/token и запрошен GET /.well-known/oauth-authorization-server"
    then: "в ответе /oauth/token expires_in == 3600; в теле access-токена exp - iat == 3600; экран прав показывается при каждом authorize (HUB_CONSENT=always); страница входа работает в режиме litellm (HUB_WEB_AUTH=litellm); второй tools/list в пределах 300 с не идёт на upstream"
  - id: AC-71
    text: "Невалидные значения новых настроек делают старт невозможным с указанием имени переменной"
    given: "окружение с обязательными переменными I-1"
    when: "create_app() вызывается поочерёдно с HUB_ACCESS_TOKEN_TTL='0', HUB_WEB_AUTH='bad', HUB_CONSENT='x', HUB_OAUTH_ALLOWED_REDIRECTS='not json', HUB_MAX_SSE_PER_USER='-1'"
    then: "каждый вызов завершается ошибкой, текст которой содержит имя соответствующей переменной; для HUB_WEB_AUTH и HUB_CONSENT текст содержит перечень допустимых значений"
  - id: AC-72
    text: "Режим keycloak требует KEYCLOAK_ISSUER и KEYCLOAK_CLIENT_SECRET, режим litellm — нет"
    given: "окружение с обязательными переменными I-1"
    when: "create_app() с HUB_WEB_AUTH='keycloak' без KEYCLOAK_ISSUER; затем без KEYCLOAK_CLIENT_SECRET; затем с обоими; затем с HUB_WEB_AUTH='litellm' без KEYCLOAK_*"
    then: "первые два вызова — ошибка старта с текстом, содержащим 'KEYCLOAK_ISSUER' и 'KEYCLOAK_CLIENT_SECRET' соответственно; третий и четвёртый — приложение создаётся"
  - id: AC-73
    text: "Окружение I-1 без единой новой переменной поднимает Hub с эндпоинтами I-3"
    given: "окружение ровно из четырёх обязательных переменных HUB_* (никаких других HUB_*/KEYCLOAK_* не задано) и каталог репозитория; переменные каталога, на которые он ссылается (GITLAB_OAUTH_CLIENT_ID, GITLAB_OAUTH_CLIENT_SECRET и аналогичные для остальных серверов), заданы — это настройки серверов каталога, а не настройки Hub: без них серверы переходят в состояние unconfigured и PRM для них 404 по R-C3/AC-79"
    when: "create_app(); GET /health; GET /.well-known/oauth-authorization-server; GET /.well-known/oauth-protected-resource/mcp/gitlab; GET /.well-known/opencode"
    then: "все четыре запроса — 200; ответ /.well-known/opencode совпадает с ожиданиями AC-58/AC-59 (поведение I-1 не изменилось)"
  - id: AC-74
    text: "Секреты и токены ревизии 2 не попадают в логи, аудит, метрики и HTML"
    given: "перехват логов; KEYCLOAK_CLIENT_SECRET='KC-S3CRET'; выполнен сквозной сценарий (регистрация клиента, authorize, OAuth целевой системы с токенами 'ups-access-1'/'ups-refresh-1', выдача токенов Hub, вызов через proxy)"
    when: "просматриваются записи логов, строки audit_log, тело GET /metrics и HTML страниц /ui/connections и /ui/servers/gitlab"
    then: "нигде не встречаются 'KC-S3CRET', 'ups-access-1', 'ups-refresh-1', значение refresh-токена Hub, значение кода авторизации, code_verifier, значение cookie hub_session; значение CSRF-токена отсутствует в логах, audit_log, /metrics и в HTML страниц /ui/connections и /ui/servers/gitlab (браузеру он доставляется cookie hub_csrf). На экране прав (HTML /oauth/authorize) CSRF-токен присутствует как скрытое поле формы — это требование R-W6, а не нарушение"

  # --- Hub как authorization server (R-O1..R-O13) ---
  - id: AC-75
    text: "Метаданные authorization server соответствуют RFC 8414 и настройкам Hub"
    given: "HUB_PUBLIC_URL='https://hub.test'; каталог с facade-серверами 'gitlab' и 'jira' и native 'tag'"
    when: "GET /.well-known/oauth-authorization-server без аутентификации"
    then: "200; issuer == 'https://hub.test'; authorization_endpoint == 'https://hub.test/oauth/authorize'; token_endpoint == '.../oauth/token'; registration_endpoint == '.../oauth/register'; revocation_endpoint == '.../oauth/revoke'; response_types_supported == ['code']; grant_types_supported == ['authorization_code','refresh_token']; code_challenge_methods_supported == ['S256']; token_endpoint_auth_methods_supported == ['none']; scopes_supported == ['gitlab:readonly','gitlab:readwrite','jira:readonly','jira:readwrite'] (native 'tag' отсутствует); заголовок Cache-Control == 'public, max-age=300'"
  - id: AC-76
    text: "Вариант метаданных AS с суффиксом пути ресурса отдаёт то же тело, для не-facade alias — 404"
    given: "каталог с facade 'gitlab', native 'tag'"
    when: "GET /.well-known/oauth-authorization-server/mcp/gitlab; GET /.well-known/oauth-authorization-server/mcp/tag; GET /.well-known/oauth-authorization-server/mcp/nope"
    then: "первый — 200 с телом, идентичным ответу без суффикса; второй и третий — 404 с телом {error:'not_found'}"
  - id: AC-77
    text: "Метаданные защищённого ресурса соответствуют RFC 9728"
    given: "HUB_PUBLIC_URL='https://hub.test'; facade-сервер 'gitlab' с title и docs_url"
    when: "GET /.well-known/oauth-protected-resource/mcp/gitlab"
    then: "200; resource == 'https://hub.test/mcp/gitlab'; authorization_servers == ['https://hub.test']; scopes_supported == ['gitlab:readonly','gitlab:readwrite']; bearer_methods_supported == ['header']; resource_name равен title сервера; тело не содержит upstream_url, client_secret, credential_headers"
  - id: AC-78
    text: "Запрос к /mcp/{alias} без Bearer-токена отвечает 401 с указанием метаданных ресурса"
    given: "facade-сервер 'gitlab'"
    when: "POST /mcp/gitlab с телом initialize и без заголовка Authorization; затем GET /mcp/gitlab без Authorization"
    then: "оба ответа — 401 {error:'unauthorized', message, hint}; заголовок WWW-Authenticate содержит 'Bearer' и resource_metadata=\"https://hub.test/.well-known/oauth-protected-resource/mcp/gitlab\"; upstream не вызывался"
  - id: AC-79
    text: "Метаданные ресурса и proxy недоступны для неизвестного, native и unconfigured alias"
    given: "каталог: facade 'gitlab', native 'tag', beta-facade 'u' в состоянии unconfigured"
    when: "GET /.well-known/oauth-protected-resource/mcp/{tag|u|nope}; POST /mcp/{tag|u|nope} с валидным токеном пользователя"
    then: "все ответы — 404 {error:'not_found'}"
  - id: AC-80
    text: "Динамическая регистрация публичного клиента возвращает client_id без client_secret"
    given: "HUB_OAUTH_ALLOWED_REDIRECTS по умолчанию"
    when: "POST /oauth/register с {redirect_uris:['http://127.0.0.1:19876/mcp/oauth/callback'], client_name:'OpenCode', grant_types:['authorization_code','refresh_token'], response_types:['code'], token_endpoint_auth_method:'none'}"
    then: "201; в теле непустой client_id и client_id_issued_at (unix-время), token_endpoint_auth_method == 'none', redirect_uris как в запросе; поле client_secret отсутствует; в audit_log появилась запись oauth_client_registered без секретов; повторная регистрация выдаёт другой client_id"
  - id: AC-81
    text: "Недопустимые redirect_uri и метаданные клиента отклоняются при регистрации"
    given: "HUB_OAUTH_ALLOWED_REDIRECTS = ['http://127.0.0.1:*','http://localhost:*']"
    when: "POST /oauth/register поочерёдно с redirect_uris ['http://evil.test/cb'], ['myapp://cb'], ['https://hub.test/cb#frag'], []; затем с валидным redirect и token_endpoint_auth_method='client_secret_post'; затем с response_types=['token']"
    then: "первые три — 400 {error:'invalid_redirect_uri', error_description}; пустой список и два последних — 400 {error:'invalid_client_metadata', error_description}; ни в одном случае клиент не сохранён"
  - id: AC-82
    text: "Регистрация клиентов ограничена по IP"
    given: "HUB_RATE_LIMIT_REGISTER=2"
    when: "с одного IP выполняются три подряд валидных POST /oauth/register в пределах 60 с; затем часы сдвигаются на 61 с и запрос повторяется"
    then: "первые два — 201; третий — 429 {error:'rate_limited'} с заголовком Retry-After >= 1 и без создания клиента; после сдвига часов — снова 201"
  - id: AC-83
    text: "Ошибки client_id/redirect_uri на authorize не редиректятся, а показываются страницей; расхождение только по порту loopback ошибкой не является"
    given: "зарегистрированы клиенты A (redirect 'http://127.0.0.1:19876/cb') и B (redirect 'http://127.0.0.1:20000/other-cb'); есть веб-сессия пользователя"
    when: "GET /oauth/authorize с неизвестным client_id; затем с client_id клиента A и redirect_uri клиента B; затем с client_id A вовсе без redirect_uri; затем с client_id A и redirect_uri 'http://127.0.0.1:20000/cb' (loopback, та же схема, хост и путь, другой порт)"
    then: "первые три — 400 text/html, без заголовка Location; тело содержит машиночитаемый код invalid_client или invalid_redirect_uri; код авторизации не выдан. Четвёртый принимается (R-O4.1, RFC 8252): ответ не 400 invalid_redirect_uri, флоу продолжается (вход/подключение/экран прав), а выданный в итоге код привязан к предъявленному redirect_uri"
  - id: AC-84
    text: "Прочие ошибки authorize возвращаются редиректом на зарегистрированный redirect_uri"
    given: "зарегистрирован клиент A с redirect 'http://127.0.0.1:19876/cb'; есть веб-сессия; каталог с facade 'gitlab'"
    when: "GET /oauth/authorize с response_type='token'; без code_challenge; с code_challenge_method='plain'; с resource='https://hub.test/mcp/nope'; со scope='gitlab:admin'"
    then: "каждый ответ — 302 на 'http://127.0.0.1:19876/cb' с параметрами error и state (state сохранён байт-в-байт): unsupported_response_type, invalid_request, invalid_request, invalid_target, invalid_scope соответственно; параметр code отсутствует"
  - id: AC-85
    text: "authorize без веб-сессии отправляет на вход и возвращает пользователя обратно"
    given: "зарегистрированный клиент, cookie сессии отсутствует; HUB_WEB_AUTH='litellm' с моком LiteLLM"
    when: "GET /oauth/authorize с корректными параметрами; затем выполняется вход; затем повторяется исходный URL"
    then: "первый ответ — 302 на /auth/login с параметром next, равным исходному URL authorize (в закодированном виде); после успешного входа установлена cookie hub_session и повторный запрос authorize продолжает флоу (экран прав или подключение к системе), а не редиректит на вход"
  - id: AC-86
    text: "Alias и scope определяются по resource, при его отсутствии — по scope; конфликт отклоняется"
    given: "каталог с facade 'gitlab' и 'jira'; веб-сессия; зарегистрированный клиент"
    when: "GET /oauth/authorize (а) с resource='https://hub.test/mcp/gitlab' без scope; (б) без resource со scope='jira:readwrite'; (в) с resource='https://hub.test/mcp/gitlab' и scope='jira:readonly'; (г) без resource и без scope"
    then: "(а) флоу идёт для alias 'gitlab', итоговый scope == 'gitlab:readonly'; (б) для alias 'jira', scope 'jira:readwrite'; (в) и (г) — редирект с error=invalid_request"
  - id: AC-87
    text: "При отсутствии подключения authorize сначала проводит OAuth целевой системы, затем показывает экран прав"
    given: "веб-сессия пользователя u1; подключения к 'gitlab' нет; мок AS целевой системы"
    when: "GET /oauth/authorize (корректные параметры); далее выполняется редирект на authorize_url мока и возврат на /oauth/callback/gitlab с кодом"
    then: "Hub редиректит на authorize_url из каталога с client_id каталога, redirect_uri == 'https://hub.test/oauth/callback/gitlab', state, code_challenge (pkce true) и scope 'read_api read_user read_repository'; после callback мок AS получил обмен кода с client_secret и code_verifier; создана строка connections со status 'connected'; пользователю показан HTML-экран прав"
  - id: AC-88
    text: "HUB_CONSENT управляет повторным показом экрана прав"
    given: "пользователь уже подключён к 'gitlab' и один раз дал согласие клиенту A на scope 'gitlab:readonly'"
    when: "повторный GET /oauth/authorize тем же клиентом с тем же scope при HUB_CONSENT='remember'; затем при HUB_CONSENT='always'; затем при 'remember', но со scope 'gitlab:readwrite'"
    then: "первый — сразу 302 на redirect_uri с code (экран прав не показан); второй — 200 HTML с экраном прав; третий — 200 HTML с экраном прав (scope отличается от сохранённого согласия)"
  - id: AC-89
    text: "Отказ на экране прав возвращает клиенту access_denied"
    given: "открыт экран прав с транзакцией tx; веб-сессия пользователя"
    when: "POST /oauth/consent с action='deny', валидным CSRF-токеном и tx"
    then: "302 на redirect_uri клиента с error='access_denied' и исходным state; параметр code отсутствует; код авторизации в БД не создан"
  - id: AC-90
    text: "Код авторизации одноразовый и живёт HUB_AUTH_CODE_TTL"
    given: "HUB_AUTH_CODE_TTL=60; получен код c и по нему уже выданы токены"
    when: "повторный POST /oauth/token с тем же кодом; отдельно — обмен кода спустя 61 с после выдачи"
    then: "оба запроса — 400 {error:'invalid_grant', error_description}; после повторного предъявления кода выданные по нему access-токен и refresh-токен отозваны: запрос к /mcp/gitlab с ними → 401, а refresh grant → 400 invalid_grant"
  - id: AC-91
    text: "Обмен кода на токены при верном PKCE выдаёт пару токенов"
    given: "получен код c для alias 'gitlab', scope 'gitlab:readonly'; известен code_verifier"
    when: "POST /oauth/token с grant_type='authorization_code', code, code_verifier, redirect_uri, client_id"
    then: "200; тело содержит access_token, token_type == 'Bearer', expires_in == 3600, непустой refresh_token, scope == 'gitlab:readonly'; заголовок Cache-Control == 'no-store'; в audit_log запись oauth_token_issued без значений токенов"
  - id: AC-92
    text: "Неверный или отсутствующий code_verifier отклоняется"
    given: "получен код c с code_challenge от известного verifier"
    when: "POST /oauth/token с code_verifier='wrong-verifier'; затем без параметра code_verifier"
    then: "оба — 400 {error:'invalid_grant', error_description}; токены не выданы; код после этого остаётся неиспользованным и корректный обмен по-прежнему возможен"
  - id: AC-93
    text: "Несовпадение client_id или redirect_uri при обмене кода отклоняется"
    given: "код c выдан клиенту A с redirect 'http://127.0.0.1:19876/cb'; зарегистрирован клиент B"
    when: "POST /oauth/token с кодом c и client_id клиента B; затем с client_id A и redirect_uri 'http://127.0.0.1:20000/cb'; затем с неизвестным client_id"
    then: "первые два — 400 {error:'invalid_grant'}; третий — 401 {error:'invalid_client'}; токены не выданы"
  - id: AC-94
    text: "Access-токен Hub — JWT HS256 с обязательным набором claims"
    given: "HUB_SECRET_KEY='hub-secret'; выдан токен для пользователя u1, alias 'gitlab', подключения с id N"
    when: "токен декодируется с проверкой подписи по HUB_SECRET_KEY"
    then: "заголовок alg == 'HS256'; claims: iss == 'https://hub.test', sub == 'u1', aud == 'https://hub.test/mcp/gitlab', scope == 'gitlab:readonly', cid == N, client_id равен client_id клиента, jti непустой и уникальный между двумя выдачами, exp - iat == 3600; refresh_token не является JWT и в БД хранится только его sha256 (поиск открытого значения в таблице refresh_tokens ничего не находит)"
  - id: AC-95
    text: "Refresh grant выдаёт новую пару и делает предъявленный refresh недействительным"
    given: "выданы access A1 и refresh R1"
    when: "POST /oauth/token с grant_type='refresh_token', refresh_token=R1, client_id; затем повторный запрос /mcp/gitlab с новым access A2"
    then: "200 с новыми access A2 != A1 и refresh R2 != R1, scope прежний; вызов /mcp/gitlab с A2 проходит; строка R1 переведена в состояние rotated"
  - id: AC-96
    text: "Повторное использование отозванного refresh отзывает всю цепочку"
    given: "выполнена ротация: R1 → R2 → R3, действует access A3"
    when: "POST /oauth/token с refresh_token=R1 (уже rotated); затем POST /oauth/token с R3; затем POST /mcp/gitlab с A3"
    then: "первый — 400 {error:'invalid_grant'}; второй — 400 {error:'invalid_grant'} (вся цепочка отозвана); третий — 401 {error:'unauthorized'} (jti токена A3 в denylist); в audit_log есть запись oauth_refresh_reuse_detected"
  - id: AC-97
    text: "Отзыв токена всегда отвечает 200 и делает выданные токены недействительными"
    given: "действуют access A и refresh R одной цепочки"
    when: "POST /oauth/revoke с token=R; затем POST /mcp/gitlab с A; затем refresh grant с R; затем revoke неизвестного токена 'nope'; затем POST /oauth/revoke без параметра token"
    then: "первый — 200 с телом {}; второй — 401; третий — 400 invalid_grant; четвёртый — 200 {}; пятый — 400 {error:'invalid_request'}; в audit_log есть oauth_token_revoked"
  - id: AC-98
    text: "Проверка access-токена: подпись, срок, аудитория"
    given: "действующий токен для alias 'gitlab'; каталог с facade 'gitlab' и 'jira'"
    when: "POST /mcp/gitlab с изменённой подписью (изменяется любой значащий символ подписи — так, чтобы декодированные байты подписи гарантированно отличались, а не только незначащие биты base64url-хвоста); с токеном, у которого exp в прошлом; с токеном, подписанным другим ключом; с валидным токеном для 'gitlab', но по адресу /mcp/jira"
    then: "первые три — 401 {error:'unauthorized'} с заголовком WWW-Authenticate, содержащим resource_metadata и error=\"invalid_token\"; четвёртый — 403 {error:'forbidden'}; upstream не вызывался ни разу"
  - id: AC-99
    text: "Горячий путь использует denylist и кэш подключения без обращения к БД"
    given: "выполнен успешный вызов /mcp/gitlab (кэш conn:u1:gitlab заполнен); HUB_CONNECTION_CACHE_TTL=60"
    when: "выполняется второй такой же вызов при заблокированной БД (сессии БД выбрасывают ошибку); затем токен отзывается и вызов повторяется; затем меняются права (PUT permissions) и вызов повторяется"
    then: "второй вызов проходит успешно без обращения к БД; после отзыва — 401 (jti в denylist KV); после смены прав кэш инвалидирован и запрос к upstream уходит с новым заголовком групп"
  - id: AC-100
    text: "Ошибки OAuth-эндпоинтов имеют формат RFC 6749 и не кэшируются"
    given: "приложение запущено"
    when: "POST /oauth/token с grant_type='password'; POST /oauth/token без параметров; POST /oauth/register с телом, не являющимся JSON"
    then: "ответы — JSON с ключами error и error_description (русский текст), без ключей message/hint формата R-A7; для /oauth/token заголовок Cache-Control == 'no-store'; все ответы содержат X-Content-Type-Options: nosniff и X-Request-ID; коды: unsupported_grant_type, invalid_request, invalid_client_metadata"
  - id: AC-101
    text: "Обращения к /oauth/token ограничены по паре client_id и IP"
    given: "HUB_RATE_LIMIT_TOKEN=3"
    when: "с одного IP выполняются четыре подряд запроса /oauth/token одного client_id в пределах 60 с; затем запрос с другим client_id"
    then: "четвёртый — 429 {error:'rate_limited'} с Retry-After; запрос другого client_id — обрабатывается обычным образом (лимит раздельный)"

  # --- Брокер токенов целевых систем (R-B1..R-B9) ---
  - id: AC-102
    text: "Параметры OAuth целевой системы берутся из каталога, включая scopes по пресету и PKCE"
    given: "каталог: 'gitlab' с pkce true и scopes readonly ['read_api','read_user','read_repository'] / readwrite ['api','read_user']; client_secret задан как env:GL_SECRET со значением 'gl-secret'"
    when: "пользователь подключается к 'gitlab' с пресетом readonly; затем другой пользователь — с пресетом readwrite"
    then: "мок AS получил authorize с scope 'read_api read_user read_repository' и 'api read_user' соответственно, с code_challenge_method='S256'; обмен кода выполнен с client_secret 'gl-secret'; значение 'gl-secret' не встречается ни в одном ответе Hub и ни в одной записи лога"
  - id: AC-103
    text: "Callback целевой системы проверяет state"
    given: "начата транзакция подключения к 'gitlab' с state S"
    when: "GET /oauth/callback/gitlab без state; со state 'other'; со state S дважды подряд; со state S из другой веб-сессии; с параметром error='access_denied' и валидным state"
    then: "запросы без state, с чужим state и повторный со state S — 400 с машинным кодом invalid_state; из другой веб-сессии — 400 invalid_state; при error='access_denied' пользователь получает страницу с русским пояснением (или редирект клиента с error=access_denied), токены не сохраняются"
  - id: AC-104
    text: "Токены целевой системы сохраняются только в зашифрованном виде"
    given: "мок AS выдаёт access 'ups-access-1', refresh 'ups-refresh-1', expires_in 7200"
    when: "пользователь завершает подключение к 'gitlab'; затем читается содержимое таблиц upstream_tokens и connections"
    then: "connections.status == 'connected'; в upstream_tokens поля access_token_enc и refresh_token_enc не содержат подстрок 'ups-access-1'/'ups-refresh-1'; расшифровка ключом HUB_ENCRYPTION_KEY даёт исходные значения; expires_at примерно равен now + 7200; в audit_log запись connection_connected без значений токенов"
  - id: AC-105
    text: "Фоновое обновление идёт заранее и защищено блокировкой от гонок"
    given: "HUB_TOKEN_REFRESH_LEAD=300; подключение с expires_at через 200 с и refresh-токеном; мок AS отвечает на refresh новой парой"
    when: "запускается цикл фонового обновления; параллельно из двух корутин инициируется обновление того же подключения"
    then: "мок AS получил ровно один запрос refresh; в БД сохранены новые значения, last_refresh_at обновлён; вторая корутина использует уже обновлённый токен; при expires_at через 3600 с фоновая задача обновление не запускает"
  - id: AC-106
    text: "401 от upstream вызывает обновление токена и однократный повтор запроса"
    given: "подключение с действующим (по времени) токеном; upstream отвечает 401 на первый вызов и 200 на последующий; мок AS обновляет токен"
    when: "POST /mcp/gitlab с методом tools/list"
    then: "клиент получает 200 с результатом; upstream получил два запроса, второй — с новым access-токеном в credential_headers; при повторном 401 после обновления клиент получает JSON-RPC ошибку -32002 и третьего запроса к upstream не было"
  - id: AC-107
    text: "Провал обновления переводит подключение в needs_reauth, токены клиента остаются валидными"
    given: "подключение с истекающим токеном; мок AS отвечает на refresh 400 invalid_grant"
    when: "выполняется обновление (фоновое или по требованию); затем POST /mcp/gitlab; затем GET /api/me/connections"
    then: "connections.status == 'needs_reauth' с заполненным needs_reauth_reason; ответ /mcp — 200 с JSON-RPC error code -32002, русским message и data.hint_url == 'https://hub.test/ui/servers/gitlab', data.reason == 'needs_reauth'; refresh-токен Hub клиента по-прежнему обменивается на новую пару (401 не возвращается); /api/me/connections показывает status 'needs_reauth'; в audit_log есть connection_needs_reauth"
  - id: AC-108
    text: "Истёкший upstream-токен без refresh-токена сразу даёт needs_reauth"
    given: "подключение, у которого expires_at в прошлом и refresh_token_enc пуст"
    when: "POST /mcp/gitlab с методом tools/list"
    then: "запрос к upstream не отправляется; ответ — 200 с JSON-RPC error -32002, data.reason == 'needs_reauth'; статус подключения — needs_reauth"
  - id: AC-109
    text: "Ротация refresh-токена целевой системы необязательна"
    given: "подключение с refresh 'ups-refresh-1'"
    when: "мок AS отвечает на refresh парой с новым refresh 'ups-refresh-2'; затем (для другого подключения) — ответом без поля refresh_token"
    then: "в первом случае сохранён 'ups-refresh-2'; во втором сохранён прежний refresh, статус остаётся connected, ошибки нет; оба подключения остаются рабочими для последующих вызовов"
  - id: AC-110
    text: "Смена прав применяется к следующему вызову без переподключения"
    given: "подключение 'gitlab' с пресетом readonly и группами ['code_review']; выполнен tools/list (кэш заполнен)"
    when: "PUT /api/me/connections/gitlab/permissions с {preset:'readonly', groups:['code_review','devops']}; затем POST /mcp/gitlab с tools/list"
    then: "200 {alias:'gitlab', status, preset:'readonly', groups:['code_review','devops']}; следующий запрос ушёл на upstream (кэш tools/list инвалидирован) с заголовком Enabled-Groups == 'core,code_review,devops'; повторного OAuth не потребовалось; в audit_log есть connection_permissions_changed"
  - id: AC-111
    text: "Расширение прав до readwrite требует повторной авторизации в целевой системе"
    given: "подключение 'gitlab' с пресетом readonly (scopes целевой системы readonly)"
    when: "PUT /api/me/connections/gitlab/permissions с {preset:'readwrite', groups:['repo_write']}; затем PUT с неизвестной группой 'nope'; затем PUT с группой 'admin' (preset none); затем PUT с {preset:'readonly', groups:['repo_write']}"
    then: "первый — 200 со status 'needs_reauth' и пояснением на русском; второй и третий — 400 {error:'invalid_request'}; четвёртый — 200, при этом группа repo_write в набор не попадает (в заголовке групп следующего вызова её нет)"
  - id: AC-112
    text: "Отключение отзывает токены системы и все клиентские токены подключения"
    given: "подключение 'gitlab' с revoke_url в каталоге; действуют access A и refresh R клиента; в каталоге есть также 'jira'"
    when: "DELETE /api/me/connections/gitlab; затем POST /mcp/gitlab с A; затем refresh grant с R; затем GET /remote-config и GET /api/catalog"
    then: "200 {alias:'gitlab', status:'not_connected'}; мок AS получил запрос revoke; строка upstream_tokens удалена; вызов /mcp — 401; refresh grant — 400 invalid_grant; /remote-config не содержит 'gitlab'; /api/catalog показывает connection.status == 'not_connected'; в audit_log есть connection_disconnected"
  - id: AC-113
    text: "Токены целевой системы не выходят наружу через API, страницы и метрики"
    given: "подключение с токенами 'ups-access-1'/'ups-refresh-1'"
    when: "выполняются GET /api/catalog, GET /api/me/connections, GET /ui/connections, GET /ui/servers/gitlab, GET /metrics, GET /remote-config"
    then: "ни один ответ не содержит 'ups-access-1', 'ups-refresh-1' или их зашифрованных значений; /api/me/connections содержит только alias, status, preset, groups, created_at, updated_at"

  # --- MCP-proxy (R-P1..R-P11) ---
  - id: AC-114
    text: "Проксирование initialize и tools/list на upstream работает для подключённого пользователя"
    given: "подключение 'gitlab' connected; мок upstream отвечает на initialize с Mcp-Session-Id 'up-1' и на tools/list списком из двух инструментов"
    when: "POST /mcp/gitlab с JSON-RPC initialize, затем POST /mcp/gitlab с tools/list и полученным Mcp-Session-Id"
    then: "оба ответа — 200 application/json с телом upstream (result без изменений, кроме фильтрации); upstream получил запросы по адресу upstream_url каталога тем же методом и с тем же телом"
  - id: AC-115
    text: "Заголовки к upstream: клиентский Authorization удалён, подставлены креды и группы"
    given: "каталог 'gitlab': credential_headers {Authorization: 'Bearer {{access_token}}'}, static_headers {X-Static: 'env:GL_STATIC'} со значением 'st-1', permission_model header_groups с header 'Enabled-Groups', always ['core']; подключение с preset readonly и группами ['devops','code_review']; upstream-токен 'ups-access-1'"
    when: "POST /mcp/gitlab с заголовками Authorization: Bearer <токен Hub>, Cookie: 'a=b', X-Forwarded-For: '1.2.3.4', Enabled-Groups: 'admin', Accept: 'application/json, text/event-stream', MCP-Protocol-Version: '2025-06-18'"
    then: "upstream получил Authorization == 'Bearer ups-access-1', X-Static == 'st-1', Enabled-Groups == 'core,code_review,devops' (always первым, далее порядок каталога; подставленное клиентом значение 'admin' отброшено), Accept и MCP-Protocol-Version как у клиента; заголовки Cookie и X-Forwarded-For отсутствуют; токен Hub на upstream не передан"
  - id: AC-116
    text: "SSE-ответ upstream передаётся потоково, таймаут даёт понятную ошибку"
    given: "мок upstream отвечает text/event-stream тремя событиями с паузами; HUB_UPSTREAM_TIMEOUT=1"
    when: "POST /mcp/gitlab с Accept: text/event-stream; отдельно — запрос к upstream, который не отвечает дольше таймаута"
    then: "в первом случае Content-Type ответа == 'text/event-stream', события доходят до клиента по мере поступления (первое событие получено до завершения потока), тело не буферизуется целиком; во втором — 502 с JSON-RPC error code -32004 и data.hint_url; заголовок Mcp-Session-Id upstream клиенту не передан"
  - id: AC-117
    text: "Клиент видит собственный Mcp-Session-Id, выданный Hub"
    given: "мок upstream выдаёт Mcp-Session-Id 'up-1' на initialize"
    when: "POST /mcp/gitlab с initialize; затем POST /mcp/gitlab с tools/list и полученным Mcp-Session-Id; затем POST с Mcp-Session-Id 'unknown-1'; затем POST с идентификатором сессии другого пользователя"
    then: "клиенту вернулся Mcp-Session-Id != 'up-1'; при следующем вызове upstream получил Mcp-Session-Id == 'up-1'; запрос с 'unknown-1' и с чужим идентификатором — 404 с JSON-RPC error code -32000"
  - id: AC-118
    text: "Простаивающая upstream-сессия прозрачно пересоздаётся"
    given: "HUB_UPSTREAM_IDLE_TTL=600; сессия установлена вызовом initialize с clientInfo {name:'opencode', version:'1.17.9'} и protocolVersion '2025-06-18'"
    when: "часы сдвигаются на 601 с и выполняется POST /mcp/gitlab с tools/list и прежним клиентским Mcp-Session-Id"
    then: "клиент получает 200 с результатом tools/list и тот же Mcp-Session-Id, что и раньше; upstream получил (best-effort DELETE старой сессии,) новый initialize с теми же clientInfo и protocolVersion, notifications/initialized и затем tools/list с новым upstream-идентификатором сессии"
  - id: AC-119
    text: "404 от upstream на существующей сессии вызывает одно пересоздание, повторная ошибка — -32004"
    given: "установлена сессия; мок upstream отвечает 404 на первый запрос с сессией, затем нормально"
    when: "POST /mcp/gitlab с tools/list; отдельно — сценарий, где upstream отвечает 404 и на повторный запрос после пересоздания"
    then: "в первом случае клиент получает 200 и корректный результат (одно пересоздание); во втором — 502 с JSON-RPC error -32004 и повторных попыток больше одной не было"
  - id: AC-120
    text: "DELETE закрывает сессию у upstream и в Hub"
    given: "установлена сессия (клиентский id S, upstream id 'up-1')"
    when: "DELETE /mcp/gitlab с Mcp-Session-Id S; затем POST /mcp/gitlab с тем же S"
    then: "upstream получил DELETE с Mcp-Session-Id 'up-1'; ответ клиенту — 200 или 204; последующий POST — 404 с JSON-RPC -32000; запись mcpsess в KV удалена"
  - id: AC-121
    text: "Кэш tools/list работает по TTL и инвалидируется при смене прав и перезагрузке каталога"
    given: "HUB_TOOLS_CACHE_TTL=300; HUB_ADMIN_TOKEN задан"
    when: "выполняется tools/list дважды подряд; затем часы +301 с и tools/list; затем меняются права и tools/list; затем POST /admin/catalog/reload и tools/list; затем tools/list с params.cursor='c1' дважды"
    then: "второй вызов не дошёл до upstream (ответ из кэша, с id из запроса); после сдвига часов, после смены прав и после перезагрузки каталога вызовы уходят на upstream; оба вызова с cursor уходят на upstream (не кэшируются)"
  - id: AC-122
    text: "Недоступные инструменты не показываются в tools/list"
    given: "каталог 'gitlab' с permission_model.header_groups и tool_filter {allow:['*'], deny:['admin_*']} и группой repo_write с tools ['create_*']; подключение с preset readonly, группы ['code_review']; upstream возвращает инструменты list_mrs, create_merge_request, admin_labels"
    when: "POST /mcp/gitlab с tools/list (ответ upstream в формате application/json, затем тот же сценарий с SSE-ответом upstream)"
    then: "в обоих случаях клиент получает только list_mrs: create_merge_request отсутствует (его allow-маска даёт только группа repo_write, не включённая при readonly), admin_labels отсутствует (deny); при отсутствии в каталоге tool_filter и tools у групп клиент получает все три инструмента"
  - id: AC-123
    text: "tools/call скрытого инструмента отклоняется JSON-RPC ошибкой -32001 без обращения к upstream"
    given: "тот же каталог и права, что в AC-122"
    when: "POST /mcp/gitlab с {jsonrpc:'2.0', id:7, method:'tools/call', params:{name:'create_merge_request', arguments:{}}}"
    then: "200; тело — {jsonrpc:'2.0', id:7, error:{code:-32001, message:<русский текст с именем инструмента>, data:{tool:'create_merge_request', hint_url:'https://hub.test/ui/servers/gitlab'}}}; upstream запроса не получил; вызов разрешённого list_mrs проходит на upstream"
  - id: AC-124
    text: "Batch-запрос со скрытым вызовом отклоняется целиком"
    given: "тот же каталог и права"
    when: "POST /mcp/gitlab с телом-массивом [{id:1, method:'tools/list'}, {id:2, method:'tools/call', params:{name:'admin_labels'}}]"
    then: "200 с одним JSON-RPC error {code:-32001} и id == 2; upstream запроса не получил"
  - id: AC-125
    text: "Rate-limit на пару пользователь/alias отвечает 429"
    given: "HUB_RATE_LIMIT_MCP=2; подключения к 'gitlab' и 'jira'"
    when: "выполняются три вызова /mcp/gitlab в пределах 60 с; затем вызов /mcp/jira; затем часы +61 с и вызов /mcp/gitlab"
    then: "третий вызов gitlab — 429 с Retry-After >= 1 и телом JSON-RPC error code -32003, upstream не вызывался; вызов jira проходит (лимит раздельный); после сдвига часов вызовы снова проходят"
  - id: AC-126
    text: "Число одновременных SSE-потоков на пользователя ограничено"
    given: "HUB_MAX_SSE_PER_USER=2; мок upstream держит SSE-поток открытым"
    when: "пользователь открывает три параллельных SSE-запроса к /mcp/gitlab; затем один поток завершается и открывается новый"
    then: "третий запрос — 429 с JSON-RPC error -32003 и data.reason == 'too_many_streams'; после завершения потока новый запрос принимается (счётчик уменьшился, в том числе при разрыве соединения)"
  - id: AC-127
    text: "Слишком большое тело запроса отклоняется до обращения к upstream"
    given: "HUB_MAX_BODY_BYTES=1024"
    when: "POST /mcp/gitlab с телом 2048 байт (с заголовком Content-Length и, отдельно, чанкованно без него)"
    then: "оба — 413 {error:'payload_too_large', message}; upstream не вызывался"
  - id: AC-128
    text: "Circuit-breaker размыкает цепь после серии ошибок upstream и восстанавливается"
    given: "HUB_CB_FAILURES=3, HUB_CB_RESET=30; мок upstream отвечает 500"
    when: "выполняются четыре вызова подряд; затем часы +31 с и upstream снова отвечает 200, выполняется вызов; затем ещё вызов"
    then: "первые три вызова дошли до upstream и вернули 502 с JSON-RPC -32004; четвёртый — 503 с JSON-RPC -32004 (upstream_unavailable) и Retry-After, без обращения к upstream; после сдвига часов пробный вызов уходит на upstream и возвращает 200, счётчик ошибок сброшен, следующий вызов проходит нормально"
  - id: AC-129
    text: "Обращение к неподключённому серверу даёт понятную JSON-RPC ошибку -32002"
    given: "у пользователя нет подключения к 'gitlab', но есть валидный access-токен Hub с aud gitlab (подключение было удалено напрямую в БД)"
    when: "POST /mcp/gitlab с tools/list; затем GET /mcp/gitlab"
    then: "для POST — 200 с JSON-RPC error {code:-32002, message на русском, data:{reason:'not_connected', hint_url:'https://hub.test/ui/servers/gitlab'}}; для GET — тот же смысл в виде JSON {error, message, hint_url}; upstream не вызывался"
  - id: AC-130
    text: "Отозванный или истёкший токен на proxy отвечает 401 с указанием метаданных ресурса"
    given: "действующий токен A, затем отозванный через /oauth/revoke"
    when: "POST /mcp/gitlab с A после отзыва; затем с токеном, у которого exp в прошлом"
    then: "оба — 401 {error:'unauthorized'}; заголовок WWW-Authenticate содержит Bearer, resource_metadata с адресом PRM и error=\"invalid_token\"; upstream не вызывался"

  # --- Веб-интерфейс (R-W1..R-W6) ---
  - id: AC-131
    text: "Вход через OIDC создаёт веб-сессию и возвращает на next"
    given: "HUB_WEB_AUTH='keycloak' с моком OIDC (метаданные, authorize, token, JWKS); id_token с preferred_username 'u1' и email 'u1@corp'"
    when: "GET /auth/login?next=/ui/connections; затем возврат на /auth/callback с кодом и state; затем GET /auth/callback с чужим state; затем GET /auth/login?next=https://evil.test/"
    then: "первый — 302 на authorize мока с client_id, redirect_uri 'https://hub.test/auth/callback', response_type=code, scope из KEYCLOAK_SCOPES, непустыми state, nonce и code_challenge; после callback — Set-Cookie hub_session с HttpOnly и SameSite=Lax (Secure при https) и редирект на /ui/connections; в users есть строка u1 с email; чужой state — 400 без создания сессии; внешний next заменён на /ui/connections"
  - id: AC-132
    text: "Некорректный id_token не создаёт сессию"
    given: "мок OIDC, режим keycloak"
    when: "callback обрабатывается с id_token: (а) подписанным чужим ключом; (б) с nonce, не равным сохранённому; (в) с iss другого издателя; (г) с истёкшим exp"
    then: "во всех четырёх случаях — 400 с русским текстом ошибки, cookie hub_session не устанавливается, строка в sessions не создаётся"
  - id: AC-133
    text: "Режим HUB_WEB_AUTH=litellm проводит вход через CLI-SSO и создаёт ту же веб-сессию"
    given: "HUB_WEB_AUTH='litellm'; моки LiteLLM из I-1 (start → pending → ready с user_id 'u1')"
    when: "GET /auth/login?next=/ui/connections; страница выполняет опрос до ready"
    then: "страница входа — 200 HTML на русском с ссылкой browser_url и кодом user_code; после ready установлена cookie hub_session для пользователя u1, создана строка в sessions с auth_method 'litellm', выполнен редирект на /ui/connections; ключ LiteLLM сохранён в api_keys (правило R-L5 не нарушено); в audit_log есть web_login"
  - id: AC-134
    text: "Экран прав показывает группы каталога и сохраняет выбор"
    given: "каталог 'gitlab' с always ['core'] и группами code_review/devops/users (readonly), repo_write (readwrite), admin (none); открыт authorize со scope 'gitlab:readonly'"
    when: "запрашивается страница экрана прав; затем POST /oauth/consent с preset='readonly', groups=['code_review'], action='allow' и валидным CSRF-токеном"
    then: "HTML на русском содержит title сервера, имя клиента, названия групп из каталога, пресет 'Только чтение' выбран по умолчанию, группа admin (preset none) отсутствует, группа core показана как всегда включённая; после согласия в connections сохранены preset 'readonly' и groups ['code_review'], выдан код и выполнен редирект на redirect_uri"
  - id: AC-135
    text: "Страница «Мои подключения» показывает статусы только текущего пользователя"
    given: "у u1 подключения gitlab (connected) и jira (needs_reauth); у u2 — confluence (connected); веб-сессия u1"
    when: "GET /ui/connections; затем тот же запрос без cookie"
    then: "200 HTML на русском: gitlab со статусом «Подключён», jira — «Нужна повторная авторизация» и кнопкой «Переподключить», кнопки «Отключить»; confluence пользователя u2 в выдаче отсутствует; без cookie — 302 на /auth/login"
  - id: AC-136
    text: "Карточка сервера доступна по hint_url и скрывает внутренние данные"
    given: "веб-сессия; каталог: facade 'gitlab', beta-facade 'u' (unconfigured), сервер 'b' с audience ['devs']"
    when: "GET /ui/servers/gitlab; GET /ui/servers/u; GET /ui/servers/b; GET /ui/servers/nope"
    then: "первый — 200 HTML с title, description, owner, статусом, адресом 'https://hub.test/mcp/gitlab' и списком групп прав; в HTML нет upstream_url, client_secret, credential_headers и значений токенов; остальные три — 404 (HTML)"
  - id: AC-137
    text: "Небезопасные методы при cookie-аутентификации требуют CSRF-токен"
    given: "веб-сессия u1 с CSRF-токеном T"
    when: "POST /oauth/consent без CSRF-токена; PUT /api/me/connections/gitlab/permissions с cookie и без X-CSRF-Token; тот же PUT с корректным T; тот же PUT с Bearer-ключом LiteLLM и без CSRF; POST /auth/logout с T"
    then: "запросы без CSRF при cookie-аутентификации — 403 {error:'forbidden'}; с корректным T — успешный ответ; с Bearer-ключом LiteLLM CSRF не требуется — успешный ответ; после logout cookie очищена и строка sessions удалена; все HTML-ответы имеют Content-Type text/html; charset=utf-8 и Cache-Control 'private, no-store'"

  # --- Модель данных и миграции (R-M1..R-M5) ---
  - id: AC-138
    text: "Миграции Alembic применяются при старте и доступны через CLI"
    given: "HUB_DATABASE_URL указывает на пустую SQLite; HUB_DB_AUTO_MIGRATE не задан (дефолт true)"
    when: "create_app() и инициализация приложения (lifespan); затем запускается mcp-hub db current; затем приложение запускается повторно на той же БД"
    then: "в БД есть таблица alembic_version с ревизией head и все таблицы I-1 и I-3; mcp-hub db current печатает текущую ревизию с кодом выхода 0; повторный запуск не меняет схему и не падает; при HUB_DB_AUTO_MIGRATE=false схема не создаётся автоматически"
  - id: AC-139
    text: "Новые таблицы созданы с требуемыми полями и ограничениями"
    given: "БД после применения миграций"
    when: "читается схема БД"
    then: "существуют таблицы oauth_clients (client_id уникален), oauth_codes (code_sha256 уникален, есть code_challenge, redirect_uri, expires_at, used_at), refresh_tokens (token_sha256 уникален, есть chain_id, parent_id, status, access_jti, access_exp, expires_at), upstream_tokens (connection_id уникален, есть access_token_enc, refresh_token_enc, expires_at, scopes), sessions (session_sha256 уникален, есть csrf_sha256, user_id, expires_at, auth_method), consents (уникальность по user_id, client_id, alias) с полями из spec.md §15"
  - id: AC-140
    text: "Таблица connections расширена без нарушения правил I-1"
    given: "БД после применения миграций"
    when: "читается схема таблицы connections и выполняются проверки AC-65"
    then: "в connections есть новые поля needs_reauth_reason, last_refresh_at, revision (не NULL, по умолчанию 0), provider_account; сохранены поля и уникальность (user_id, alias) из spec.md §6; таблицы users, api_keys, audit_log не изменились"
  - id: AC-141
    text: "KeyValueStore поддерживает атомарные примитивы и ключи ревизии 2 с их TTL"
    given: "in-memory KeyValueStore с подменяемыми часами"
    when: "дважды вызывается set_if_absent('refreshlock:1', v, ttl=30); затем часы +31 с и вызов повторяется; incr('sse:u1',1)/decr('sse:u1',1); после сквозного сценария читаются ключи KV"
    then: "первый set_if_absent → True, второй → False, после истечения TTL → снова True; incr/decr возвращают корректные значения; в KV присутствуют ключи вида oauthtx:*, jtiden:*, conn:u1:gitlab, mcpsess:gitlab:* (alias входит в ключ), toolscache:gitlab:*, cb:gitlab с TTL из таблицы spec.md §15 (значение jtiden:* исчезает после истечения exp токена)"
  - id: AC-142
    text: "БД, созданная кодом I-1, доводится до актуальной схемы без потери данных"
    given: "SQLite, созданная через create_all кода I-1, с записями в users, api_keys, connections, audit_log и без таблицы alembic_version"
    when: "запускается приложение ревизии 2 (или mcp-hub db upgrade)"
    then: "старт проходит успешно; появляется alembic_version с ревизией head и новые таблицы; все прежние строки users, api_keys, connections, audit_log сохранены; GET /api/me с прежним ключом отвечает 200"

  # --- Наблюдаемость, эксплуатация, тесты (R-N1..R-N4) ---
  - id: AC-143
    text: "Метрики ревизии 2 присутствуют и размечены по alias"
    given: "выполнены: успешный вызов /mcp/gitlab, вызов с ошибкой upstream, выдача токена по коду и по refresh, успешное и неуспешное обновление upstream-токена"
    when: "GET /metrics"
    then: "тело содержит hub_mcp_requests_total с меткой alias='gitlab', hub_mcp_request_duration_seconds_bucket с alias='gitlab', hub_upstream_sessions_active с alias='gitlab', hub_upstream_errors_total с kind, hub_oauth_tokens_issued_total с grant='authorization_code' и grant='refresh_token', hub_token_refresh_total с result='ok' и result='failed'; в метках нет user_id и значений токенов"
  - id: AC-144
    text: "Аудит фиксирует операции ревизии 2 без секретов"
    given: "выполнен сквозной сценарий (регистрация клиента, согласие, выдача и обновление токенов, смена прав, отзыв, отключение, вход в веб)"
    when: "читаются все строки audit_log"
    then: "присутствуют действия oauth_client_registered, oauth_code_issued, oauth_token_issued, oauth_token_revoked, connection_connected, connection_permissions_changed, connection_disconnected, web_login; сериализованные details ни одной строки не содержат значений access/refresh-токенов Hub и системы, кода авторизации, code_verifier, client_secret, идентификатора веб-сессии"
  - id: AC-145
    text: "deploy/.env.example содержит все новые переменные"
    given: "файл deploy/.env.example"
    when: "файл читается и сравнивается с таблицей настроек spec.md §10 (R-T1)"
    then: "для каждой переменной таблицы (HUB_WEB_AUTH, HUB_CONSENT, HUB_OAUTH_ALLOWED_REDIRECTS, HUB_ACCESS_TOKEN_TTL, HUB_REFRESH_TOKEN_TTL, HUB_AUTH_CODE_TTL, HUB_OAUTH_TX_TTL, HUB_WEB_SESSION_TTL, HUB_RATE_LIMIT_REGISTER, HUB_RATE_LIMIT_TOKEN, HUB_RATE_LIMIT_MCP, HUB_TRUST_PROXY, HUB_MAX_SSE_PER_USER, HUB_MAX_BODY_BYTES, HUB_UPSTREAM_TIMEOUT, HUB_UPSTREAM_SSE_IDLE_TIMEOUT, HUB_UPSTREAM_IDLE_TTL, HUB_CLIENT_SESSION_TTL, HUB_TOOLS_CACHE_TTL, HUB_TOKEN_REFRESH_LEAD, HUB_TOKEN_REFRESH_INTERVAL, HUB_TOKEN_REFRESH_ENABLED, HUB_CB_FAILURES, HUB_CB_RESET, HUB_CB_PROBE_GRACE, HUB_CONNECTION_CACHE_TTL, HUB_DB_AUTO_MIGRATE, KEYCLOAK_ISSUER, KEYCLOAK_CLIENT_ID, KEYCLOAK_CLIENT_SECRET, KEYCLOAK_SCOPES, KEYCLOAK_JWKS_TTL) в файле есть строка с этим именем; значения секретов пусты или равны change-me"
  - id: AC-146
    text: "Тесты не обращаются к сети, нагрузочный smoke вынесен в отдельный маркер"
    given: "полный прогон тестов ревизии 2"
    when: "выполняется обычный прогон (без дополнительных маркеров) с запретом реальных исходящих соединений"
    then: "все тесты проходят без единого реального сетевого обращения (все внешние адреса перехвачены respx/моками); тест на 100 параллельных SSE-потоков помечен маркером load, зарегистрированным в конфигурации pytest, и в обычном прогоне не выполняется"

  # --- Сквозной сценарий и восстановление (P-18) ---
  - id: AC-147
    text: "Сквозной сценарий стандартного MCP-клиента проходит целиком"
    given: "чистая БД; моки: OIDC (или LiteLLM), AS целевой системы, upstream MCP; каталог с facade 'gitlab'"
    when: "клиент выполняет: GET /mcp/gitlab без токена → чтение PRM и метаданных AS → POST /oauth/register → GET /oauth/authorize → вход в веб → OAuth целевой системы → экран прав → получение кода → POST /oauth/token → initialize → tools/list → tools/call → refresh grant → POST /oauth/revoke"
    then: "каждый шаг возвращает ожидаемый результат: 401 с resource_metadata, 200 метаданные, 201 client_id, 302 с code, 200 с парой токенов, успешные JSON-RPC ответы через proxy (upstream получил персональные заголовки), новая пара по refresh, 200 на revoke; после revoke вызов /mcp/gitlab отвечает 401"
  - id: AC-148
    text: "Клиент не может использовать redirect_uri чужого клиента"
    given: "зарегистрированы клиент A (redirect 'http://127.0.0.1:19876/cb') и клиент B (redirect 'http://127.0.0.1:20000/other-cb'); веб-сессия пользователя (redirect клиента B отличается от A путём: расхождение только по порту loopback разрешено R-O4.1 и проверяется в AC-83)"
    when: "GET /oauth/authorize с client_id клиента A и redirect_uri клиента B; затем — с client_id A и redirect_uri 'http://127.0.0.1:19876/cb/../evil'; затем — с client_id A и redirect_uri 'https://evil.test/cb'"
    then: "все три — 400 HTML без Location и без выдачи кода; в oauth_codes новых строк не появилось"
  - id: AC-149
    text: "Повторная авторизация восстанавливает подключение без новой регистрации клиента"
    given: "подключение в статусе needs_reauth; у клиента есть прежние access A и refresh R; клиент зарегистрирован ранее"
    when: "пользователь проходит /oauth/authorize тем же client_id (или нажимает «Переподключить»), заново авторизуется в целевой системе; затем выполняется POST /mcp/gitlab с прежним access A"
    then: "нового POST /oauth/register не потребовалось; connections.status снова 'connected' с прежним id подключения; вызов с прежним токеном A возвращает 200 (cid совпадает); refresh R по-прежнему обменивается на новую пару"
  # --- Ревизия 2.1: уточнения правил R-P8, R-P10, R-T5, R-W1, R-O8, R-N5 ---
  - id: AC-150
    text: "Пересекающиеся маски включённой и выключенной групп разрешаются по имени инструмента, а не по строкам масок"
    given: "каталог 'gitlab' с permission_model.header_groups и tool_filter {allow:['*']}; группа issues с tools ['create_issue'] включена пользователю, группа repo_write с tools ['create_*'] не включена; upstream возвращает инструменты create_issue, create_merge_request, list_mrs"
    when: "POST /mcp/gitlab с tools/list; затем tools/call с name='create_issue'; затем tools/call с name='create_merge_request'"
    then: "tools/list содержит create_issue и list_mrs и не содержит create_merge_request (его приносит только не включённая группа); вызов create_issue уходит на upstream и возвращает его ответ (маска выключенной группы не отбирает инструмент, явно выданный включённой); вызов create_merge_request — 200 с JSON-RPC error {code:-32001, data:{tool:'create_merge_request', hint_url}} без обращения к upstream"
  - id: AC-151
    text: "Провал пробного запроса half-open немедленно открывает окно circuit-breaker заново"
    given: "HUB_CB_FAILURES=3, HUB_CB_RESET=30; мок upstream отвечает 500; выключатель открыт (выполнены три неуспешных вызова)"
    when: "часы +31 с, выполняется один вызов (пробный, upstream по-прежнему 500); сразу за ним ещё два вызова; затем часы +31 с, upstream отвечает 200 и выполняется вызов"
    then: "пробный вызов дошёл до upstream и вернул 502 с JSON-RPC -32004; следующие два — 503 с JSON-RPC -32004 (upstream_unavailable) и Retry-After, upstream их не получил (окно открылось снова сразу после провала пробы, повторного накопления HUB_CB_FAILURES ошибок не потребовалось); после нового истечения окна пробный вызов уходит на upstream, возвращает 200, выключатель закрыт и следующий вызов проходит нормально"
  - id: AC-152
    text: "Во время пробного запроса half-open на upstream уходит ровно один запрос, остальные получают upstream_unavailable"
    given: "HUB_CB_FAILURES=3, HUB_CB_RESET=30; выключатель открыт; мок upstream удерживает полученный запрос до сигнала теста"
    when: "часы +31 с; параллельно отправляются три запроса POST /mcp/gitlab; затем удерживаемый ответ отпускается со статусом 200"
    then: "upstream получил ровно один запрос (право на пробу берётся атомарно, ключ KV cb:gitlab:probe через set_if_absent, поэтому проба одна и при нескольких репликах/параллельных запросах); два других — 503 с JSON-RPC -32004 (upstream_unavailable) и Retry-After; после успешной пробы выключатель закрыт, счётчик ошибок обнулён и следующий вызов проходит на upstream"
  - id: AC-153
    text: "HUB_TRUST_PROXY определяет, берётся ли IP для rate-limit из X-Forwarded-For"
    given: "HUB_RATE_LIMIT_REGISTER=2; все запросы приходят с одного адреса соединения; заголовки X-Forwarded-For: '10.0.0.1, 10.0.0.9' и '10.0.0.2'"
    when: "при незаданном HUB_TRUST_PROXY выполняются три POST /oauth/register (первые два с разными X-Forwarded-For, третий — с любым); затем при HUB_TRUST_PROXY=true выполняются по два запроса с каждым значением X-Forwarded-For и ещё один с '10.0.0.1, 10.0.0.9'"
    then: "при незаданной переменной (дефолт false) третий запрос — 429 {error:'rate_limited'} с Retry-After: заголовок игнорируется и ключ лимита один на все запросы; при true все четыре запроса (по два на адрес) успешны — лимит считается по левому адресу X-Forwarded-For ('10.0.0.1' и '10.0.0.2' — разные ключи), а пятый запрос с '10.0.0.1' — 429; ни в одном режиме значение заголовка не влияет на аутентификацию и выбор alias"
  - id: AC-154
    text: "id_token с алгоритмом none или HS* отклоняется до обращения к JWKS"
    given: "мок OIDC, режим keycloak; корректные iss, aud, exp и nonce во всех токенах"
    when: "callback обрабатывается с id_token, подписанным alg='HS256' (HMAC по значению открытого ключа из JWKS), затем с alg='none' без подписи; оба сценария повторяются с моком JWKS, отвечающим ошибкой"
    then: "во всех случаях — 400 с русским текстом ошибки, cookie hub_session не устанавливается, строка в sessions не создаётся; результат одинаков при доступном и недоступном JWKS (решение принимается по alg до запроса ключей), причём при недоступном JWKS запрос к нему не выполняется; id_token с alg='RS256' и корректной подписью по-прежнему создаёт сессию (AC-131 не изменился)"
  - id: AC-155
    text: "redirect_uri обязателен при обмене кода, если код был выдан с ним"
    given: "клиенту A выдан код c с redirect_uri 'http://127.0.0.1:19876/cb'; известен code_verifier"
    when: "POST /oauth/token с grant_type='authorization_code', code, code_verifier и client_id, но без параметра redirect_uri; затем тот же запрос с корректным redirect_uri"
    then: "первый — 400 {error:'invalid_grant', error_description на русском}, токены не выданы; второй — 200 с парой токенов (код после отклонения из-за отсутствия redirect_uri остаётся неиспользованным, как и в AC-92)"
  - id: AC-156
    text: "Старт без HUB_REDIS_URL предупреждает о неразделяемом состоянии; миграции берут advisory-блокировку на PostgreSQL"
    given: "перехват логов приложения; окружение из четырёх обязательных переменных I-1"
    when: "create_app() без HUB_REDIS_URL; затем create_app() с заданным HUB_REDIS_URL; отдельно — применение миграций при HUB_DB_AUTO_MIGRATE=true на подключении PostgreSQL (перехват выполняемых SQL) и на SQLite"
    then: "в первом случае в логах есть запись уровня WARNING, содержащая 'HUB_REDIS_URL' и пояснение, что реплики не делят состояние (denylist, MCP-сессии, окна rate-limit, circuit-breaker); приложение при этом создаётся и обслуживает запросы; во втором случае такой записи нет; на PostgreSQL до применения ревизий выполняется pg_advisory_xact_lock, на SQLite блокировка не запрашивается и миграции проходят как прежде (AC-138/AC-142 не изменились)"
  # --- Ревизия 2.2: бэклог Hub H5-1…H5-4 (перенос HAC-01…HAC-12) ---
  - id: AC-157
    text: "Пока пробный запрос half-open не завершён, право на пробу второй раз не выдаётся (HAC-01, R-P10)"
    given: "выключатель alias открыт, HUB_CB_RESET=30, HUB_UPSTREAM_SSE_IDLE_TIMEOUT=300; окно истекло и первый запрос захватил право на пробу, ответ upstream ещё не получен"
    when: "часы сдвинуты на 60 секунд вперёд и приходит новый запрос"
    then: "право на пробу второй раз не выдаётся: запрос получает 503 с JSON-RPC -32004 upstream_unavailable и заголовком Retry-After, upstream не вызывается"
  - id: AC-158
    text: "TTL права на пробу равен max(HUB_CB_RESET, HUB_UPSTREAM_TIMEOUT, HUB_UPSTREAM_SSE_IDLE_TIMEOUT) + HUB_CB_PROBE_GRACE (HAC-02, R-P10)"
    given: "HUB_CB_RESET=30, HUB_UPSTREAM_TIMEOUT=30, HUB_UPSTREAM_SSE_IDLE_TIMEOUT=300, HUB_CB_PROBE_GRACE=5"
    when: "право на пробу захвачено"
    then: "TTL ключа cb:<alias>:probe равен 305 секундам, значение until равно now+305; Retry-After отказов в half-open вычисляется от этого until и не меньше 1 секунды"
  - id: AC-159
    text: "Успешная проба снимает право немедленно и закрывает выключатель (HAC-03, R-P10)"
    given: "выключатель в half-open, проба выполняется"
    when: "проба завершилась успешно"
    then: "ключ cb:<alias>:probe удалён немедленно (не по TTL), состояние cb:<alias> равно {failures: 0, open_until: 0.0}, следующий запрос идёт на upstream без задержки"
  - id: AC-160
    text: "Невалидный левый элемент X-Forwarded-For отбрасывается, ключ лимита берётся от адреса соединения (HAC-04, R-T5)"
    given: "HUB_TRUST_PROXY=true, соединение с адресом 10.0.0.7"
    when: "приходит запрос на /oauth/register с заголовком X-Forwarded-For 'not-an-ip, 10.1.1.1'"
    then: "ключ rate-limit равен rl:register:10.0.0.7 — значение заголовка отброшено"
  - id: AC-161
    text: "Слишком длинный X-Forwarded-For отбрасывается без попытки разбора (HAC-05, R-T5)"
    given: "HUB_TRUST_PROXY=true, соединение с адресом 10.0.0.7"
    when: "приходит запрос с X-Forwarded-For длиной 4096 символов"
    then: "значение отброшено без попытки разбора, ключ равен rl:register:10.0.0.7; в KV не появляется ключей длиннее ожидаемого"
  - id: AC-162
    text: "Валидные IPv4/IPv6 (в т.ч. с портом и в скобках) дают нормализованный IP в ключе лимита (HAC-06, R-T5)"
    given: "HUB_TRUST_PROXY=true"
    when: "приходят запросы с X-Forwarded-For '203.0.113.5', '[2001:db8::1]:443' и '2001:db8::1'"
    then: "во всех трёх случаях ключ содержит нормализованный IP-адрес клиента, а не адрес соединения"
  - id: AC-163
    text: "Отклонённое значение X-Forwarded-For не попадает в журнал и audit_log (HAC-07, R-T5, R-T4)"
    given: "HUB_TRUST_PROXY=true и заведомо мусорный X-Forwarded-For"
    when: "запрос обработан и прочитаны записи журнала"
    then: "есть запись уровня WARNING о непринятом заголовке, само значение в журнал не попало (в тексте записи его нет), в audit_log значения тоже нет"
  - id: AC-164
    text: "При HUB_TRUST_PROXY=false заголовок игнорируется полностью (HAC-08, R-T5)"
    given: "HUB_TRUST_PROXY=false (по умолчанию), соединение с адресом 10.0.0.7"
    when: "приходит запрос с X-Forwarded-For '203.0.113.5'"
    then: "ключ равен rl:register:10.0.0.7 — поведение по умолчанию не изменилось"
  - id: AC-165
    text: "В закрытом состоянии успешный запрос не делает удалений в KV (HAC-09, R-P10)"
    given: "выключатель закрыт, счётчик операций фейкового KV обнулён"
    when: "успешно проксирован один запрос"
    then: "в KV выполнена ровно одна операция записи состояния cb:<alias> и ноль операций удаления; ответ клиенту не изменился"
  - id: AC-166
    text: "После успешной пробы обычные запросы не обращаются к KV за удалением права (HAC-10, R-P10)"
    given: "HUB_CB_FAILURES подряд идущих ошибок перевели выключатель в открытое состояние"
    when: "после истечения окна проба завершилась успешно и затем прошли ещё два обычных запроса"
    then: "выключатель закрыт, ключ пробы отсутствует, на два последующих запроса пришлось ноль операций удаления в KV"
  - id: AC-167
    text: "Провал пробы оставляет состояние {failures: HUB_CB_FAILURES, open_until: now + HUB_CB_RESET} (HAC-11, R-P10)"
    given: "выключатель в half-open, право на пробу захвачено"
    when: "пробный запрос завершился ошибкой 502"
    then: "состояние cb:<alias> равно {failures: HUB_CB_FAILURES, open_until: now + HUB_CB_RESET}, ключ пробы удалён, следующий запрос получает 503 с -32004"
  - id: AC-168
    text: "Наблюдаемое поведение R-P10 не изменилось: прежние критерии circuit-breaker проходят без правок ожиданий (HAC-12, R-P10)"
    given: "набор тестов Hub на circuit-breaker (в т.ч. проверяющий AC-151 и AC-152)"
    when: "применено изменение записи состояния в ветке повторного открытия окна и прогнаны тесты"
    then: "все тесты проходят без правок ожиданий — наблюдаемое поведение R-P10 не изменилось; мутация «failures = 0 в ветке повторного открытия» валит тест AC-151"

  # --- Ревизия 3 (I-4): подключение коннектора пользовательским токеном (R-U1..R-U10) ---
  - id: AC-169
    text: "Каталог принимает список способов подключения auth_methods, а сервер с прежним полем auth остаётся валидным и ведёт себя как один способ (R-U1)"
    given: "два каталога: первый — facade-сервер с auth_methods из способов corp_oauth (type oauth2, available false) и session_token (type user_token); второй — копия catalog.yaml репозитория с полем auth"
    when: "для каждого вызывается create_app() и GET /api/catalog (Bearer)"
    then: "оба каталога загружаются без ошибок; у первого сервера в публичном представлении есть auth_methods с двумя элементами и auth_kind == 'user_token' (тип первого доступного способа); у серверов второго каталога ключа auth_methods нет и auth_kind == 'oauth2'"
  - id: AC-170
    text: "Некорректный auth_methods отклоняется при загрузке каталога с путём к полю (R-U1)"
    given: "варианты каталога: (а) сервер с обоими полями auth и auth_methods; (б) auth_methods: []; (в) два способа с одинаковым id 'session_token'; (г) способ с type: 'pat'; (д) способ с лишним полем"
    when: "для каждого варианта вызывается create_app()"
    then: "во всех случаях старт завершается ошибкой; сообщение содержит путь вида servers[0].auth_methods (для (в) — также сам id 'session_token', для (г) и (д) — путь вида servers[0].auth_methods[0].<поле>)"
  - id: AC-171
    text: "Способ user_token требует mode: facade, field и verify (R-U1)"
    given: "варианты каталога: (а) native-сервер со способом type: user_token; (б) facade-сервер со способом user_token без field; (в) то же без verify; (г) verify без headers"
    when: "для каждого варианта вызывается create_app()"
    then: "во всех случаях ошибка старта; сообщения содержат соответственно servers[0].auth_methods[0].type (недопустим при mode native), servers[0].auth_methods[0].field, servers[0].auth_methods[0].verify, servers[0].auth_methods[0].verify.headers"
  - id: AC-172
    text: "Сохранённый пользовательский токен подставляется в credential_headers при проксировании, клиентский Authorization удаляется (R-U2, R-P2)"
    given: "facade-сервер со способом user_token и credential_headers {Authorization: 'Bearer {{access_token}}'}; пользователь подключился токеном 'usr-tok-1'; мок upstream записывает полученные заголовки"
    when: "клиент вызывает POST /mcp/{alias} с собственным заголовком Authorization: Bearer <access-токен Hub>"
    then: "upstream получил Authorization: 'Bearer usr-tok-1'; access-токена Hub в заголовках запроса к upstream нет"
  - id: AC-173
    text: "Успешная проверка токена у целевой системы создаёт подключение и сохраняет account (R-U3, R-U4)"
    given: "способ user_token с verify {url, method GET, headers {Authorization: 'Bearer {{access_token}}'}, account_field: username}; мок целевой системы отвечает 200 и телом с полем username 'm.ivanov'"
    when: "POST /api/me/connections/{alias}/token с телом {token: 'usr-tok-1'}"
    then: "мок получил проверочный GET с заголовком Authorization: 'Bearer usr-tok-1'; ответ 200 со status 'connected', auth_method — id способа, account == 'm.ivanov'; в БД connections.status == 'connected' и есть строка upstream_tokens"
  - id: AC-174
    text: "Токен, отклонённый целевой системой, не сохраняется (R-U3, R-U4)"
    given: "мок целевой системы отвечает на проверочный запрос 401 (и в отдельном прогоне 403)"
    when: "POST /api/me/connections/{alias}/token с телом {token: 'bad-token'}"
    then: "в обоих случаях 400 {error: 'token_rejected'}; в БД нет строки upstream_tokens для этого подключения, status подключения не стал 'connected'"
  - id: AC-175
    text: "Недоступность целевой системы на проверке не разрушает прежнее подключение (R-U3, R-U4)"
    given: "пользователь уже подключён токеном 'usr-tok-1'; мок целевой системы отвечает на проверку 500 (и в отдельных прогонах — сетевой ошибкой и таймаутом)"
    when: "POST /api/me/connections/{alias}/token с телом {token: 'usr-tok-2'}"
    then: "во всех случаях 502 {error: 'upstream_unavailable'}; подключение осталось 'connected', а следующий вызов /mcp/{alias} уходит на upstream по-прежнему с 'usr-tok-1'"
  - id: AC-176
    text: "Успешный ответ эндпоинта подключения токеном содержит договорённые поля и не содержит токена (R-U4)"
    given: "способ user_token, мок целевой системы отвечает 200"
    when: "POST /api/me/connections/{alias}/token с телом {token: 'usr-tok-1', preset: 'readonly'}"
    then: "200; тело — объект с ключами alias, status, auth_method, preset, groups, account, updated_at; значения 'usr-tok-1' в теле ответа нет ни в одном поле; аудит содержит запись connection_connected с details.auth_method"
  - id: AC-177
    text: "Невалидное тело запроса отклоняется без обращения к целевой системе (R-U4)"
    given: "способ user_token с field.max_length 4096; счётчик запросов мока целевой системы обнулён"
    when: "выполняются POST /api/me/connections/{alias}/token с телами: не JSON; JSON-массив; {} без token; {token: ''}; {token: <4097 символа>}; {token: 'ok', preset: 'admin'}; {token: 'ok', groups: 'core'}"
    then: "каждый ответ — 400 {error: 'invalid_request'} с русским message; мок целевой системы не получил ни одного запроса; подключение не создано"
  - id: AC-178
    text: "Подключение токеном доступно только для видимого пользователю facade-сервера и только аутентифицированному пользователю (R-U4)"
    given: "каталог с native-сервером 'nat', unconfigured-сервером 'unc', facade-сервером 'closed' с audience ['other'] и facade-сервером 'ok' со способом user_token"
    when: "POST /api/me/connections/{alias}/token для alias 'missing', 'nat', 'unc', 'closed' (с Bearer), а также для 'ok' без заголовка авторизации"
    then: "для четырёх первых — 404 {error: 'not_found'}; для запроса без авторизации — 401; ни в одном случае подключение не создано"
  - id: AC-179
    text: "Выбор способа подключения проверяется: обязательность, известность, тип и доступность (R-U4)"
    given: "сервер 'multi' с двумя способами user_token (id 'a' и 'b') и способом oauth2 'corp' с available: false; сервер 'single' ровно с одним способом user_token"
    when: "выполняются POST …/token: для 'multi' без method; для 'multi' с method 'nope'; для 'multi' с method 'corp'; для 'single' без method"
    then: "без method для 'multi' — 400 invalid_request с указанием, что нужно выбрать способ; method 'nope' — 400 invalid_request; method 'corp' — 409 {error: 'auth_method_unavailable'}; для 'single' без method — 200 (способ определён однозначно)"
  - id: AC-180
    text: "Повторное подключение заменяет прежний токен, не оставляя старого значения (R-U4)"
    given: "пользователь подключён токеном 'usr-tok-1'; мок целевой системы принимает оба токена"
    when: "POST /api/me/connections/{alias}/token с телом {token: 'usr-tok-2'}, затем выполняется MCP-вызов"
    then: "200; в БД ровно одна строка upstream_tokens для подключения, её расшифровка равна 'usr-tok-2'; connections.revision вырос; upstream получил Authorization с 'usr-tok-2'; строки со значением 'usr-tok-1' в БД и KV не осталось"
  - id: AC-181
    text: "Отключение стирает пользовательский токен и не обращается к revoke_url (R-U5)"
    given: "подключение способом user_token; у сервера в каталоге задан revoke_url, мок отзыва считает запросы"
    when: "DELETE /api/me/connections/{alias}, затем POST /mcp/{alias} с прежним access-токеном Hub и GET /remote-config"
    then: "200 {alias, status: 'not_connected'}; строки upstream_tokens нет, connections.auth_method пуст; мок revoke_url не получил ни одного запроса; MCP-вызов отвечает 401 либо JSON-RPC -32002 с reason 'not_connected'; /remote-config не содержит alias; аудит содержит connection_disconnected"
  - id: AC-182
    text: "401 от upstream переводит подключение user_token в needs_reauth без попытки обновления, а новый токен его восстанавливает (R-U6)"
    given: "подключение способом user_token; мок upstream отвечает 401 на MCP-запрос; счётчик запросов к token_url обнулён"
    when: "выполняется POST /mcp/{alias}, затем POST /api/me/connections/{alias}/token с новым токеном и повторный MCP-вызов тем же access-токеном Hub"
    then: "первый вызов — 200 с JSON-RPC -32002, data.reason == 'needs_reauth' и data.hint_url == '<HUB>/ui/servers/{alias}'; к token_url обращений не было и запрос к upstream не повторялся; connections.status == 'needs_reauth', есть аудит connection_needs_reauth; после подключения новым токеном status == 'connected' и повторный MCP-вызов проходит на upstream с новым токеном"
  - id: AC-183
    text: "Фоновое обновление токенов не выбирает подключения user_token (R-U6, R-B4)"
    given: "одно подключение user_token (без refresh-токена и без expires_at) и одно OAuth-подключение с истекающим токеном"
    when: "выполняется один цикл фонового обновления"
    then: "обновлено ровно одно подключение — OAuth; к token_url обращений по подключению user_token не было; его статус остался 'connected', а токен в БД не изменился"
  - id: AC-184
    text: "Расширение прав readonly → readwrite для user_token не требует повторной авторизации (R-U7)"
    given: "подключение user_token с preset 'readonly' у сервера с permission_model.kind tool_filter; параллельно — OAuth-подключение с preset 'readonly'"
    when: "PUT /api/me/connections/{alias}/permissions с телом {preset: 'readwrite'} для обоих подключений"
    then: "для user_token — 200 со status 'connected' (не 'needs_reauth'), следующий tools/list отдаёт инструменты пресета readwrite; для OAuth-подключения поведение прежнее — status 'needs_reauth' с пояснением (AC-111 не изменён)"
  - id: AC-185
    text: "Витрина отдаёт описание способов подключения без секретов и без адреса проверки (R-U8)"
    given: "сервер со способами corp_oauth (available false, unavailable_reason, client_id, client_secret) и session_token (field с label, hint, docs_url, secret; verify с url и headers)"
    when: "GET /api/catalog (Bearer)"
    then: "у сервера есть auth_methods из двух элементов с полями id, title, type, available, unavailable_reason; у session_token есть field {label, hint, docs_url, secret, min_length, max_length}, у corp_oauth поля field нет; во всём ответе нет ключей verify, authorize_url, token_url, revoke_url, scopes, client_id, client_secret и нет адреса проверки; у сервера без auth_methods ключ auth_methods отсутствует"
  - id: AC-186
    text: "Страница сервера показывает выбор способа только когда способов больше одного (R-U8)"
    given: "веб-сессия; сервер 'multi' со способами corp_oauth (available false, unavailable_reason) и session_token; сервер 'single' ровно с одним способом user_token"
    when: "GET /ui/servers/multi и GET /ui/servers/single"
    then: "на странице 'multi' есть выбор способа с обоими title, элемент corp_oauth неактивен (disabled) и рядом выведен текст unavailable_reason; на странице 'single' переключателя способов нет, сразу показана форма подключения"
  - id: AC-187
    text: "Форма ввода токена и состояния подключения отображаются по каталогу и не раскрывают токен (R-U8)"
    given: "веб-сессия; способ user_token с field {label, hint, docs_url, secret: true}"
    when: "GET /ui/servers/{alias} для состояний not_connected, connected (account 'm.ivanov') и needs_reauth"
    then: "во всех состояниях поле ввода имеет type='password' и пустое значение, на странице есть label, текст hint и ссылка docs_url; в состоянии connected показаны статус 'Подключён', название способа, account и кнопки замены токена и отключения; в состоянии needs_reauth показано, что токен больше не действует, и предложена форма ввода нового; значения токена в HTML нет ни в одном состоянии"
  - id: AC-188
    text: "Пользовательский токен не попадает в журнал и в аудит (R-U9)"
    given: "включён перехват логов всех уровней; токен 'usr-tok-SECRET-1'"
    when: "выполняется полный цикл: подключение токеном, MCP-вызов, смена прав, 401 от upstream, отключение; затем просматриваются все записи журнала и все строки audit_log"
    then: "ни одна запись журнала и ни одно поле audit_log.details не содержит 'usr-tok-SECRET-1' и ни одного его фрагмента длиной 8 и более символов; при этом в audit_log есть connection_connected с details.auth_method, connection_needs_reauth и connection_disconnected"
  - id: AC-189
    text: "Пользовательский токен не отдаётся наружу и хранится только зашифрованным (R-U9, R-B9)"
    given: "подключение токеном 'usr-tok-SECRET-2'; веб-сессия для страниц"
    when: "запрашиваются ответ POST …/token, GET /api/me/connections, GET /api/catalog, GET /remote-config, GET /metrics, GET /ui/connections, GET /ui/servers/{alias}"
    then: "ни один ответ не содержит 'usr-tok-SECRET-2'; в БД upstream_tokens.access_token_enc не равен открытому значению, а его расшифровка ключом HUB_ENCRYPTION_KEY равна ему; в KV-записи conn:<user_id>:<alias> хранится тот же шифртекст, открытого значения там нет"
  - id: AC-190
    text: "Токен одного пользователя недоступен другому (R-U9)"
    given: "пользователь A подключил токен 'tok-A', пользователь B — 'tok-B' к тому же alias"
    when: "B выполняет MCP-вызов, GET /api/me/connections, PUT …/permissions и DELETE /api/me/connections/{alias}"
    then: "upstream по запросу B получил Authorization с 'tok-B'; ответы B не содержат 'tok-A'; в /api/me/connections B видит только своё подключение; действия B не изменили подключение A — оно осталось 'connected' и его токен в БД прежний"
  - id: AC-191
    text: "Описанная в спеке запись каталога для коннектора tag загружается и публикуется корректно (R-U10)"
    given: "каталог с записью tag из R-U10 (mode facade, upstream_url задан, два способа, permission_model.kind tool_filter); HUB_PUBLIC_URL='https://hub.test'"
    when: "create_app() и GET /api/catalog (Bearer)"
    then: "старт успешен; у tag mode == 'facade', mcp_url == 'https://hub.test/mcp/tag', auth_kind == 'user_token', auth_methods содержит corp_oauth (available false с причиной) и session_token (type user_token с field); при незаданной переменной ${TAG_MCP_URL} сервер помечается unconfigured и в /api/catalog не показывается"
  - id: AC-192
    text: "Коннектор tag, подключённый токеном, работает через Hub с персональным срезом прав (R-U10)"
    given: "запись tag из R-U10; мок ТЭГ-MCP отдаёт на tools/list инструменты whoami, search_posts, get_thread, create_post, update_post; пользователь подключился токеном 'tag-tok-1' с пресетом readonly"
    when: "выполняются POST /mcp/tag с tools/list и затем tools/call для create_post"
    then: "мок ТЭГ-MCP получил Authorization: 'Bearer tag-tok-1'; в отфильтрованном ответе tools/list есть whoami, search_posts, get_thread и нет create_post и update_post; вызов create_post отвечает 200 с JSON-RPC -32001 и data.hint_url, запрос на upstream при этом не отправлен"
  - id: AC-193
    text: "Корпоративный OAuth ТЭГ объявлен, но недоступен до выдачи приложения (R-U10)"
    given: "запись tag из R-U10 (способ corp_oauth с available: false и unavailable_reason)"
    when: "POST /api/me/connections/tag/token с телом {method: 'corp_oauth', token: 'x'} и, отдельно, попытка подключиться этим способом через флоу авторизации"
    then: "409 {error: 'auth_method_unavailable'} с текстом причины из каталога; подключение не создано, запись upstream_tokens не появилась; сам способ при этом виден в /api/catalog и на странице сервера"
  - id: AC-194
    text: "Незаданная переменная внутри недоступного способа не скрывает сервер из каталога (R-U1, уточнение R-C2)"
    given: "beta-сервер со способами corp_oauth (available: false, client_id '${TAG_OAUTH_CLIENT_ID}') и session_token (type user_token); переменная TAG_OAUTH_CLIENT_ID не задана, upstream_url задан"
    when: "create_app() и GET /api/catalog (Bearer)"
    then: "сервер не помечен unconfigured и виден в /api/catalog, подключение способом session_token работает; при этом незаданная переменная в любом другом поле того же beta-сервера (например в upstream_url) по-прежнему делает его unconfigured и скрывает из каталога"
