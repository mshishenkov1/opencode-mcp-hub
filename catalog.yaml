# Каталог корпоративных MCP-серверов (источник истины для Hub).
# Меняется через merge request; CI валидирует схему и доступность upstream.
# Секреты (client_secret и т.п.) — НЕ здесь: ссылки вида env:VAR.
version: 1

defaults:
  permission_presets:
    readonly: { label: "Только чтение", default: true }
    readwrite: { label: "Чтение и запись" }

servers:
  - alias: tag
    type: "MCP"
    title: "Tag"
    summary: "Каналы, треды, поиск и опросы корпоративного мессенджера"
    icon_color: "#1F4C86"
    description: "Tag — корпоративный мессенджер Магнита. Подключив его, вы даёте доступ ровно к тому, что видите сами: свои каналы и команды, переписку и треды, поиск по сообщениям и файлам, карточки коллег, вложения и результаты опросов.\n\nЧто это даёт: Спросить, чем закончилось обсуждение в канале, пока вас не было. Найти сообщение, которое вы точно писали, но не помните где. Собрать тред в короткий пересказ перед встречей. Отправить сообщение, поставить реакцию, создать опрос, кастомные автоматизации."
    owner: "Платформа"
    contact: "https://tag.magnit.ru"
    docs_url: "https://github.com/mshishenkov1/magnit-tag-mcp"
    docs_label: "внутренний портал"
    status: beta
    audience: ["all"]
    mode: facade
    upstream_url: "${TAG_MCP_URL}"        # ТЭГ-MCP, поднятый с MM_HTTP_AUTH=passthrough
    auth_methods:
      - id: corp_oauth
        title: "Корпоративная авторизация ТЭГ"
        type: oauth2
        available: false
        unavailable_reason: "OAuth-приложение ТЭГ ещё не выдано администраторами"
        authorize_url: "https://tag.magnit.ru/oauth/authorize"
        token_url: "https://tag.magnit.ru/oauth/access_token"
        client_id: "${TAG_OAUTH_CLIENT_ID}"
        client_secret: "env:TAG_OAUTH_CLIENT_SECRET"
        pkce: true
        scopes: { readonly: [], readwrite: [] }
      - id: session_token
        title: "Токен сессии ТЭГ"
        type: user_token
        field:
          label: "Токен сессии ТЭГ"
          hint: "ТЭГ → Профиль → Настройки безопасности → Личные токены доступа; либо значение cookie MMAUTHTOKEN"
          docs_url: "https://github.com/mshishenkov1/magnit-tag-mcp#токен"
          secret: true
        verify:
          # Адрес проверки — переменная: токен обязан проверяться на том же экземпляре
          # Mattermost, с которым работает поднятый ТЭГ-MCP (в бою tag.magnit.ru,
          # на стенде tag-test.corp.tander.ru). Отклонение от текста R-U10 намеренное.
          url: "${TAG_VERIFY_URL}"
          method: GET
          headers:
            Authorization: "Bearer {{access_token}}"
          account_field: username
        exchange:
          # Обмен присланного токена на постоянный личный токен Mattermost (R-U12…R-U19):
          # выпуск PAT от имени владельца присланного токена; без права system_user_access_token
          # целевая система ответит 403 → policy_denied, подключение останется на присланном.
          url: "${TAG_API_BASE}/users/me/tokens"
          method: POST
          headers:
            Authorization: "Bearer {{access_token}}"
          body:
            description: "{{token_description}}"
          expect_status: 200
          token_field: token
          token_id_field: id
          description: "OpenCode Hub"
          revoke:
            url: "${TAG_API_BASE}/users/tokens/revoke"
            method: POST
            headers:
              Authorization: "Bearer {{access_token}}"
            body:
              token_id: "{{token_id}}"
          list:
            url: "${TAG_API_BASE}/users/me/tokens"
            method: GET
            headers:
              Authorization: "Bearer {{access_token}}"
            id_field: id
            description_field: description
    credential_headers:
      Authorization: "Bearer {{access_token}}"
    permission_model:
      kind: tool_filter
      presets:
        readonly:
          tools: ["whoami", "server_*", "resolve_channel", "get_*", "list_*", "search_*",
                  "browse_public_channels", "summarize_*", "download_file"]
        readwrite:
          tools: ["*"]

  - alias: jira
    type: "MCP"
    title: "Jira"
    summary: "Задачи, проекты, спринты и заявки Service Desk"
    icon_color: "#1868DB"
    description: "Jira — корпоративская система управления задачами и проектами Магнита. Подключив его, вы даёте доступ к вашим проектам и спринтам: поиск и чтение задач, комментарии, переходы по статусам, фильтры и дашборды.\n\nЧто это даёт: Собрать свои задачи на спринт одним вопросом. Вытащить историю обсуждения задачи и комментарии коллег. Оформить описание задачи по шаблону команды. Создать задачу или перевести по статусу, кастомные автоматизации."
    owner: "AI Lab"
    contact: "https://copilot-portal.ailab-copilot-prod.corp.tander.ru"
    docs_url: "https://copilot-portal.ailab-copilot-prod.corp.tander.ru/docs/mcp/atlassian-mcp-oblachno"
    docs_label: "портал AI Lab"
    status: beta   # ga — после выдачи OAuth-приложения администраторами
    audience: ["all"]
    mode: facade
    upstream_url: "https://mcp-atlassian.ailab-copilot-prod.corp.tander.ru/mcp"
    auth_methods:
      - id: corp_oauth
        title: "Корпоративная авторизация Jira"
        available: false
        unavailable_reason: "OAuth-приложение Jira ещё не выдано администраторами"
        type: oauth2
        authorize_url: "https://jira.corp.tander.ru/rest/oauth2/latest/authorize"
        token_url: "https://jira.corp.tander.ru/rest/oauth2/latest/token"
        client_id: "${JIRA_OAUTH_CLIENT_ID}"
        client_secret: "env:JIRA_OAUTH_CLIENT_SECRET"
        pkce: true
        scopes:
          readonly: ["READ"]
          readwrite: ["WRITE"]
      - id: personal_token
        title: "Персональный токен Jira"
        type: user_token
        field:
          label: "Персональный токен Jira"
          hint: "Jira → Профиль → Personal Access Tokens → Create token"
          docs_url: "https://jira.corp.tander.ru/secure/ViewProfile.jspa"
          secret: true
        verify:
          url: "https://jira.corp.tander.ru/rest/api/2/myself"
          method: GET
          headers:
            Authorization: "Bearer {{access_token}}"
          account_field: name
    credential_headers:
      X-Atlassian-Jira-Personal-Token: "{{access_token}}"
      X-Atlassian-Jira-Url: "https://jira.corp.tander.ru"
    permission_model:
      kind: header_groups
      header: Enabled-Groups
      groups:
        - { id: jira_read, title: "Чтение задач и проектов", preset: readonly }
        - { id: jira_agile, title: "Доски и спринты", preset: readonly }
        - { id: jira_service_desk, title: "Service Desk", preset: readonly }
        - { id: jira_write, title: "Создание и изменение задач", preset: readwrite }

  - alias: confluence
    type: "MCP"
    title: "Confluence"
    summary: "Поиск, чтение, комментарии и вложения базы знаний"
    icon_color: "#1868DB"
    description: "Confluence — корпоративная база знаний Магнита. Подключив его, вы даёте доступ к вашим пространствам: поиск по страницам, чтение и вложения, комментарии и метки, к которым у вас есть доступ.\n\nЧто это даёт: найти регламент, на который все ссылаются, и получить из него ответ, а не ссылку. Собрать выжимку из длинной страницы или пространства. Добавить комментарий или создать страницу, кастомные автоматизации."
    owner: "AI Lab"
    contact: "https://copilot-portal.ailab-copilot-prod.corp.tander.ru"
    docs_url: "https://copilot-portal.ailab-copilot-prod.corp.tander.ru/docs/mcp/atlassian-mcp-oblachno"
    docs_label: "портал AI Lab"
    status: beta   # ga — после выдачи OAuth-приложения администраторами
    audience: ["all"]
    mode: facade
    upstream_url: "https://mcp-atlassian.ailab-copilot-prod.corp.tander.ru/mcp"
    auth_methods:
      - id: corp_oauth
        title: "Корпоративная авторизация Confluence"
        available: false
        unavailable_reason: "OAuth-приложение Confluence ещё не выдано администраторами"
        type: oauth2
        authorize_url: "https://it-portal.corp.tander.ru/rest/oauth2/latest/authorize"
        token_url: "https://it-portal.corp.tander.ru/rest/oauth2/latest/token"
        client_id: "${CONFLUENCE_OAUTH_CLIENT_ID}"
        client_secret: "env:CONFLUENCE_OAUTH_CLIENT_SECRET"
        pkce: true
        scopes:
          readonly: ["READ"]
          readwrite: ["WRITE"]
      - id: personal_token
        title: "Персональный токен Confluence"
        type: user_token
        field:
          label: "Персональный токен Confluence"
          hint: "Confluence → Профиль → Personal Access Tokens → Create token"
          docs_url: "https://it-portal.corp.tander.ru/plugins/personalaccesstokens/manage-tokens.action"
          secret: true
        verify:
          url: "https://it-portal.corp.tander.ru/rest/api/user/current"
          method: GET
          headers:
            Authorization: "Bearer {{access_token}}"
          account_field: username
          # Confluence на неверный токен отвечает 200 с анонимным телом, поэтому
          # по коду ответа отказ не отличить — требуем, чтобы система назвала
          # владельца токена (R-U3.1, BUG-I4-009).
          require_account: true
    credential_headers:
      X-Atlassian-Confluence-Personal-Token: "{{access_token}}"
      X-Atlassian-Confluence-Url: "https://it-portal.corp.tander.ru"
    permission_model:
      kind: header_groups
      header: Enabled-Groups
      groups:
        - { id: confluence_read, title: "Чтение страниц и поиск", preset: readonly }
        - { id: confluence_write, title: "Создание и редактирование страниц", preset: readwrite }

  - alias: outlook
    type: "MCP"
    title: "Outlook"
    summary: "Почта, календарь, контакты и переговорные корпоративного Exchange"
    icon_color: "#0078D4"
    description: "Outlook — корпоративная почта и календарь Магнита на Microsoft Exchange. Подключив его, вы даёте доступ к вашему ящику: входящие и папки, поиск писем, чтение и отправка, календарь и встречи, контакты, переговорные комнаты.\n\nЧто это даёт: Найти письмо по теме или отправителю и получить его текст. Собрать тред переписки в пересказ. Проверить календарь на сегодня и найти свободное окно для встречи. Отправить письмо или создать встречу, кастомные автоматизации."
    owner: "AI Lab"
    contact: "https://copilot-portal.ailab-copilot-prod.corp.tander.ru"
    docs_url: "https://github.com/viartemev/outlook-ews-mcp"
    docs_label: "GitHub"
    status: "beta"
    audience: ['all']
    mode: facade
    upstream_url: "${OUTLOOK_MCP_URL}"
    auth_methods:
      - id: corp_password
        title: "Корпоративная учётная запись"
        type: user_token
        field:
          label: "Пароль корпоративной учётной записи"
          hint: "Пароль от учётной записи CORP\\<ваш логин> — тот же, что для входа в Windows"
          secret: true
        verify:
          url: "http://127.0.0.1:8000/health"
          method: GET
          headers:
            X-Verify: "outlook"
          expect_status: 200
          require_account: false
    credential_headers:
      X-Exchange-Username: "CORP\\shishenkov_ma"
      X-Exchange-Password: "{{access_token}}"
      X-Exchange-Server: "https://mail.magnit.ru/EWS/Exchange.asmx"
      X-Exchange-Auth-Type: "NTLM"
      X-Exchange-Email: "shishenkov_ma@magnit.ru"
    permission_model:
      kind: tool_filter
      presets:
        readonly:
          tools:
            - ping_exchange
            - get_mailbox_info
            - list_delegates
            - list_inbox_rules
            - get_out_of_office
            - list_emails
            - get_email
            - get_email_mime
            - get_thread
            - search_emails
            - list_categories
            - list_folders
            - get_attachment
            - list_events
            - get_event
            - find_free_slots
            - get_my_availability
            - list_calendars
            - list_room_lists
            - list_rooms
            - search_contacts
            - get_contact
        readwrite:
          tools:
            - "*"
