# Каталог корпоративных MCP-серверов (источник истины для Hub).
# Меняется через merge request; CI валидирует схему и доступность upstream.
# Секреты (client_secret и т.п.) — НЕ здесь: ссылки вида env:VAR.
version: 1

defaults:
  permission_presets:
    readonly: { label: "Только чтение", default: true }
    readwrite: { label: "Чтение и запись" }

servers:
  - alias: tag
    type: "MCP"
    title: "ТЭГ"
    summary: "Каналы, треды, поиск и опросы корпоративного мессенджера"
    icon_color: "#1F4C86"
    description: "ТЭГ — корпоративный мессенджер Магнита. Подключив его, вы даёте ассистенту доступ ровно к тому, что видите сами: свои каналы и команды, переписку и треды, поиск по сообщениям и файлам, карточки коллег, вложения и результаты опросов. Чужих личных переписок коннектор не открывает — права наследуются от вашей учётной записи в ТЭГ.\n\nЧто это даёт. Спросить, чем закончилось обсуждение в канале, пока вас не было. Найти сообщение, которое вы точно писали, но не помните где. Собрать тред в короткий пересказ перед встречей. Отправить сообщение, поставить реакцию, создать опрос — если разрешите записывающие инструменты; по умолчанию они спрашивают."
    owner: "Мирослав Шишенков"
    contact: "https://tag.magnit.ru"
    docs_url: "https://github.com/mshishenkov1/magnit-tag-mcp"
    status: beta
    audience: ["all"]
    mode: native                     # сервер сам реализует MCP-авторизацию (FastMCP OAuthProxy)
    mcp_url: "${TAG_MCP_URL}"        # напр. https://tag-mcp.<domain>/mcp
    permission_model:
      kind: consent                  # права выбираются на экране согласия сервера
      presets:
        readonly: { write_mode: readonly }
        readwrite: { write_mode: confirm }

  - alias: gitlab
    type: "MCP"
    title: "GitLab Coderepo"
    summary: "Репозитории, merge requests, задачи и пайплайны"
    icon_color: "#E24329"
    description: "Репозитории, merge requests, issues, пайплайны GitLab coderepo."
    owner: "AI Lab"
    contact: "https://copilot-portal.ailab-copilot-prod.corp.tander.ru"
    docs_url: "https://copilot-portal.ailab-copilot-prod.corp.tander.ru/docs/mcp/gitlab-mcp-oblachno"
    status: beta   # ga — после выдачи OAuth-приложения администраторами
    audience: ["all"]
    mode: facade
    upstream_url: "https://mcp-gitlab.ailab-copilot-prod.corp.tander.ru/mcp"
    auth:
      type: oauth2
      authorize_url: "https://coderepo.corp.tander.ru/oauth/authorize"
      token_url: "https://coderepo.corp.tander.ru/oauth/token"
      revoke_url: "https://coderepo.corp.tander.ru/oauth/revoke"
      client_id: "${GITLAB_OAUTH_CLIENT_ID}"
      client_secret: "env:GITLAB_OAUTH_CLIENT_SECRET"
      pkce: true
      scopes:
        readonly: ["read_api", "read_user", "read_repository"]
        readwrite: ["api", "read_user"]
    credential_headers:
      Authorization: "Bearer {{access_token}}"
    permission_model:
      kind: header_groups
      header: Enabled-Groups
      always: ["core"]
      groups:
        - { id: code_review, title: "Code review: дискуссии в MR, approve", preset: readonly }
        - { id: devops, title: "DevOps: пайплайны, джобы, окружения", preset: readonly }
        - { id: users, title: "Пользователи и события проекта", preset: readonly }
        - { id: repo_write, title: "Запись: файлы, ветки, MR", preset: readwrite }
        - { id: issue_management, title: "Issues: создание и редактирование", preset: readwrite }
        - { id: releases, title: "Релизы", preset: readwrite }
        - { id: wiki, title: "Wiki", preset: readwrite }
        - { id: draft_notes, title: "Черновики комментариев", preset: readwrite }
        - { id: admin, title: "Админ: лейблы, майлстоуны, участники", preset: none }

  - alias: gitlab-platform
    type: "MCP"
    title: "GitLab Платформа"
    summary: "Репозитории, merge requests, задачи и пайплайны"
    icon_color: "#E24329"
    description: "GitLab Платформы: merge-реквесты, пайплайны, issues и файлы репозиториев, к которым у вас есть доступ. Ассистент читает описание задачи, разбирает упавший пайплайн и предлагает правку прямо в ветке.\n\nЧто это даёт. Понять, почему покраснела сборка, не открывая браузер. Собрать список своих merge-реквестов и того, что в них просят поправить."
    owner: "AI Lab"
    contact: "https://copilot-portal.ailab-copilot-prod.corp.tander.ru"
    docs_url: "https://copilot-portal.ailab-copilot-prod.corp.tander.ru/docs/mcp/gitlab-mcp-oblachno"
    status: beta   # ga — после выдачи OAuth-приложения администраторами
    audience: ["all"]
    mode: facade
    upstream_url: "https://mcp-gitlab-platform.ailab-copilot-prod.corp.tander.ru/mcp"
    auth:
      type: oauth2
      authorize_url: "https://gitlab.platform.corp/oauth/authorize"
      token_url: "https://gitlab.platform.corp/oauth/token"
      revoke_url: "https://gitlab.platform.corp/oauth/revoke"
      client_id: "${GITLAB_PLATFORM_OAUTH_CLIENT_ID}"
      client_secret: "env:GITLAB_PLATFORM_OAUTH_CLIENT_SECRET"
      pkce: true
      scopes:
        readonly: ["read_api", "read_user", "read_repository"]
        readwrite: ["api", "read_user"]
    credential_headers:
      Authorization: "Bearer {{access_token}}"
    permission_model: { $ref: "#/servers/gitlab/permission_model" }

  - alias: jira
    type: "MCP"
    title: "Jira"
    summary: "Задачи, проекты, спринты и заявки Service Desk"
    icon_color: "#1868DB"
    description: "Задачи Jira: поиск, чтение, комментарии и переходы по статусам в проектах, куда у вас есть доступ.\n\nЧто это даёт. Собрать свои задачи на спринт одним вопросом, вытащить историю обсуждения задачи, оформить описание по шаблону команды."
    owner: "AI Lab"
    contact: "https://copilot-portal.ailab-copilot-prod.corp.tander.ru"
    docs_url: "https://copilot-portal.ailab-copilot-prod.corp.tander.ru/docs/mcp/atlassian-mcp-oblachno"
    status: beta   # ga — после выдачи OAuth-приложения администраторами
    audience: ["all"]
    mode: facade
    upstream_url: "https://mcp-atlassian.ailab-copilot-prod.corp.tander.ru/mcp"
    auth:
      type: oauth2
      authorize_url: "https://jira.corp.tander.ru/rest/oauth2/latest/authorize"
      token_url: "https://jira.corp.tander.ru/rest/oauth2/latest/token"
      client_id: "${JIRA_OAUTH_CLIENT_ID}"
      client_secret: "env:JIRA_OAUTH_CLIENT_SECRET"
      pkce: true
      scopes:
        readonly: ["READ"]
        readwrite: ["WRITE"]
    credential_headers:
      X-Atlassian-Jira-Personal-Token: "{{access_token}}"
      X-Atlassian-Jira-Url: "https://jira.corp.tander.ru"
    permission_model:
      kind: header_groups
      header: Enabled-Groups
      groups:
        - { id: jira_read, title: "Чтение задач и проектов", preset: readonly }
        - { id: jira_agile, title: "Доски и спринты", preset: readonly }
        - { id: jira_service_desk, title: "Service Desk", preset: readonly }
        - { id: jira_write, title: "Создание и изменение задач", preset: readwrite }

  - alias: confluence
    type: "MCP"
    title: "Confluence"
    summary: "Поиск, чтение, комментарии и вложения базы знаний"
    icon_color: "#1868DB"
    description: "База знаний Confluence: поиск по пространствам, чтение страниц и вложений, к которым у вас есть доступ.\n\nЧто это даёт. Найти регламент, на который все ссылаются, и получить из него ответ, а не ссылку. Собрать выжимку из длинной страницы."
    owner: "AI Lab"
    contact: "https://copilot-portal.ailab-copilot-prod.corp.tander.ru"
    docs_url: "https://copilot-portal.ailab-copilot-prod.corp.tander.ru/docs/mcp/atlassian-mcp-oblachno"
    status: beta   # ga — после выдачи OAuth-приложения администраторами
    audience: ["all"]
    mode: facade
    upstream_url: "https://mcp-atlassian.ailab-copilot-prod.corp.tander.ru/mcp"
    auth:
      type: oauth2
      authorize_url: "https://it-portal.corp.tander.ru/rest/oauth2/latest/authorize"
      token_url: "https://it-portal.corp.tander.ru/rest/oauth2/latest/token"
      client_id: "${CONFLUENCE_OAUTH_CLIENT_ID}"
      client_secret: "env:CONFLUENCE_OAUTH_CLIENT_SECRET"
      pkce: true
      scopes:
        readonly: ["READ"]
        readwrite: ["WRITE"]
    credential_headers:
      X-Atlassian-Confluence-Personal-Token: "{{access_token}}"
      X-Atlassian-Confluence-Url: "https://it-portal.corp.tander.ru"
    permission_model:
      kind: header_groups
      header: Enabled-Groups
      groups:
        - { id: confluence_read, title: "Чтение страниц и поиск", preset: readonly }
        - { id: confluence_write, title: "Создание и редактирование страниц", preset: readwrite }
