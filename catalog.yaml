# Каталог корпоративных MCP-серверов (источник истины для Hub).
# Меняется через merge request; CI валидирует схему и доступность upstream.
# Секреты (client_secret и т.п.) — НЕ здесь: ссылки вида env:VAR.
version: 1

defaults:
  permission_presets:
    readonly: { label: "Только чтение", default: true }
    readwrite: { label: "Чтение и запись" }

servers:
  - alias: tag
    title: "ТЭГ (Mattermost)"
    description: "Сообщения, каналы, треды, поиск, файлы корпоративного мессенджера ТЭГ."
    owner: "Мирослав Шишенков"
    contact: "https://tag.magnit.ru"
    docs_url: "https://github.com/mshishenkov1/magnit-tag-mcp"
    status: beta
    audience: ["all"]
    mode: facade
    upstream_url: "${TAG_MCP_URL}"        # ТЭГ-MCP, поднятый с MM_HTTP_AUTH=passthrough
    auth_methods:
      - id: corp_oauth
        title: "Корпоративная авторизация ТЭГ"
        type: oauth2
        available: false
        unavailable_reason: "OAuth-приложение ТЭГ ещё не выдано администраторами"
        authorize_url: "https://tag.magnit.ru/oauth/authorize"
        token_url: "https://tag.magnit.ru/oauth/access_token"
        client_id: "${TAG_OAUTH_CLIENT_ID}"
        client_secret: "env:TAG_OAUTH_CLIENT_SECRET"
        pkce: true
        scopes: { readonly: [], readwrite: [] }
      - id: session_token
        title: "Токен сессии ТЭГ"
        type: user_token
        field:
          label: "Токен сессии ТЭГ"
          hint: "ТЭГ → Профиль → Настройки безопасности → Личные токены доступа; либо значение cookie MMAUTHTOKEN"
          docs_url: "https://github.com/mshishenkov1/magnit-tag-mcp#токен"
          secret: true
        verify:
          # Адрес проверки — переменная: токен обязан проверяться на том же экземпляре
          # Mattermost, с которым работает поднятый ТЭГ-MCP (в бою tag.magnit.ru,
          # на стенде tag-test.corp.tander.ru). Отклонение от текста R-U10 намеренное.
          url: "${TAG_VERIFY_URL}"
          method: GET
          headers:
            Authorization: "Bearer {{access_token}}"
          account_field: username
    credential_headers:
      Authorization: "Bearer {{access_token}}"
    permission_model:
      kind: tool_filter
      presets:
        readonly:
          tools: ["whoami", "server_*", "resolve_channel", "get_*", "list_*", "search_*",
                  "browse_public_channels", "summarize_*", "download_file"]
        readwrite:
          tools: ["*"]

  - alias: gitlab
    title: "GitLab (coderepo.corp.tander.ru)"
    description: "Репозитории, merge requests, issues, пайплайны GitLab coderepo."
    owner: "AI Lab"
    contact: "https://copilot-portal.ailab-copilot-prod.corp.tander.ru"
    docs_url: "https://copilot-portal.ailab-copilot-prod.corp.tander.ru/docs/mcp/gitlab-mcp-oblachno"
    status: beta   # ga — после выдачи OAuth-приложения администраторами
    audience: ["all"]
    mode: facade
    upstream_url: "https://mcp-gitlab.ailab-copilot-prod.corp.tander.ru/mcp"
    auth:
      type: oauth2
      authorize_url: "https://coderepo.corp.tander.ru/oauth/authorize"
      token_url: "https://coderepo.corp.tander.ru/oauth/token"
      revoke_url: "https://coderepo.corp.tander.ru/oauth/revoke"
      client_id: "${GITLAB_OAUTH_CLIENT_ID}"
      client_secret: "env:GITLAB_OAUTH_CLIENT_SECRET"
      pkce: true
      scopes:
        readonly: ["read_api", "read_user", "read_repository"]
        readwrite: ["api", "read_user"]
    credential_headers:
      Authorization: "Bearer {{access_token}}"
    permission_model:
      kind: header_groups
      header: Enabled-Groups
      always: ["core"]
      groups:
        - { id: code_review, title: "Code review: дискуссии в MR, approve", preset: readonly }
        - { id: devops, title: "DevOps: пайплайны, джобы, окружения", preset: readonly }
        - { id: users, title: "Пользователи и события проекта", preset: readonly }
        - { id: repo_write, title: "Запись: файлы, ветки, MR", preset: readwrite }
        - { id: issue_management, title: "Issues: создание и редактирование", preset: readwrite }
        - { id: releases, title: "Релизы", preset: readwrite }
        - { id: wiki, title: "Wiki", preset: readwrite }
        - { id: draft_notes, title: "Черновики комментариев", preset: readwrite }
        - { id: admin, title: "Админ: лейблы, майлстоуны, участники", preset: none }

  - alias: gitlab-platform
    title: "GitLab Platform (gitlab.platform.corp)"
    description: "Репозитории, merge requests, issues, пайплайны GitLab Platform."
    owner: "AI Lab"
    contact: "https://copilot-portal.ailab-copilot-prod.corp.tander.ru"
    docs_url: "https://copilot-portal.ailab-copilot-prod.corp.tander.ru/docs/mcp/gitlab-mcp-oblachno"
    status: beta   # ga — после выдачи OAuth-приложения администраторами
    audience: ["all"]
    mode: facade
    upstream_url: "https://mcp-gitlab-platform.ailab-copilot-prod.corp.tander.ru/mcp"
    auth:
      type: oauth2
      authorize_url: "https://gitlab.platform.corp/oauth/authorize"
      token_url: "https://gitlab.platform.corp/oauth/token"
      revoke_url: "https://gitlab.platform.corp/oauth/revoke"
      client_id: "${GITLAB_PLATFORM_OAUTH_CLIENT_ID}"
      client_secret: "env:GITLAB_PLATFORM_OAUTH_CLIENT_SECRET"
      pkce: true
      scopes:
        readonly: ["read_api", "read_user", "read_repository"]
        readwrite: ["api", "read_user"]
    credential_headers:
      Authorization: "Bearer {{access_token}}"
    permission_model: { $ref: "#/servers/gitlab/permission_model" }

  - alias: jira
    title: "Jira"
    description: "Задачи, проекты, спринты и Service Desk Jira (jira.corp.tander.ru)."
    owner: "AI Lab"
    contact: "https://copilot-portal.ailab-copilot-prod.corp.tander.ru"
    docs_url: "https://copilot-portal.ailab-copilot-prod.corp.tander.ru/docs/mcp/atlassian-mcp-oblachno"
    status: beta   # ga — после выдачи OAuth-приложения администраторами
    audience: ["all"]
    mode: facade
    upstream_url: "https://mcp-atlassian.ailab-copilot-prod.corp.tander.ru/mcp"
    auth_methods:
      - id: corp_oauth
        title: "Корпоративная авторизация Jira"
        available: false
        unavailable_reason: "OAuth-приложение Jira ещё не выдано администраторами"
        type: oauth2
        authorize_url: "https://jira.corp.tander.ru/rest/oauth2/latest/authorize"
        token_url: "https://jira.corp.tander.ru/rest/oauth2/latest/token"
        client_id: "${JIRA_OAUTH_CLIENT_ID}"
        client_secret: "env:JIRA_OAUTH_CLIENT_SECRET"
        pkce: true
        scopes:
          readonly: ["READ"]
          readwrite: ["WRITE"]
      - id: personal_token
        title: "Персональный токен Jira"
        type: user_token
        field:
          label: "Персональный токен Jira"
          hint: "Jira → Профиль → Personal Access Tokens → Create token"
          docs_url: "https://jira.corp.tander.ru/secure/ViewProfile.jspa"
          secret: true
        verify:
          url: "https://jira.corp.tander.ru/rest/api/2/myself"
          method: GET
          headers:
            Authorization: "Bearer {{access_token}}"
          account_field: name
    credential_headers:
      X-Atlassian-Jira-Personal-Token: "{{access_token}}"
      X-Atlassian-Jira-Url: "https://jira.corp.tander.ru"
    permission_model:
      kind: header_groups
      header: Enabled-Groups
      groups:
        - { id: jira_read, title: "Чтение задач и проектов", preset: readonly }
        - { id: jira_agile, title: "Доски и спринты", preset: readonly }
        - { id: jira_service_desk, title: "Service Desk", preset: readonly }
        - { id: jira_write, title: "Создание и изменение задач", preset: readwrite }

  - alias: confluence
    title: "Confluence"
    description: "Поиск и чтение страниц, комментарии и вложения Confluence (it-portal.corp.tander.ru)."
    owner: "AI Lab"
    contact: "https://copilot-portal.ailab-copilot-prod.corp.tander.ru"
    docs_url: "https://copilot-portal.ailab-copilot-prod.corp.tander.ru/docs/mcp/atlassian-mcp-oblachno"
    status: beta   # ga — после выдачи OAuth-приложения администраторами
    audience: ["all"]
    mode: facade
    upstream_url: "https://mcp-atlassian.ailab-copilot-prod.corp.tander.ru/mcp"
    auth_methods:
      - id: corp_oauth
        title: "Корпоративная авторизация Confluence"
        available: false
        unavailable_reason: "OAuth-приложение Confluence ещё не выдано администраторами"
        type: oauth2
        authorize_url: "https://it-portal.corp.tander.ru/rest/oauth2/latest/authorize"
        token_url: "https://it-portal.corp.tander.ru/rest/oauth2/latest/token"
        client_id: "${CONFLUENCE_OAUTH_CLIENT_ID}"
        client_secret: "env:CONFLUENCE_OAUTH_CLIENT_SECRET"
        pkce: true
        scopes:
          readonly: ["READ"]
          readwrite: ["WRITE"]
      - id: personal_token
        title: "Персональный токен Confluence"
        type: user_token
        field:
          label: "Персональный токен Confluence"
          hint: "Confluence → Профиль → Personal Access Tokens → Create token"
          docs_url: "https://it-portal.corp.tander.ru/plugins/personalaccesstokens/manage-tokens.action"
          secret: true
        verify:
          url: "https://it-portal.corp.tander.ru/rest/api/user/current"
          method: GET
          headers:
            Authorization: "Bearer {{access_token}}"
          account_field: username
    credential_headers:
      X-Atlassian-Confluence-Personal-Token: "{{access_token}}"
      X-Atlassian-Confluence-Url: "https://it-portal.corp.tander.ru"
    permission_model:
      kind: header_groups
      header: Enabled-Groups
      groups:
        - { id: confluence_read, title: "Чтение страниц и поиск", preset: readonly }
        - { id: confluence_write, title: "Создание и редактирование страниц", preset: readwrite }
